function boshHTML(d){
  return `
  <h3>${fv(d.shartnoma_raqami,'шартнома рақами')}-sonli SHARTNOMA</h3>
  <p class="center">«BIRZUM NASIYA» loyihasi doirasida axborot-konsultatsiya xizmatlarini ko‘rsatish to‘g‘risida</p>
  <p class="doc-date">Farg‘ona shahri &nbsp; ${fmtDate(d.shartnoma_sanasi)} yil</p>
  <p>Bir tomondan Ustav asosida faoliyat yurituvchi «FORTUNA BIZNES mikromoliya tashkiloti» MChJ, bundan buyon
  «Kreditor» deb ataluvchi nomidan ijrochi direktor U.R.Maxmudov, va ikkinchi tomondan Ustav/Guvohnoma asosida faoliyat
  yurituvchi ${fv(d.tashkilot_nomi,'Tashkilot nomi')}, bundan buyon «Savdo-xizmat ko‘rsatish korxonasi» kelgusida «SXKK» deb ataluvchi nomidan
  ${fv(d.rahbar_fish,'Rahbar F.I.Sh.')}, birgalikda «Tomonlar», alohida-alohida esa «Tomon» deb atalib, quyidagilar to‘g‘risida ushbu shartnomani tuzdilar.</p>

  <h4>ATAMALAR VA TA’RIFLAR</h4>
  <p>Mazkur Shartnomada quyidagi atamalar va ularning ta’riflari qo‘llaniladi:</p>
  <p><b>«BIRZUM NASIYA» muddatli to‘lov tizimi</b> — mutloq mulk huquqi «FORTUNA BIZNES mikromoliya tashkiloti» MChJga
  tegishli bo‘lgan dasturiy mahsulot bo‘lib, Kreditor, SXKK va ularning mijozlari o‘rtasidagi o‘zaro hamkorlikni ta’minlash,
  shuningdek Kreditor tomonidan mikromoliyaviy xizmatlar ko‘rsatishda foydalanish uchun mo‘ljallangan va internet tarmog‘idagi
  quyidagi manzil asosida faoliyat yuritadi: https://merchant.birzumnasiya.uz</p>
  <p><b>Mijoz (kredit oluvchi)</b> — O‘zbekiston Respublikasi rezidenti bo‘lgan, Kreditor tomonidan mikromoliyaviy xizmat
  ko‘rsatiladigan jismoniy shaxs;</p>
  <p><b>Mikromoliyaviy xizmat</b> — O‘zbekiston Respublikasi qonunchiligiga muvofiq Kreditor tomonidan Mijozga ko‘rsatiladigan
  xizmat bo‘lib, jumladan mikroqarzlar va kreditlar berishni o‘z ichiga oladi;</p>
  <p><b>Kredit</b> — SXKK dan tovarlar (ishlar, xizmatlar) sotib olish uchun Kreditor tomonidan Mijozga yoki SXKKga
  qaytarishlilik, to‘lovlilik shartlari asosida taqdim etiladigan pul mablag‘lari;</p>
  <p><b>Hisobot oyi (davri)</b> — Shartnomaga muvofiq xizmatlar ko‘rsatilgan kalendar oy;</p>
  <p><b>Kreditor xodimi</b> — Kreditor bilan mehnat munosabatlarida bo‘lgan va ariza beruvchilardan mikromoliyaviy xizmat
  ko‘rsatish masalasini ko‘rib chiqish uchun zarur hujjatlar va ma’lumotlarni qabul qilish, Kreditorning moliyaviy faoliyati bo‘yicha
  tushuntirish berish, SXKK mijozlariga maslahat berish hamda ularga xizmatlardan oqilona foydalanish bo‘yicha amaliy yordam
  ko‘rsatishga vakolatli shaxs;</p>
  <p><b>SXKK xodimi</b> — SXKK bilan mehnat munosabatlarida bo‘lgan, bu holat uning shartnomada nazarda tutilgan vazifalarni
  bajarishga ruxsati mavjudligi bilan tasdiqlanadigan va SXKK tomonidan tegishli buyruq yoki boshqa hujjat asosida vakolat
  berilgan shaxs bo‘lib, ariza beruvchilardan hujjatlar va ma’lumotlarni qabul qilish, ularga mikroqarz/kredit berish va undan
  foydalanish shartlari bo‘yicha axborot va maslahatlar berish, shuningdek SXKK hududida barcha zarur hujjatlarni rasmiylashtirish
  huquqiga ega;</p>
  <p><b>Kelishilgan aloqa kanallari</b> — Kreditor va SXKK ning elektron pochta manzillari, shuningdek ushbu shartnomaga
  muvofiq hujjatlar va bildirishnomalar almashinuvi amalga oshiriladigan boshqa texnik aloqa vositalari;</p>
  <p><b>Tovar</b> — SXKK savdo obyektlarida Mijoz tomonidan sotib olinadigan tovarlar/xizmatlar bo‘lib, O‘zbekiston Respublikasi
  qonunchiligi talablariga muvofiq ruxsat etilmagan tovarlar bundan mustasno;</p>
  <p>Mazkur bo‘limda ko‘rsatilmagan atamalar ushbu shartnoma matnida O‘zbekiston Respublikasi qonunchiligiga muvofiq
  ma’nolarda qo‘llaniladi.</p>

  <h4>1. SHARTNOMA PREDMETI</h4>
  <p>1.1. Mazkur shartnoma doirasida SXKK Kreditorga «BIRZUM NASIYA muddatli to‘lov tizimi» orqali SXKK va uning
  Mijozlariga quyidagi axborot va konsultatsiya xizmatlari majmuasini tashkil etishni topshiradi, jumladan:</p>
  <p>— SXKK ni «BIRZUM NASIYA muddatli to‘lov tizimi» doirasida Kreditor hamkorlari tarkibiga kiritish;</p>
  <p>— SXKK Mijozlari tomonidan Kreditordan mikromoliyaviy xizmatlar olish, shu jumladan «BIRZUM NASIYA» muddatli
  to‘lov tizimi mahsuloti doirasida;</p>
  <p>— Mijozlarga mikromoliyalashtirish masalalari bo‘yicha maslahat berish;</p>
  <p>— Mijozlar tomonidan olingan mikroqarzlar/kreditlar, shuningdek ularning o‘z mablag‘larini SXKK tomonidan sotiladigan
  tovarlar uchun to‘lovga «BIRZUM NASIYA muddatli to‘lov tizimi» orqali yo‘naltirish;</p>
  <p>— Mijozlar tomonidan Kreditordan olingan mikroqarzlar/kreditlarni qaytarish.</p>
  <p>1.2. Tomonlar «BIRZUM NASIYA muddatli to‘lov tizimi» mahsuloti doirasida mikroqarzlar va kreditlarni Mijozlarga
  quyidagi shartlarda taqdim etilishini kelishib oldilar:</p>
  <p>— mikroqarz/kredit muddati — 3, 6, 9, 12, 18 va 24 oy;</p>
  <p>— mikroqarz/kreditlar SXKK savdo obyektlarida Kreditor tomonidan taqdim etiladigan mikrozaym/kredit hisobidan to‘liq
  yoki qisman to‘lovni amalga oshirish orqali, «BIRZUM NASIYA muddatli to‘lov tizimi» vositasida foydalaniladi.</p>

  <h4>2. SHARTNOMANI IJRO ETISHNING UMUMIY TARTIBI</h4>
  <p>2.1. Mazkur shartnoma Tomonlar tomonidan imzolangan vaqtdan boshlab tuzilgan hisoblanadi.</p>
  <p>2.2. Tomonlar shartnomani yuritish uchun mas’ul shaxslarni belgilaydilar va kelishilgan aloqa kanallari orqali ularning
  ma’lumotlarini (F.I.Sh., lavozimi, telefon raqami, elektron pochta manzili) shartnoma tuzilganidan keyin kechiktirmay 5 (besh)
  ish kuni ichida bir-biriga taqdim etadilar, shuningdek, Tomonlar o‘rtasida hamkorlik uchun zarur bo‘lgan boshqa ma’lumotlarni
  ham yuboradilar.</p>
  <p>2.3. Tomonlar shartnoma imzolanganidan keyin 5 (besh) ish kuni ichida o‘zaro hamkorlik bo‘yicha ma’lumotlarni bir-biriga
  taqdim etadilar.</p>
  <p>2.4. Tomonlar quyidagilar bilan kelishadilar:</p>
  <p>2.4.1. Shartnomada ko‘rsatilgan elektron pochta manzillariga yuborilgan barcha
  yozishmalar, bildirishnomalar va ogohlantirishlar, shu jumladan Tomonlar rekvizitlarini o‘zgartirishga oid ma’lumotlar, manzil
  egasiga to‘g‘ri yetkazilgan hisoblanadi.</p>
  <p>2.5. Tomonlar o‘z elektron pochta manzillari va/yoki boshqa kelishilgan aloqa kanallariga kelayotgan yozishmalarni o‘z
  vaqtida (kunda kamida bir marta) tekshirish majburiyatini oladilar.</p>
  <p>2.6. Agar SXKK xodimi ishdan bo‘shatilsa yoki shartnomada nazarda tutilgan vazifalardan, hamda Buyruqda ko‘rsatilgan
  vakolatlardan chetlashtirilsa, SXKK ushbu Buyruqni bekor qilishi va Kreditorni ushbu holat haqida Buyruq amal qilgan kunidan
  kechiktirmay kelishilgan aloqa kanallari orqali xabardor qilishi lozim, Buyruq raqami va sanasini ko‘rsatgan holda.</p>
  <p>2.7. Kreditor Mijozga mikroqarz/kredit berishni rad etishga haqli bo‘lib, buni Mijoz va SXKK ga izoh berish shart emas.</p>
  <p>2.8. Mazkur Shartnoma doirasida SXKK barcha kredit tashkilotlari (O‘zbekiston Respublikasi banklari), hisob raqamlari
  ochilgan yoki keyinchalik ochiladigan banklar bilan, Kreditor foydasiga mablag‘larni avtomatik yechib olish bo‘yicha
  kelishuvlarni tuzishni ta’minlash majburiyatini oladi. Bu mablag‘lar: Kreditorning mukofoti va/yoki tovarni qaytarish, rad etish
  holatida mablag‘lar (Shartnoma 2.10-bandiga muvofiq), shuningdek mazkur shartnoma doirasida SXKK oldidagi boshqa
  qarzdorliklarni o‘z ichiga oladi.</p>
  <p>2.9. Tovar qaytarilganda yoki mijoz undan voz kechganda, SXKK Kreditordan haqiqatda kelib tushgan mablag‘ni Mijozning
  mikroqarzini yopish uchun Kreditorning hisob raqamiga qaytaradi. Tovarni qaytarish O‘zbekiston Respublikasi qonunchiligiga
  muvofiq amalga oshiriladi.</p>
  <p>2.10. Tovar qaytarilganda, SXKK o‘zi olgan mablag‘ni hamda Kreditor ushlab qolgan komissiya summasining 5% (besh
  foizi) miqdoridagi konsalting xizmati haqini Kreditorning hisob raqamiga o‘tkazadi. Kreditor ilgari olingan komissiyani 100%
  miqdorda daromaddan qaytarish orqali Mijozning kreditini to‘liq yopishni ta’minlaydi.</p>
  <p>2.11. Kreditor tovar/xizmat Mijozga mikroqarz/kredit hisobidan sotilganligi haqidagi ma’lumotni so‘rashi mumkin, va
  SXKK ushbu ma’lumotni 3 (uch) kalendar kun ichida taqdim etishga majburdir.</p>

  <h4>3. TO‘LOVLAR TARTIBI</h4>
  <p>3.1. Mazkur shartnoma doirasida ko‘rsatilgan xizmatlar uchun SXKK Kreditorga mukofot to‘lashi shart bo‘lib, ushbu
  mukofot miqdori «BIRZUM NASIYA muddatli to‘lov tizimi» mahsuloti doirasida Mijoz tomonidan Kreditor hisobidan SXKK
  dan tovar/xizmat sotib olish uchun olingan mikroqarz/kredit summasiga tariflar jadvalida ko‘rsatilgan foizlar asosida belgilanadi.</p>
  <table>
    <tr><th>Kredit muddati</th><th>Komissiya miqdori</th></tr>
    <tr><td>24 oy</td><td>41.8 %</td></tr>
    <tr><td>18 oy</td><td>35.4 %</td></tr>
    <tr><td>12 oy</td><td>27.5 %</td></tr>
    <tr><td>9 oy</td><td>23 %</td></tr>
    <tr><td>6 oy</td><td>20 %</td></tr>
    <tr><td>3 oy</td><td>13 %</td></tr>
  </table>
  <p>3.2. Mukofot to‘lovi Mijoz SXKK ga tovar/xizmatlar uchun to‘lov qilgan kuni amalga oshiriladi va bu Kreditorga mukofot
  summasini Mijoz tomonidan SXKK foydasiga yuboriladigan mikroqarz/kredit mablag‘laridan ushlab qolish orqali amalga
  oshiriladi.</p>
  <p>3.3. Kreditor har oy SXKK ga elektron shaklda xizmat ko‘rsatish akti va hisob-faktura taqdim etadi. SXKK ushbu aktni olgan
  kundan boshlab 3 (uch) ish kuni ichida imzolashi, muhr bilan tasdiqlashi va kelishilgan aloqa kanali orqali Kreditorga jo‘natishi
  shart. Agar SXKK aktdagi ma’lumotlarga rozi bo‘lmasa, u aktni kelishilgan aloqa kanali orqali asosli e’tirozlar bilan qaytarishi
  lozim shu muddat ichida. Belgilangan muddatda asosli e’tiroz yubormaslik SXKK ning akt va mukofot miqdoriga roziligi sifatida
  qabul qilinadi. Xizmatlar SXKK tomonidan imzolangan akt kelgan kuni ko‘rsatilgan va qabul qilingan hisoblanadi.</p>
  <p>3.4. Agar hisob-kitob sanasi bankning dam olish kuni (shanba, yakshanba) yoki bayram kuni (O‘zbekiston Respublikasi
  qonunlariga muvofiq belgilangan davlat bayramlari va dam olish kunlari) ga to‘g‘ri kelsa, hisob-kitob sanasi ushbu dam
  olish/bayram kunidan keyingi birinchi ish kuniga ko‘chiriladi.</p>
  <p>3.5. Kreditorga mablag‘larni o‘tkazish bo‘yicha barcha xarajatlar, jumladan banklararo komissiyalar, SXKK zimmasiga
  yuklatiladi.</p>
  <p>3.6. To‘lov amalga oshirilgan sana sifatida mablag‘larning Kreditor hisob-raqamiga tushgan sanasi qabul qilinadi.</p>
  <p>3.7. Tomonlar kelishuviga ko‘ra yuborilgan hisob-faktura uchun alohida haq (to‘lov) talab etilmaydi. Mazkur hisob-faktura

  <p>3.8. Kreditor ajratilgan mikroqarz/kredit summasidan o‘ziga tegishli bo‘lgan mukofot (komissiya) summasini ushlab qolgan

  <h4>4. MA’LUMOTNI MAXFIYLIGI</h4>
  <p>4.1. Tomonlar shartnoma ijrosi davomida olingan ma’lumotlarni qat’iy maxfiy saqlashga va ushbu ma’lumotlarning oshkor

  <p>4.3. Shartnoma va uning ijrosi bilan bog‘liq barcha ma’lumotlar, jumladan, hujjatlarni rasmiylashtirish jarayonida olingan

  <p>4.4. Maxfiy ma’lumotlarni oshkor qilish deganda, harakat yoki harakatsizlik natijasida maxfiy ma’lumotlarning istalgan

  <p>4.5. Agar Kreditor va/yoki SXKKga Tomonlar xodimlaridan biri tomonidan axborot maxfiyligining amaldagi yoki ehtimoliy

  <p>4.6. Kreditor tomonidan SXKK ga «BIRZUM NASIYA muddatli to‘lov tizimi»ga kirish uchun berilgan hisob ma’lumotlari

  <p>4.7. SXKK hisob ma’lumotlarini maxfiy va xavfsiz saqlashni ta’minlashi, ularni uchinchi shaxslarga oshkor qilmasligi va

  <h4>5. TOMONLARNING JAVOBGARLIGI</h4>

  <p>5.2. Shartnoma talablarini bajarmaslik natijasida kelib chiqadigan noxush oqibatlar bilan bog‘liq barcha xavf-xatarni
  bunday buzilish sodir qilgan Tomon o‘z zimmasiga oladi.</p>
  <p>5.3. Mazkur shartnoma doirasida SXKK, SXKK va Kreditor o‘rtasidagi axborot almashish tizimiga ruxsatsiz shaxslar

  <p>5.4. Har qanday isbotlangan zarar qoplanishi shart. Tomonlar ushbu Shartnoma shartlari buzilgan taqdirda yuzaga kelgan

  <p>5.5. 2021-yil 04.10 sanasidagi PQ-5252-sonli Prezident qaroriga muvofiq, SXKK barcha savdolarini o‘zining kassa
  apparati yordamida mustaqil ravishda fiskallashtirishga majburdir.</p>
  <p>5.6. SXKK hisob ma’lumotlari yordamida tizimda amalga oshirilgan barcha harakatlar SXKK tomonidan amalga oshirilgan
  hisoblanadi va ularga tegishli huquqiy oqibatlarni keltirib chiqaradi.</p>
  <p>5.7. SXKK quyidagi holatlar natijasida Kreditor va/yoki uchinchi shaxslarga yetkazilgan har qanday zarar uchun javobgar

  <p>5.8. SXKK hisob ma’lumotlari yo‘qolgan, kompromatatsiya qilingan yoki ruxsatsiz kirish aniqlangan hollarda Kreditorni

  <p>5.9. Kreditor xavfsizlik tahdidi, shubhali faoliyat yoki ushbu Shartnoma shartlari buzilganini aniqlagan taqdirda SXKK ning

  <p>5.10. Tomonlar tan oladiki, Kreditor tizimi ma’lumotlari (operatsiyalar jurnallari (loglar), tizimga kirish ma’lumotlari,

  <p>5.11. SXKK hisob ma’lumotlarini olish uchun belgilangan aloqa kanallari (elektron pochta va Telegram) ishonchliligi va

  <p>5.12. Agar hisob ma’lumotlari yoki SXKK ning aloqa kanallarining kompromatatsiyasi Kreditor aybisiz sodir bo‘lgan bo‘lsa,

  <p>5.13. SXKK tomonidan «BIRZUM NASIYA muddatli to‘lov tizimi» orqali amalga oshirilgan harakatlarda quyidagi holatlar

  <p>— Mijozga mikroqarz shartnomasi va to‘lov jadvalini yozma yoki elektron shaklda taqdim etmaslik;</p>
  <p>— Mijoz murojaati, e’tirozi yoki vakolatli davlat organlarining talabi asosida nizoli holat yuzaga kelishi.</p>
  <p>5.14. Kreditor ushbu shartnomaning 5.13-bandida ko‘rsatilgan nizoli holat to‘liq bartaraf etilgunga qadar, SXKKning

  <p>5.15. Mablag‘larni ushlab turish muddati hamda tizimdan foydalanish huquqining cheklanishi nizoli holat Tomonlar yoki

  <h4>6. FORS-MAJOR HOLATLARI</h4>
  <p>6.1. Tomonlar, agar o‘z majburiyatlarini bajarmaslik yoki noto‘g‘ri bajarish holati kutilmagan va mazkur sharoitlarda oldini

  <p>— Agar SXKK kiritilgan o‘zgartirishlarga rozi bo‘lmasa (bu haqda SXKK xabarni olgan kundan boshlab 3 (uch) kalendar

  <p>— Tomonlar, shuningdek, bank rekvizitlari, joylashuv (manzil), telefon raqamlari, elektron pochta manzillari, shartnoma

  <p>7.3. Mazkur shartnoma imzolanganidan keyin Tomonlar o‘rtasida oldin tuzilgan, shunga o‘xshash predmetga ega

  <p>7.4. Nizolarni hal qilish tartibi: Tomonlar shartnoma ijrosi davomida yuzaga kelishi mumkin bo‘lgan nizolarni muzokaralar

// Bu ilova mustaqil HTML fayl sifatida brauzerda ochiladi, shuning uchun
// ma'lumotlar brauzerning o'z xotirasida (localStorage) saqlanadi — internetsiz
// ham ishlaydi, faqat shu kompyuter/shu brauzerga tegishli bo'ladi.
let activeTab = 'bosh';
let bonusSubTab = 'bonus'; // 'bonus' | 'cancel'
const DB = {bosh:[], qoshimcha:[], bonus:[], hamkor:[]};
const STORAGE_PREFIX = 'birzum_nasiya_';
let storageWarned = false;

function loadAll(){
  SECTIONS.forEach(s=>{
    if(!s.storageKey) return; // Profil kabi hujjat tarixi bo'lmagan bo'limlar
    try{
      const raw = localStorage.getItem(STORAGE_PREFIX + s.storageKey);
      DB[s.key] = raw ? JSON.parse(raw) : [];
    }catch(e){
      DB[s.key] = [];
    }
    initCounterFromExisting(s.key);
  });
}
function persist(key){
  const s = SECTIONS.find(x=>x.key===key);
  try{
    localStorage.setItem(STORAGE_PREFIX + s.storageKey, JSON.stringify(DB[key]));
    scheduleAutoBackup(key);
    cloudPushSection(key);
    return true;
  }catch(e){
    if(!storageWarned){
      storageWarned = true;
      alert('Diqqat: hujjatlarni saqlash imkoni bo‘lmadi (brauzer xotirasi bloklangan). PDF baribir yuklanadi, lekin tarixga yozilmaydi.');
    }
    return false;
  }
}

/* ============================= BULUTDA SAQLASH (BARCHA QURILMALARDA) =============================
   Ilova asosan localStorage'da (shu brauzer/qurilmada) ishlaydi — bu o'zgarmaydi.
   Qo'shimcha ravishda, agar Profil bo'limida Firebase (Firestore) loyihasi
   ulangan bo'lsa, har bir bo'lim (Hamkorlar, Bosh kelishuv, Qo'shimcha kelishuv,
   Bonus) o'zgarganda shu ma'lumot bulutga (Firestore'ga) ham yoziladi va sahifa
   ochilganda avval bulutdan eng so'nggi holat o'qib olinadi — shu orqali bir
   qurilmada kiritilgan hamkor boshqa qurilmada ham ko'rinadi. Firebase
   ulanmagan bo'lsa, ilova avvalgidek faqat shu qurilmada (localStorage) ishlayveradi.
*/
const CLOUD_CONFIG_KEY = STORAGE_PREFIX + 'cloud_config';
const CLOUD_COLLECTION = 'birzum_nasiya_data';
let cloudApp = null;
let cloudDb = null;
let cloudReady = false;
let cloudStatus = 'off'; // 'off' | 'connecting' | 'online' | 'error'
let cloudStatusMsg = '';
let cloudUnsubscribers = [];
let cloudPulledOnce = false;

// Ilovaga o'rnatib qo'yilgan (kod ichiga singdirilgan) Firebase konfiguratsiyasi.
// Shu tufayli har bir yangi qurilma/brauzerda Profil bo'limiga qo'lda
// firebaseConfig kiritish shart emas — sayt ochilishi bilan avtomatik
// shu loyihaga ulanadi. Agar kimdir Profil bo'limidan boshqa (masalan test)
// konfiguratsiyani qo'lda joylashtirsa, o'sha ustunlik qiladi.
const DEFAULT_CLOUD_CONFIG = {
  apiKey: "AIzaSyDel7Qc1DG2sxKNlL1iEYtzq_3vJ_BUn3A",
  authDomain: "shartnoma-web.firebaseapp.com",
  projectId: "shartnoma-web",
  storageBucket: "shartnoma-web.firebasestorage.app",
  messagingSenderId: "535357750557",
  appId: "1:535357750557:web:f73dd50cb80180c281f5f4",
  measurementId: "G-0VFQL9QWYD"
};

function getCloudConfig(){
  try{
    const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return DEFAULT_CLOUD_CONFIG;
}
function setCloudConfig(cfg){
  try{ localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg)); return true; }
  catch(e){ return false; }
}
function clearCloudConfig(){
  try{ localStorage.removeItem(CLOUD_CONFIG_KEY); }catch(e){}
}

function stopCloudRealtime(){
  cloudUnsubscribers.forEach(u=>{ try{ u(); }catch(e){} });
  cloudUnsubscribers = [];
}

async function initCloud(){
  stopCloudRealtime();
  cloudApp = null; cloudDb = null; cloudReady = false; cloudPulledOnce = false;
  const cfg = getCloudConfig();
  if(!cfg){ cloudStatus = 'off'; cloudStatusMsg = ''; updateCloudStatusUI(); return; }
  if(typeof firebase === 'undefined'){
    cloudStatus = 'error'; cloudStatusMsg = 'Bulut kutubxonasi yuklanmadi (internet aloqasini tekshiring).';
    updateCloudStatusUI();
    return;
  }
  cloudStatus = 'connecting'; cloudStatusMsg = ''; updateCloudStatusUI();
  try{
    // Qayta ulanganda (masalan, konfiguratsiya o'zgartirilganda) eski ilova
    // nusxasi to'liq o'chirilib, har safar yangi, toza ulanish yaratiladi.
    if(firebase.apps && firebase.apps.length){
      for(const a of firebase.apps.slice()){ try{ await a.delete(); }catch(e){} }
    }
    cloudApp = firebase.initializeApp(cfg);
    cloudDb = firebase.firestore(cloudApp);
    await cloudPullAll();
    cloudReady = true;
    cloudStatus = 'online'; cloudStatusMsg = '';
    subscribeCloudRealtime();
  }catch(e){
    console.error(e);
    cloudReady = false;
    cloudStatus = 'error';
    cloudStatusMsg = (e && e.message) ? e.message : String(e);
  }
  updateCloudStatusUI();
}

// Ilova ochilganda bulutdagi ENG SO'NGGI holatni bir marta to'liq o'qib, mahalliy
// (shu qurilmadagi) ma'lumotni shu bilan almashtiradi — shu orqali boshqa
// qurilmada qo'shilgan hamkorlar shu yerda ham ko'rinadi.
async function cloudPullAll(){
  if(!cloudDb) return;
  const keys = SECTIONS.filter(s=>s.storageKey).map(s=>s.key);
  for(const key of keys){
    try{
      const snap = await cloudDb.collection(CLOUD_COLLECTION).doc(key).get();
      if(snap.exists){
        const data = snap.data();
        DB[key] = Array.isArray(data.records) ? data.records : [];
        try{ localStorage.setItem(STORAGE_PREFIX + (SECTIONS.find(s=>s.key===key).storageKey), JSON.stringify(DB[key])); }catch(e){}
      }
      initCounterFromExisting(key);
    }catch(e){
      console.error('Bulutdan o‘qishda xatolik ('+key+'):', e);
    }
  }
  cloudPulledOnce = true;
}

// Bo'lim o'zgarganda (qo'shish/tahrirlash/o'chirish/import) shu bo'limning
// butun ro'yxati bulutga yoziladi — bu localStorage'ga yozishning aynan o'zi
// kabi, faqat manzil Firestore hujjati.
function cloudPushSection(key){
  if(!cloudReady || !cloudDb) return;
  cloudDb.collection(CLOUD_COLLECTION).doc(key).set({
    records: DB[key] || [],
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(e=>{
    console.error('Bulutga yozishda xatolik ('+key+'):', e);
    cloudStatus = 'error';
    cloudStatusMsg = (e && e.message) ? e.message : String(e);
    updateCloudStatusUI();
  });
}

// Boshqa qurilmada ma'lumot o'zgarsa, shu yerda sahifani qayta ochmasdan ham
// ro'yxat (tarix/hamkorlar jadvali) avtomatik yangilanadi. Forma maydonlariga
// tegilmaydi — shuning uchun kimdir formani to'ldirib turgan bo'lsa ham buzilmaydi.
function subscribeCloudRealtime(){
  if(!cloudDb) return;
  const keys = SECTIONS.filter(s=>s.storageKey).map(s=>s.key);
  keys.forEach(key=>{
    const unsub = cloudDb.collection(CLOUD_COLLECTION).doc(key).onSnapshot(snap=>{
      // O'zimiz hozirgina yozgan (hali serverga tasdiqlanmagan) o'zgarishni
      // qayta ishlamaymiz — aks holda cheksiz aylanishga olib kelishi mumkin.
      if(snap.metadata && snap.metadata.hasPendingWrites) return;
      if(!cloudPulledOnce) return;
      if(!snap.exists) return;
      const data = snap.data();
      DB[key] = Array.isArray(data.records) ? data.records : [];
      try{ localStorage.setItem(STORAGE_PREFIX + (SECTIONS.find(s=>s.key===key).storageKey), JSON.stringify(DB[key])); }catch(e){}
      initCounterFromExisting(key);
      renderTabs();
      if(key==='hamkor' && activeTab==='hamkor') renderHamkorTable();
      else if(activeTab===key) renderHistory(key);
    }, err=>{
      console.error('Bulut tinglashda xatolik ('+key+'):', err);
    });
    cloudUnsubscribers.push(unsub);
  });
}

function cloudStatusLabel(){
  if(cloudStatus==='online') return {cls:'ok', text:'✅ Ulangan — ma’lumotlar barcha qurilmalarda avtomatik sinxronlanadi.'};
  if(cloudStatus==='connecting') return {cls:'', text:'⏳ Ulanmoqda…'};
  if(cloudStatus==='error') return {cls:'err', text:'⚠️ Ulanishda xatolik: '+esc(cloudStatusMsg)};
  return {cls:'', text:'Ulanmagan — ma’lumotlar faqat shu qurilmada (brauzerda) saqlanadi.'};
}
function updateCloudStatusUI(){
  const el = document.getElementById('cloudStatus');
  if(!el) return;
  const s = cloudStatusLabel();
  el.className = 'status ' + s.cls;
  el.textContent = s.text;
}

/* ============================= HAR BIR BO'LIMNI ALOHIDA FAYLGA ZAXIRALASH / TIKLASH =============================
   Ilova ma'lumotlari brauzer xotirasida (localStorage) saqlanadi, ammo bu brauzer
   tozalansa yo'qolishi mumkin. Shu sababli har bir bo'lim (Hamkorlar, Bosh
   kelishuv, Qo'shimcha kelishuv, Bonus) O'ZINING ALOHIDA JSON fayliga yoziladi —
   bitta umumiy faylga emas. Papka tanlangan bo'lsa, shu bo'limda biror
   o'zgarish (qo'shish/tahrirlash/o'chirish/import) bo'lganda faqat o'sha
   bo'limning fayli avtomatik qayta yoziladi.
*/
const BACKUP_FILE_NAME = {
  hamkor: 'BirZum_Nasiya_Hamkorlar.json',
  bosh: 'BirZum_Nasiya_Bosh_kelishuv.json',
  qoshimcha: 'BirZum_Nasiya_Qoshimcha_kelishuv.json',
  bonus: 'BirZum_Nasiya_Bonus.json'
};
function buildSectionBackupPayload(key){
  const s = SECTIONS.find(x=>x.key===key);
  let counter = 0;
  try{ counter = parseInt(localStorage.getItem(counterStorageKey(key)) || '0', 10) || 0; }catch(e){ counter = 0; }
  return {
    app: 'birzum_nasiya_backup',
    version: 2,
    section: key,
    sectionLabel: s ? s.label : key,
    exportedAt: new Date().toISOString(),
    counter,
    records: DB[key] || []
  };
}
const autoBackupTimers = {};
function scheduleAutoBackup(key){
  // Ma'lumot har o'zgarganda darhol emas, biroz kutib (debounce) zaxira yoziladi —
  // shu orqali ketma-ket bir nechta o'zgarish bo'lsa ham papkaga ortiqcha yozilmaydi.
  if(!savedDirHandle) return;
  if(autoBackupTimers[key]) clearTimeout(autoBackupTimers[key]);
  autoBackupTimers[key] = setTimeout(()=>{ autoBackupTimers[key] = null; exportSectionBackup(key, false); }, 800);
}
async function exportSectionBackup(key, forceDownload){
  const statusEl = document.getElementById('status_backup');
  try{
    const payload = buildSectionBackupPayload(key);
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const filename = BACKUP_FILE_NAME[key] || ('BirZum_Nasiya_'+key+'.json');
    let savedToFolder = false;
    if(savedDirHandle){
      savedToFolder = await saveBlobToFolder(blob, filename, key);
    }
    if(!savedToFolder && forceDownload){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 3000);
    }
    return {ok:true, savedToFolder, filename};
  }catch(e){
    console.error(e);
    if(statusEl && forceDownload){ statusEl.className = 'status err'; statusEl.textContent = 'Zaxiralashda xatolik: '+(e && e.message ? e.message : e); }
    return {ok:false};
  }
}
async function exportAllBackupsNow(){
  const statusEl = document.getElementById('status_backup');
  const keys = SECTIONS.filter(s=>s.storageKey).map(s=>s.key);
  const results = [];
  for(const key of keys){
    results.push(await exportSectionBackup(key, true));
  }
  if(statusEl){
    const ok = results.filter(r=>r.ok);
    const toFolder = ok.filter(r=>r.savedToFolder);
    statusEl.className = ok.length===keys.length ? 'status ok' : 'status err';
    statusEl.textContent = toFolder.length===ok.length && savedDirHandle
      ? 'Har bir bo‘lim o‘zining alohida fayliga («'+esc(savedDirHandle.name)+'» papkasiga) yozildi: '+ok.map(r=>r.filename).join(', ')+'.'
      : 'Har bir bo‘lim uchun alohida fayl yuklab olindi: '+ok.map(r=>r.filename).join(', ')+'.';
  }
}
function restoreFromBackupFile(file){
  const statusEl = document.getElementById('status_backup');
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const payload = JSON.parse(reader.result);
      // Yangi format — bitta bo'limga tegishli alohida fayl (payload.section + payload.records).
      if(payload && payload.section && Array.isArray(payload.records)){
        const s = SECTIONS.find(x=>x.key===payload.section);
        if(!s){ throw new Error('Faylda tanish bo‘lim topilmadi.'); }
        if(!confirm('Diqqat: zaxiradan tiklash joriy «'+s.label+'» bo‘limidagi barcha ma’lumotlarni fayldagi ma’lumotlar bilan almashtiradi. Davom etasizmi?')) return;
        DB[s.key] = payload.records;
        persistNoBackup(s.key);
        if(payload.counter !== undefined){
          try{ localStorage.setItem(counterStorageKey(s.key), String(payload.counter)); }catch(e){}
        }
        initCounterFromExisting(s.key);
        scheduleAutoBackup(s.key);
        renderApp();
        if(statusEl){ statusEl.className = 'status ok'; statusEl.textContent = '«'+s.label+'» bo‘limi zaxiradan muvaffaqiyatli tiklandi.'; }
        return;
      }
      // Eski (bitta faylga birlashtirilgan) format bilan ham moslik — payload.data ichida
      // bir nechta bo'lim bo'lishi mumkin edi.
      const data = payload && payload.data ? payload.data : payload;
      if(!data || typeof data !== 'object'){ throw new Error('Fayl formati noto‘g‘ri.'); }
      const foundKeys = SECTIONS.filter(s=>s.storageKey && Array.isArray(data[s.key]));
      if(!foundKeys.length){ throw new Error('Faylda tanish bo‘limlar topilmadi.'); }
      if(!confirm('Diqqat: zaxiradan tiklash joriy ma’lumotlarni («'+foundKeys.map(s=>s.label).join('», «')+'») fayldagi ma’lumotlar bilan almashtiradi. Davom etasizmi?')) return;
      foundKeys.forEach(s=>{
        DB[s.key] = data[s.key];
        persistNoBackup(s.key);
        if(payload.counters && payload.counters[s.key] !== undefined){
          try{ localStorage.setItem(counterStorageKey(s.key), String(payload.counters[s.key])); }catch(e){}
        }
        initCounterFromExisting(s.key);
        scheduleAutoBackup(s.key);
      });
      renderApp();
      if(statusEl){ statusEl.className = 'status ok'; statusEl.textContent = 'Zaxiradan muvaffaqiyatli tiklandi: '+foundKeys.map(s=>s.label).join(', ')+'.'; }
    }catch(e){
      console.error(e);
      if(statusEl){ statusEl.className = 'status err'; statusEl.textContent = 'Zaxiradan tiklashda xatolik: '+(e && e.message ? e.message : e); }
    }
  };
  reader.onerror = ()=>{ if(statusEl){ statusEl.className='status err'; statusEl.textContent = 'Faylni o‘qib bo‘lmadi.'; } };
  reader.readAsText(file);
}
// Bitta bo'limni tiklashda ushbu bo'lim uchun avto-zaxira darhol qayta
// ishga tushmasligi uchun — localStorage'ga yoziladi, keyin scheduleAutoBackup
// chaqiruvchi tomonidan alohida ishga tushiriladi.
function persistNoBackup(key){
  const s = SECTIONS.find(x=>x.key===key);
  try{ localStorage.setItem(STORAGE_PREFIX + s.storageKey, JSON.stringify(DB[key])); }catch(e){}
  cloudPushSection(key);
}

/* ============================= AVTOMATIK RAQAMLASH (№) ============================= */
// Har bir bo'lim uchun alohida, doimiy o'sib boruvchi hisoblagich — hujjat/hamkor
// yaratilganda unga birin-ketin raqam avtomatik beriladi. Biror yozuv keyinchalik
// o'chirilsa ham bu hisoblagich pasaymaydi, shuning uchun qolgan yozuvlarning
// raqami o'zgarmay qoladi va yangi qo'shilganlar doim keyingi bo'sh raqamni oladi.
function counterStorageKey(key){ return STORAGE_PREFIX + 'counter_' + key; }
function initCounterFromExisting(key){
  // Eski (bu funksiya qo'shilishidan oldingi) bazada qo'lda kiritilgan № qiymatlari
  // bo'lishi mumkin — hisoblagich ulardan kichik bo'lib qolmasligi uchun tekshiramiz.
  let maxExisting = 0;
  (DB[key]||[]).forEach(r=>{
    const n = parseInt(r && r.data && r.data.no, 10);
    if(!isNaN(n) && n > maxExisting) maxExisting = n;
  });
  let cur = 0;
  try{ cur = parseInt(localStorage.getItem(counterStorageKey(key)) || '0', 10) || 0; }catch(e){ cur = 0; }
  if(maxExisting > cur){
    try{ localStorage.setItem(counterStorageKey(key), String(maxExisting)); }catch(e){}
  }
}
function nextSequenceNumber(key){
  let cur = 0;
  try{ cur = parseInt(localStorage.getItem(counterStorageKey(key)) || '0', 10) || 0; }catch(e){ cur = 0; }
  const next = cur + 1;
  try{ localStorage.setItem(counterStorageKey(key), String(next)); }catch(e){}
  return next;
}

const UI_PREFS_KEY = STORAGE_PREFIX + 'ui_prefs';
const UI_DEFAULTS = {theme:'light', accent:'#7ab51d', lang:'uz', zoom:100, collapsed:false, lastTab:'bosh'};
const ACCENT_PRESETS = [
  ['#7ab51d','BirZum yashil'], ['#1f9d55','Zumrad'], ['#0e8f8f','Firuza'], ['#2563eb','Ko‘k'],
  ['#4f46e5','Indigo'], ['#7c3aed','Binafsha'], ['#b8863f','Oltin (Fortuna)'], ['#e0731a','To‘q sariq'], ['#d63c4a','Qizil'],
];
let UI = Object.assign({}, UI_DEFAULTS);
function loadUiPrefs(){
  try{ const raw = localStorage.getItem(UI_PREFS_KEY); if(raw) UI = Object.assign({}, UI_DEFAULTS, JSON.parse(raw)); }catch(e){}
}
function saveUiPrefs(){
  try{ localStorage.setItem(UI_PREFS_KEY, JSON.stringify(UI)); }catch(e){}
}
function hexToRgb(h){
  const m = String(h||'').replace('#','').match(/^([0-9a-f]{6})$/i);
  if(!m) return [122,181,29];
  const n = parseInt(m[1],16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function effectiveTheme(){
  if(UI.theme==='auto'){
    try{ return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }catch(e){ return 'light'; }
  }
  return UI.theme==='dark' ? 'dark' : 'light';
}
function applyUiPrefs(){
  const root = document.documentElement;
  root.dataset.theme = effectiveTheme();
  const [r,g,b] = hexToRgb(UI.accent);
  root.style.setProperty('--accent', rgbToHex(r,g,b));
  root.style.setProperty('--accent-2', rgbToHex(r*0.78,g*0.78,b*0.78));
  root.style.setProperty('--accent-soft', `rgba(${r},${g},${b},${effectiveTheme()==='dark'?0.2:0.13})`);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  root.style.setProperty('--accent-ink', lum > 0.72 ? '#14202e' : '#ffffff');
  const z = Number(UI.zoom)||100;
  const app = document.getElementById('appZoom');
  if(app) app.style.zoom = (z===100 ? '' : (z/100));
  const sb = document.getElementById('sidebar');
  if(sb) sb.classList.toggle('collapsed', !!UI.collapsed);
  root.lang = UI.lang==='uz_cyrl' ? 'uz-Cyrl' : (UI.lang||'uz');
  const dark = effectiveTheme()==='dark';
  document.querySelectorAll('img.logo-auto').forEach(im=>{ const want = dark ? LOGO_DARK : LOGO_LIGHT; if(im.getAttribute('src')!==want) im.setAttribute('src', want); });
  document.querySelectorAll('img.logo-light').forEach(im=>{ if(im.getAttribute('src')!==LOGO_LIGHT) im.setAttribute('src', LOGO_LIGHT); });
  const uat = document.getElementById('uaTheme'); if(uat) uat.innerHTML = dark ? ICONS.sun : ICONS.moon;
  const tbtn = document.getElementById('themeQuick');
  if(tbtn) tbtn.innerHTML = effectiveTheme()==='dark' ? ICONS.sun : ICONS.moon;
  i18nApply(document.body);
}
try{
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if(UI.theme==='auto') applyUiPrefs(); });
}catch(e){}

const LANG_IDX = {ru:0, en:1};
const LAT2CYR_PAIRS = [
  ["o‘","ў"],["o'","ў"],["oʻ","ў"],["o’","ў"],["g‘","ғ"],["g'","ғ"],["gʻ","ғ"],["g’","ғ"],
  ["sh","ш"],["ch","ч"],["yo","ё"],["yu","ю"],["ya","я"],["ye","е"],["ng","нг"],
];
const LAT2CYR = {a:'а',b:'б',d:'д',e:'е',f:'ф',g:'г',h:'ҳ',i:'и',j:'ж',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',q:'қ',r:'р',s:'с',t:'т',u:'у',v:'в',x:'х',y:'й',z:'з',c:'с',w:'в'};
function latToCyr(s){
  let out=''; const str=String(s);
  for(let i=0;i<str.length;){
    const low = str.slice(i,i+2).toLowerCase();
    const pair = LAT2CYR_PAIRS.find(p=>low===p[0]);
    const isUp = str[i] !== str[i].toLowerCase();
    if(pair && pair[0]!=='ng'){
      out += isUp ? pair[1].toUpperCase() : pair[1]; i+=2; continue;
    }
    const ch = str[i], lc = ch.toLowerCase();
    if(lc==='e' && (i===0 || /[\s(«"“\-—]/.test(str[i-1]))){ out += isUp?'Э':'э'; i++; continue; }
    if(LAT2CYR[lc]){ const c=LAT2CYR[lc]; out += isUp ? c.toUpperCase() : c; i++; continue; }
    if(ch==='‘'||ch==='’'||ch==='ʻ'){ out+='ъ'; i++; continue; }
    out += ch; i++;
  }
  return out;
}
function t(s){
  const lang = UI.lang||'uz';
  if(lang==='uz') return s;
  if(lang==='uz_cyrl') return I18N[s] !== undefined || s.length < 120 ? latToCyr(s) : s;
  const row = I18N[s];
  return row ? row[LANG_IDX[lang]] : s;
}
const I18N_SKIP = '.paper,.wl-host,.wl-doc,[data-noi18n],script,style,textarea,select option[data-raw]';
function i18nTranslateText(orig){
  const lead = orig.match(/^\s*/)[0], trail = orig.match(/\s*$/)[0];
  const core = orig.trim();
  if(!core) return orig;
  if(I18N[core]===undefined) return orig;
  return lead + t(core) + trail;
}
let i18nBusy = false;
function i18nApply(root){
  if(!root || i18nBusy) return;
  i18nBusy = true;
  try{
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n){
        const p = n.parentElement;
        if(!p || p.closest(I18N_SKIP)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    let n;
    while((n = walker.nextNode())){
      if(n.__i18nOrig === undefined || (n.nodeValue !== n.__i18nOut)){
        n.__i18nOrig = n.nodeValue;
      }
      const out = i18nTranslateText(n.__i18nOrig);
      n.__i18nOut = out;
      if(n.nodeValue !== out) n.nodeValue = out;
    }
    root.querySelectorAll && root.querySelectorAll('[placeholder],[title],[data-title]').forEach(el=>{
      if(el.closest(I18N_SKIP)) return;
      ['placeholder','title','data-title'].forEach(attr=>{
        if(!el.hasAttribute(attr)) return;
        const key = '__i18n_'+attr;
        const cur = el.getAttribute(attr);
        if(el[key] === undefined || cur !== el[key+'_out']) el[key] = cur;
        const out = i18nTranslateText(el[key]);
        el[key+'_out'] = out;
        if(cur !== out) el.setAttribute(attr, out);
      });
    });
  }finally{ i18nBusy = false; }
}
let i18nQueued = false;
const i18nObserver = new MutationObserver(()=>{
  if(i18nBusy || i18nQueued || (UI.lang||'uz')==='uz') return;
  i18nQueued = true;
  requestAnimationFrame(()=>{ i18nQueued = false; i18nApply(document.body); });
});
function startI18nObserver(){
  try{ i18nObserver.observe(document.body, {childList:true, subtree:true, characterData:true}); }catch(e){}
}

// ammo yakuniy qiymat sifatida har doim ENG SO'NGGI (createdAt bo'yicha) va

const AUTOFILL_SCAN_ORDER = ['hamkor','bosh','qoshimcha','bonus'];

function buildMergedProfile(stir){
  const s = String(stir||'').trim();
  if(!s) return null;
  const profile = {};
  const profileTime = {};
  let found = false;
  AUTOFILL_SCAN_ORDER.forEach(dbKey=>{
    const map = CANON_FIELD_MAP[dbKey];
    (DB[dbKey]||[]).forEach(r=>{
      if(String((r.data && r.data.stir) || '').trim() !== s) return;
      found = true;
      const t = new Date(r.createdAt).getTime() || 0;
      Object.keys(map).forEach(srcKey=>{
        const canon = map[srcKey];
        const val = r.data ? r.data[srcKey] : undefined;
        if(val === undefined || val === null || String(val).trim() === '') return;
        if(profileTime[canon] === undefined || t >= profileTime[canon]){
          profile[canon] = val;
          profileTime[canon] = t;
        }
      });
    });
  });
  return found ? profile : null;
}

function autofillFromBosh(key){
  const statusEl = document.getElementById('status_'+key);
  const stirEl = document.getElementById('f_stir');
  const stirVal = stirEl ? stirEl.value : '';
  const profile = buildMergedProfile(stirVal);
  if(!profile){
    if(statusEl){ statusEl.className='status err'; statusEl.textContent = 'Diqqat: bu STIR bo‘yicha hech qanday bo‘limda ma’lumot topilmadi. Avval «Hamkorlar» bo‘limida shu tashkilotni kiriting.'; }
    return;
  }
  const map = AUTOFILL_MAP[key];
  if(!map) return;
  const missingLabels = [];
  Object.keys(map).forEach(targetField=>{
    const el = document.getElementById('f_'+targetField);
    if(!el) return;
    const canon = map[targetField];
    const val = profile[canon];
    if(val){
      el.value = val;
    }else{
      const fdef = FIELDS[key].find(f=>f[0]===targetField);
      if(fdef) missingLabels.push(fdef[1]);
    }
  });
  if(statusEl){
    statusEl.className = 'status ok';
    let msg = 'Ma’lumotlar «'+(profile.tashkilot_nomi||'tashkilot')+'» bo‘yicha avtomatik to‘ldirildi.';
    if(missingLabels.length){
      msg += ' Diqqat: quyidagi maydonlar hech bir bo‘limda topilmagani uchun bo‘sh qoldirildi: '+missingLabels.join(', ')+' — kerak bo‘lsa qo‘lda kiriting.';
    }
    statusEl.textContent = msg;
  }
}

      <div class="hint">STIR kiriting va «Tortib olish»ni bosing — ${esc(srcLabel)} ma’lumotlar${sectionKey==='bosh'?'dan':''} avtomatik to‘ldiriladi.</div>
    `;
  }
  return `
    <label>${esc(label)} ${req?'':'<span class="opt">(ixtiyoriy)</span>'}</label>
    <input type="${type}" id="f_${key}" ${req?'required':''} ${placeholder?`placeholder="${esc(placeholder)}"`:''}${dateDefaultAttr}>
  `;
}

/* ============================= FAYLDAN IMPORT QILISH (barcha bo'limlar uchun umumiy) ============================= */
// Hamkorlar, Bosh kelishuv, Qo'shimcha kelishuv va Bonus (shartnoma/bekor qilish)
// bo'limlariga Excel (.xlsx/.xls) yoki CSV fayldan bir vaqtda ko'plab yozuvlarni
// import qilish imkonini beradi. Ustun sarlavhalari FIELDS ro'yxatidagi maydon
// nomi yoki uning yorlig'i (label) bilan (belgilarga sezgir bo'lmagan holda) mos kelsa,
// qiymat tegishli maydonga joylashtiriladi. № ustuni import qilinmaydi — u ham
// avtomatik tayinlanadi.
// O'zbekcha kirill harflarni lotinga o'giradi — shu orqali ustun sarlavhasi
// kirillda, forma maydoni lotinda (yoki aksincha) yozilgan bo'lsa ham moslashadi.
const CYR2LAT_MAP = {
  'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z','и':'i','й':'y',
  'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f',
  'х':'x','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'','ы':'i','ь':'','э':'e','ю':'yu','я':'ya',
  'ў':'o','қ':'q','ғ':'g','ҳ':'h'
};
function cyrToLat(s){
  return String(s||'').toLowerCase().split('').map(ch=> CYR2LAT_MAP[ch]!==undefined ? CYR2LAT_MAP[ch] : ch).join('');
}
function normKey(s){
  return cyrToLat(s).replace(/[^\p{L}\p{N}]+/gu,'').trim();
}
// Ba'zi maydonlar Excel fayllarda juda qisqartirilgan sarlavhalar bilan keladi
// (masalan "Hisob raqami" o'rniga faqat "Ҳ/р", "H/r" yoki "Х/р"). Bunday qisqa
// (2 harfli) sarlavhalar avvalgi versiyada umuman moslashtirilmas edi, chunki
// moslashtirish faqat 3+ harfli nomzodlar uchun ishlagan. Shu sababli aynan shu
// maydonlar uchun qo'shimcha "sinonim" nomzodlarni aniq (to'liq mos keladigan)
// ro'yxatga qo'shamiz — bu qisqa ustun nomlarini ham to'g'ridan-to'g'ri
// tanib olishni ta'minlaydi.
const FIELD_EXTRA_SYNONYMS = {
  hisob_raqami: ['hr','xr','h/r','x/r','ҳ/р','х/р','rs'],
  hr: ['hr','xr','h/r','x/r','ҳ/р','х/р','rs']
};
function buildFieldMatchers(key){
  return FIELDS[key].filter(f=>f[0]!=='no').map(f=>{
    const fieldKey = f[0], label = f[1], type = f[2];
    const shortLabel = label.split('(')[0];
    const extras = (FIELD_EXTRA_SYNONYMS[fieldKey] || []).map(normKey);
    const candidates = Array.from(new Set([normKey(fieldKey), normKey(label), normKey(shortLabel), ...extras])).filter(Boolean);
    return {fieldKey, type, candidates};
  });
}
function importRowToData(key, row, matchers){
  const d = {};
  const rowNormMap = {};
  Object.keys(row).forEach(h=>{
    const nk = normKey(h);
    if(nk) rowNormMap[nk] = row[h];
  });
  const rowNormKeys = Object.keys(rowNormMap);
  matchers.forEach(m=>{
    let found;
    // 1) Aniq mos kelish (ustun nomi maydon nomi/yorlig'iga so'zma-so'z teng —
    //    kirill/lotin farqi normKey ichida avtomatik hisobga olinadi)
    for(const cand of m.candidates){
      if(rowNormMap[cand] !== undefined){ found = rowNormMap[cand]; break; }
    }
    // 2) Aniq mos kelmasa — qisman mos kelishni tekshiramiz (ustun nomi ichida
    //    maydon nomi bor yoki aksincha), bu kichik farqlar (masalan qisqartma,
    //    qo'shimcha so'z) uchun ishlaydi. Nomuvofiq uzunlikdagi (juda uzun/
    //    umumiy) nomzodlarning tasodifan mos kelishini kamaytirish uchun eng
    //    yaqin uzunlikdagi ustunni tanlaymiz.
    if(found === undefined){
      let bestRk, bestDiff = Infinity;
      for(const cand of m.candidates){
        if(cand.length < 3) continue;
        rowNormKeys.forEach(rk=>{
          if(rk.length < 3) return;
          if(rk.includes(cand) || cand.includes(rk)){
            const diff = Math.abs(rk.length - cand.length);
            if(diff < bestDiff){ bestDiff = diff; bestRk = rk; }
          }
        });
      }
      if(bestRk) found = rowNormMap[bestRk];
    }
    if(found !== undefined && found !== null){
      let val = found;
      // Excel sana katagi ba'zan JS Date obyekti sifatida keladi — uni matnga aylantiramiz
      if(val instanceof Date && !isNaN(val)){
        const y=val.getFullYear(), mo=String(val.getMonth()+1).padStart(2,'0'), da=String(val.getDate()).padStart(2,'0');
        val = `${y}-${mo}-${da}`;
      }
      val = String(val).trim();
      // Sana turidagi maydonlar uchun — Excel'da matn katak sifatida kelgan
      // (masalan "6/23/26" yoki "23.06.2026") sanalarni ham "YYYY-MM-DD"
      // ko'rinishiga keltiramiz, aks holda forma/hujjatda noto'g'ri chiqadi.
      if(m.type==='date' && val) val = normalizeDateString(val);
      if(val !== '') d[m.fieldKey] = val;
    }
  });
  return d;
}
/* ============================= EXCEL/CSV IMPORT — O'CHIRMASDAN YANGILASH =============================
   Ishlash tartibi:
   1) Fayldagi har bir qator "kalit" bo'yicha saytdagi yozuv bilan solishtiriladi:
        • Hamkorlar ............ STIR
        • Bosh shartnoma ....... shartnoma raqami + STIR
        • Qo'shimcha kelishuv .. qo'shimcha kelishuv raqami + STIR
        • Bonus ................ turi (bonus / bekor) + raqam + STIR
   2) Saytda bunday yozuv YO'Q bo'lsa — yangi yozuv sifatida qo'shiladi.
   3) Saytda BOR bo'lsa — faqat Excelda o'zgargan maydonlar yangilanadi.
      Excelda bo'sh katak saytdagi ma'lumotni o'chirmaydi.
   4) Saytdagi boshqa yozuvlarga (faylda bo'lmaganlarga) umuman tegilmaydi. */
function importMergeKey(key, d, kind){
  const n = v=> String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,'');
  if(key==='hamkor') return n(d.stir) ? 's:'+n(d.stir) : 'n:'+n(d.tashkilot_nomi);
  if(key==='bosh') return n(d.shartnoma_raqami) ? 'r:'+n(d.shartnoma_raqami)+'|'+n(d.stir) : 's:'+n(d.stir);
  if(key==='qoshimcha') return 'q:'+n(d.qoshimcha_raqami)+'|'+n(d.eski_raqami)+'|'+n(d.stir);
  if(key==='bonus') return (kind||'main')+':'+n(d.qoshimcha_raqami||d.shartnoma_raqami)+'|'+n(d.stir);
  return JSON.stringify(d);
}
function importStatusEl(key){ return document.getElementById('status_imp_'+key) || document.getElementById('status_'+key); }

async function handleImportFile(key, file, forcedKind){
  const statusEl = importStatusEl(key);
  const say = (cls, txt)=>{ if(statusEl){ statusEl.className = 'status ' + (cls||''); statusEl.textContent = txt; } };
  if(typeof XLSX === 'undefined'){ say('err','Excel kutubxonasi yuklanmadi. Internet aloqasini tekshirib, sahifani qayta yuklang.'); return; }
  try{
    say('', 'Fayl o‘qilmoqda…');
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const matchers = buildFieldMatchers(key);
    const allCandidateSet = new Set();
    matchers.forEach(m=>m.candidates.forEach(c=>{ if(c) allCandidateSet.add(c); }));
    // Sarlavha qatori bir nechta varaq va dastlabki 20 qator ichidan avtomatik topiladi
    let best = {sheetName:null, headerRow:0, score:-1};
    wb.SheetNames.forEach(sn=>{
      let aoa = [];
      try{ aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:'', raw:false, blankrows:false}); }catch(e){}
      for(let r=0;r<Math.min(aoa.length,20);r++){
        let score = 0; (aoa[r]||[]).forEach(c=>{ if(allCandidateSet.has(normKey(c))) score++; });
        if(score > best.score) best = {sheetName:sn, headerRow:r, score};
      }
    });
    if(!best.sheetName || best.score < 2){
      say('err', 'Faylda kerakli ustunlar topilmadi. Ustun sarlavhalari quyidagicha bo‘lishi kerak: «' + FIELDS[key].map(f=>f[1]).join('», «') + '».');
      return;
    }
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[best.sheetName], {range:best.headerRow, defval:'', raw:false, dateNF:'yyyy-mm-dd'});
    if(!rows.length){ say('err','Faylda ma’lumot topilmadi.'); return; }

    // Saytdagi mavjud yozuvlar indeksi
    const index = new Map();
    DB[key].forEach(r=>{ const k = importMergeKey(key, r.data||{}, r.kind); if(!index.has(k)) index.set(k, r); });

    const plan = new Map();   // kalit -> {d, kind}  (faylda takrorlansa oxirgisi olinadi)
    let skipped = 0; const missingCounts = {};
    rows.forEach(row=>{
      const d = importRowToData(key, row, matchers);
      const missing = validate(key, d);
      if(missing.length){ skipped++; missing.forEach(l=>{ missingCounts[l] = (missingCounts[l]||0)+1; }); return; }
      let kind = 'main';
      if(key==='bonus'){
        if(forcedKind) kind = forcedKind;
        else{
          const nm = {}; Object.keys(row).forEach(h=>{ nm[normKey(h)] = row[h]; });
          const tv = String(nm[normKey('Turi')] || nm[normKey('Kind')] || '').toLowerCase();
          kind = tv.indexOf('bekor') !== -1 ? 'cancel' : 'main';
        }
      }
      plan.set(importMergeKey(key, d, kind), {d, kind});
    });

    const toAdd = [], toUpdate = []; let unchanged = 0;
    plan.forEach((item, k)=>{
      const ex = index.get(k);
      if(!ex){ toAdd.push(item); return; }
      const changes = {};
      Object.keys(item.d).forEach(f=>{
        if(f==='no') return;
        const nv = String(item.d[f]==null?'':item.d[f]).trim();
        if(!nv) return;                                   // bo'sh katak — o'zgartirmaymiz
        const ov = String((ex.data||{})[f]==null?'':(ex.data||{})[f]).trim();
        if(nv !== ov) changes[f] = item.d[f];
      });
      if(Object.keys(changes).length) toUpdate.push({rec:ex, changes}); else unchanged++;
    });

    if(!toAdd.length && !toUpdate.length){
      say(skipped && !unchanged ? 'err' : 'ok',
        unchanged ? `O‘zgarish topilmadi: fayldagi ${unchanged} ta yozuv saytdagi bilan bir xil. Hech narsa o‘zgartirilmadi.` + (skipped ? ` (${skipped} ta qator majburiy maydonlar to‘liq bo‘lmagani uchun o‘tkazib yuborildi.)` : '')
                  : `Hech qanday yozuv olinmadi — ${skipped} ta qatorda majburiy maydonlar to‘liq emas` + (Object.keys(missingCounts).length ? ': «' + Object.keys(missingCounts).join('», «') + '».' : '.'));
      return;
    }
    const msg = `Fayl tahlili («${file.name}»):\n\n` +
      `• Yangi qo‘shiladi: ${toAdd.length} ta\n• Ma’lumoti yangilanadi: ${toUpdate.length} ta\n• O‘zgarishsiz qoladi: ${unchanged} ta\n` +
      (skipped ? `• O‘tkazib yuboriladi (to‘liq emas): ${skipped} ta\n` : '') +
      `\nSaytdagi boshqa yozuvlar o‘chirilmaydi va o‘zgarmaydi. Davom etasizmi?`;
    if(!confirm(msg)){ say('', 'Import bekor qilindi — ma’lumotlar o‘zgartirilmadi.'); return; }

    const now = new Date().toISOString();
    toUpdate.forEach(u=>{ u.rec.data = Object.assign({}, u.rec.data, u.changes); u.rec.updatedAt = now; });
    toAdd.forEach(item=>{
      item.d.no = nextSequenceNumber(key);
      DB[key].push({id:uid(), kind:item.kind, data:item.d, createdAt:now});
    });
    persist(key);
    renderTabs();
    if(key==='hamkor' && document.getElementById('hamkorTableWrap')) renderHamkorTable();
    else if(document.getElementById('hist_'+key)) renderHistory(key);
    const names = toUpdate.slice(0,5).map(u=>u.rec.data.tashkilot_nomi||'').filter(Boolean);
    say('ok', `Tayyor: ${toAdd.length} ta yangi qo‘shildi, ${toUpdate.length} ta yangilandi, ${unchanged} ta o‘zgarishsiz qoldi.` +
      (names.length ? ` Yangilanganlar: ${names.join('; ')}${toUpdate.length>5?' va boshqalar':''}.` : '') +
      (skipped ? ` ${skipped} ta qator to‘liq bo‘lmagani uchun o‘tkazib yuborildi.` : ''));
  }catch(e){
    console.error(e);
    say('err', 'Import qilishda xatolik: ' + (e && e.message ? e.message : e));
  }
}
function importButtonMarkup(key){ return ''; }
function bindImportButton(key, btnId, kind){
  const btn = document.getElementById(btnId || ('import_'+key));
  const fileInput = document.getElementById((btnId || ('import_'+key)).replace('import_','importFile_'));
  if(btn && fileInput){

      const file = e.target.files && e.target.files[0];
      if(file) handleImportFile(key, file, kind);
      fileInput.value = '';
    };
  }
}

/* ============================= HAMKOR FAYLLARI (rasm va hujjatlar) =============================
   Har bir fayl shu kompyuterdagi brauzer bazasida (IndexedDB) saqlanadi.
   Bulut (Firebase) ulangan bo'lsa va fayl hajmi 700 KB dan oshmasa, u bulutga ham
   yoziladi — shunda boshqa kompyuterda ham ko'rinadi. Rasmlar yuklashdan oldin
   sifatini yo'qotmagan holda ixchamlashtiriladi (eng katta tomoni 2000 px).
   Saqlash papkasi tanlangan bo'lsa, fayl «Hamkorlar» papkasiga ham nusxalanadi. */
const HF_DB_NAME = 'birzum_hamkor_files';
const HF_STORE = 'files';
const HF_CLOUD_COLLECTION = 'birzum_hamkor_files';
const HF_CLOUD_MAX = 700 * 1024;
const HF_MAX_FILE = 25 * 1024 * 1024;
let hfDbPromise = null;
function hfOpen(){
  if(hfDbPromise) return hfDbPromise;
  hfDbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(HF_DB_NAME, 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(HF_STORE)){
        const st = db.createObjectStore(HF_STORE, {keyPath:'id'});
        st.createIndex('hamkorId', 'hamkorId', {unique:false});
      }
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return hfDbPromise;
}
async function hfTx(mode, fn){
  const db = await hfOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(HF_STORE, mode);
    const st = tx.objectStore(HF_STORE);
    let result;
    Promise.resolve(fn(st)).then(r=>{ result = r; });
    tx.oncomplete = ()=> resolve(result);
    tx.onerror = ()=> reject(tx.error);
    tx.onabort = ()=> reject(tx.error);
  });
}
function idbReq(req){ return new Promise((res, rej)=>{ req.onsuccess = ()=>res(req.result); req.onerror = ()=>rej(req.error); }); }
async function hfLocalList(hamkorId){
  return hfTx('readonly', st=> idbReq(st.index('hamkorId').getAll(hamkorId)));
}
async function hfLocalPut(rec){ return hfTx('readwrite', st=> idbReq(st.put(rec))); }
async function hfLocalDelete(id){ return hfTx('readwrite', st=> idbReq(st.delete(id))); }

function blobToBase64(blob){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(String(r.result).split(',')[1] || '');
    r.onerror = ()=> rej(r.error);
    r.readAsDataURL(blob);
  });
}
function base64ToBlob(b64, type){
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: type||'application/octet-stream'});
}
// Rasmni ixchamlashtirish (telefon rasmlari odatda 3–8 MB bo'ladi)
async function hfCompressImage(file){
  if(!/^image\/(jpeg|png|webp)$/i.test(file.type)) return file;
  if(file.size < 350*1024) return file;
  try{
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej)=>{ const im = new Image(); im.onload = ()=>res(im); im.onerror = rej; im.src = url; });
    URL.revokeObjectURL(url);
    const max = 2000;
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img, 0, 0, w, h);
    let q = 0.86, blob = await new Promise(r=> c.toBlob(r, 'image/jpeg', q));
    while(blob && blob.size > HF_CLOUD_MAX && q > 0.6){ q -= 0.08; blob = await new Promise(r=> c.toBlob(r, 'image/jpeg', q)); }
    if(!blob || blob.size >= file.size) return file;
    const name = file.name.replace(/\.(png|webp|jpe?g)$/i, '') + '.jpg';
    return new File([blob], name, {type:'image/jpeg'});
  }catch(e){ return file; }
}
async function hfList(hamkorId){
  let local = [];
  try{ local = await hfLocalList(hamkorId); }catch(e){ console.error(e); }
  const byId = new Map(local.map(f=>[f.id, f]));
  if(cloudReady && cloudDb){
    try{
      const snap = await cloudDb.collection(HF_CLOUD_COLLECTION).where('hamkorId','==',hamkorId).get();
      for(const doc of snap.docs){
        if(byId.has(doc.id)){ byId.get(doc.id).cloud = true; continue; }
        const d = doc.data();
        const rec = {id:doc.id, hamkorId:d.hamkorId, stir:d.stir||'', name:d.name, type:d.type, size:d.size,
                     addedAt:d.addedAt, cloud:true, blob: d.data ? base64ToBlob(d.data, d.type) : null};
        byId.set(doc.id, rec);
        if(rec.blob){ try{ await hfLocalPut(rec); }catch(e){} }
      }
    }catch(e){ console.error('Bulutdagi fayllarni o‘qishda xatolik', e); }
  }
  return Array.from(byId.values()).sort((a,b)=> String(b.addedAt).localeCompare(String(a.addedAt)));
}
async function hfAdd(hamkorRec, file){
  const f = await hfCompressImage(file);
  const rec = {id: uid(), hamkorId: hamkorRec.id, stir: String(hamkorRec.data.stir||''), name: f.name || 'fayl',
               type: f.type || 'application/octet-stream', size: f.size, addedAt: new Date().toISOString(), cloud:false, blob: f};
  if(cloudReady && cloudDb && f.size <= HF_CLOUD_MAX){
    try{
      const data = await blobToBase64(f);
      await cloudDb.collection(HF_CLOUD_COLLECTION).doc(rec.id).set({
        hamkorId: rec.hamkorId, stir: rec.stir, name: rec.name, type: rec.type, size: rec.size, addedAt: rec.addedAt, data
      });
      rec.cloud = true;
    }catch(e){ console.error('Faylni bulutga yozishda xatolik', e); }
  }
  await hfLocalPut(rec);
  try{
    const safe = (rec.stir ? rec.stir + '_' : '') + rec.name.replace(/[\\/:*?"<>|]+/g,'_');
    await saveBlobToFolder(f, safe, 'hamkor');
  }catch(e){}
  return rec;
}
async function hfDelete(file){
  try{ await hfLocalDelete(file.id); }catch(e){}
  if(cloudReady && cloudDb){
    try{ await cloudDb.collection(HF_CLOUD_COLLECTION).doc(file.id).delete(); }catch(e){}
  }
}
async function hfDeleteAllFor(hamkorId){
  try{
    const files = await hfList(hamkorId);
    for(const f of files) await hfDelete(f);
  }catch(e){}
}
function hfSize(n){
  n = Number(n)||0;
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}
function hfExt(f){
  const m = String(f.name||'').match(/\.([a-z0-9]{1,5})$/i);
  return m ? m[1].toUpperCase() : (String(f.type).split('/')[1]||'FAYL').toUpperCase().slice(0,4);
}
function hfIsImage(f){ return /^image\//i.test(f.type||''); }
function hfIsPdf(f){ return /pdf/i.test(f.type||'') || /\.pdf$/i.test(f.name||''); }

// Faylni katta oynada ko'rish (rasm, PDF); boshqa turlar — yuklab olish
let viewerUrl = null;
function openViewer(file){
  closeViewer();
  if(!file.blob){ alert('Bu fayl faqat boshqa kompyuterda saqlangan (hajmi katta bo‘lgani uchun bulutga yuklanmagan).'); return; }
  viewerUrl = URL.createObjectURL(file.blob);
  const v = document.createElement('div');
  v.className = 'viewer'; v.id = 'fileViewer';
  let body;
  if(hfIsImage(file)) body = `<img src="${viewerUrl}" alt="">`;
  else if(hfIsPdf(file)) body = `<iframe src="${viewerUrl}"></iframe>`;
  else body = `<div class="vnone">${esc(t('Bu turdagi faylni brauzerda ko‘rib bo‘lmaydi — yuklab olib oching.'))}</div>`;
  v.innerHTML = `
    <div class="viewer-bar">
      <div class="vname" data-noi18n>${esc(file.name)} · ${hfSize(file.size)}</div>
      <a href="${viewerUrl}" download="${esc(file.name)}">${esc(t('Yuklab olish'))}</a>
      <button type="button" id="viewerClose">${esc(t('Yopish'))} ✕</button>
    </div>
    <div class="viewer-body">${body}</div>`;
  document.body.appendChild(v);
  v.addEventListener('click', e=>{ if(e.target===v || e.target.classList.contains('viewer-body')) closeViewer(); });
  document.getElementById('viewerClose').onclick = closeViewer;
}
function closeViewer(){
  const v = document.getElementById('fileViewer');
  if(v) v.remove();
  if(viewerUrl){ URL.revokeObjectURL(viewerUrl); viewerUrl = null; }
}

function linkedContracts(stir){
  const s = String(stir||'').trim();
  if(!s) return [];
  const out = [];
  [['bosh','Bosh shartnoma'],['qoshimcha','Qo‘shimcha kelishuv'],['bonus','Bonus']].forEach(([key,label])=>{
    (DB[key]||[]).forEach(r=>{
      if(String((r.data&&r.data.stir)||'').trim()!==s) return;
      const d = r.data||{};
      let num = d.shartnoma_raqami || d.qoshimcha_raqami || '';
      let date = d.shartnoma_sanasi || d.qoshimcha_sanasi || '';
      if(key==='qoshimcha'){ num = d.qoshimcha_raqami; date = d.qoshimcha_sanasi; }
      if(key==='bonus'){ num = d.qoshimcha_raqami || d.shartnoma_raqami; date = d.qoshimcha_sanasi; }
      out.push({key, rec:r, label: key==='bonus' && r.kind==='cancel' ? 'Bonus bekor qilish' : label, num, date});
    });
  });
  return out.sort((a,b)=> String(b.rec.createdAt).localeCompare(String(a.rec.createdAt)));
}

}

async function refreshHamkorFiles(rec){
  const box = document.getElementById('hkFiles');
  if(!box) return;
  let files = [];
  try{ files = await hfList(rec.id); }catch(e){ console.error(e); }
  if(hamkorEditingId !== rec.id) return;
  hamkorObjectUrls.forEach(u=>URL.revokeObjectURL(u)); hamkorObjectUrls = [];
  const cnt = document.getElementById('hkFileCnt'); if(cnt) cnt.textContent = files.length;
  if((rec.fileCount||0) !== files.length){ rec.fileCount = files.length; persist('hamkor'); renderHamkorList(); }
  if(!files.length){ box.innerHTML = `<div class="hint" style="grid-column:1/-1;">Hozircha fayl yuklanmagan.</div>`; i18nApply(box); return; }
  box.innerHTML = files.map((f,i)=>{
    let thumb;
    if(hfIsImage(f) && f.blob){ const u = URL.createObjectURL(f.blob); hamkorObjectUrls.push(u); thumb = `<img src="${u}" alt="" loading="lazy">`; }
    else{
      const ext = hfExt(f); const cls = hfIsPdf(f) ? 'pdf' : (/DOC/.test(ext) ? 'doc' : (/XLS|CSV/.test(ext) ? 'xls' : ''));
      thumb = `<span class="ext ${cls}">${esc(ext)}</span>`;
    }
    const dt = new Date(f.addedAt);
    return `<div class="hk-file">
      <div class="hk-thumb" data-view="${i}" title="${esc(f.name)}">${thumb}</div>
      <div class="hk-fmeta" data-noi18n><div class="hk-fname" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="hk-fsub"><span>${hfSize(f.size)}</span><span>${isNaN(dt)?'':pad2(dt.getDate())+'.'+pad2(dt.getMonth()+1)+'.'+dt.getFullYear()}</span></div>
        ${f.cloud?'':'<div class="hk-badge-local" title="Fayl faqat shu kompyuterda saqlangan">● '+esc(t('faqat shu kompyuterda'))+'</div>'}
      </div>
      <div class="hk-factions"><button type="button" data-view="${i}">${esc(t('Ko‘rish'))}</button><button type="button" data-dl="${i}">⬇</button><button type="button" class="del" data-fdel="${i}">✕</button></div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-view]').forEach(b=> b.onclick = ()=> openViewer(files[Number(b.dataset.view)]));
  box.querySelectorAll('[data-dl]').forEach(b=> b.onclick = ()=>{
    const f = files[Number(b.dataset.dl)]; if(!f.blob) return;
    const u = URL.createObjectURL(f.blob); const a = document.createElement('a'); a.href = u; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 4000);
  });
  box.querySelectorAll('[data-fdel]').forEach(b=> b.onclick = async ()=>{
    const f = files[Number(b.dataset.fdel)];
    if(!confirm('«'+f.name+'» fayli o‘chirilsinmi?')) return;
    await hfDelete(f); refreshHamkorFiles(rec);
  });
}
function bindHamkorFiles(rec){
  const drop = document.getElementById('hkDrop');
  const input = document.getElementById('hkFileInput');
  const st = document.getElementById('hkFileStatus');
  const upload = async (fileList)=>{
    const files = Array.from(fileList||[]);
    if(!files.length) return;
    let ok = 0, local = 0; const errs = [];
    for(let i=0;i<files.length;i++){
      const f = files[i];
      if(st){ st.className = 'status'; st.textContent = `Yuklanmoqda: ${i+1}/${files.length} — ${f.name}`; }
      if(f.size > HF_MAX_FILE){ errs.push(f.name+' (25 MB dan katta)'); continue; }
      try{ const r = await hfAdd(rec, f); ok++; if(!r.cloud) local++; }
      catch(e){ errs.push(f.name); console.error(e); }
    }
    if(st){
      st.className = errs.length ? 'status err' : 'status ok';
      let msg = ok ? `${ok} ta fayl yuklandi.` : '';
      if(local && cloudReady) msg += ` ${local} tasi hajmi katta bo‘lgani uchun faqat shu kompyuterda saqlandi.`;
      else if(local && !cloudReady) msg += ' Bulut ulanmagan — fayllar shu kompyuterda saqlandi.';
      if(errs.length) msg += ' Yuklanmadi: ' + errs.join(', ');
      st.textContent = msg.trim();
    }
    refreshHamkorFiles(rec);
  };
  if(drop && input){
    drop.onclick = ()=> input.click();
    input.onchange = ()=>{ upload(input.files); input.value = ''; };
    drop.ondragover = (e)=>{ e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = ()=> drop.classList.remove('over');
    drop.ondrop = (e)=>{ e.preventDefault(); drop.classList.remove('over'); upload(e.dataTransfer.files); };
  }
  refreshHamkorFiles(rec);
}

/* ---------- SHA-256 (parolni ochiq holda saqlamaslik uchun) ---------- */
function sha256Hex(str){
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = new TextEncoder().encode(str);
  const l = bytes.length, bitLen = l * 8;
  const withPad = ((l + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(withPad); m.set(bytes); m[l] = 0x80;
  const dv = new DataView(m.buffer);
  dv.setUint32(withPad - 4, bitLen >>> 0); dv.setUint32(withPad - 8, Math.floor(bitLen / 2**32));
  let h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const w = new Uint32Array(64);
  const rotr = (x,n)=> (x>>>n) | (x<<(32-n));
  for(let o=0;o<withPad;o+=64){
    for(let i=0;i<16;i++) w[i] = dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){
      const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15]>>>3);
      const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2]>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,hh] = h;
    for(let i=0;i<64;i++){
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h = [h[0]+a,h[1]+b,h[2]+c,h[3]+d,h[4]+e,h[5]+f,h[6]+g,h[7]+hh].map(x=>x>>>0);
  }
  return h.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function arHashPass(pass, salt){ return sha256Hex(salt + '|' + pass + '|birzum'); }

/* ---------- Saqlash: Firestore (asosiy) yoki shu brauzer (zaxira) ---------- */
let arOwnDb = null, arCloudTried = false, arCloudInitPromise = null;
async function arDb(){
  if(arCloudInitPromise){ try{ await arCloudInitPromise; }catch(e){} }
  if(typeof cloudDb !== 'undefined' && cloudDb && cloudReady) return cloudDb;
  if(arOwnDb) return arOwnDb;
  if(arCloudTried) return null;
  arCloudTried = true;
  try{
    const cfg = getCloudConfig();
    if(!cfg || typeof firebase === 'undefined') return null;
    const app = (firebase.apps && firebase.apps.length) ? firebase.apps[0] : firebase.initializeApp(cfg);
    arOwnDb = firebase.firestore(app);
    return arOwnDb;
  }catch(e){ console.error('Firebase ulanmadi', e); return null; }
}
let arLocalDbP = null;
function arLocalDb(){
  if(arLocalDbP) return arLocalDbP;
  arLocalDbP = new Promise((res, rej)=>{
    const r = indexedDB.open('birzum_local_store', 1);
    r.onupgradeneeded = ()=>{ const st = r.result.createObjectStore('docs', {keyPath:'k'}); st.createIndex('col','col'); };
    r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error);
  });
  return arLocalDbP;
}
async function arLocalOp(mode, fn){
  const db = await arLocalDb();
  return new Promise((res, rej)=>{
    const tx = db.transaction('docs', mode); const st = tx.objectStore('docs'); let out;
    const rq = fn(st); if(rq) rq.onsuccess = ()=>{ out = rq.result; };
    tx.oncomplete = ()=> res(out); tx.onerror = ()=> rej(tx.error);
  });
}
const ST = {
  async get(col, id){
    const db = await arDb();
    if(db){ const s = await db.collection(col).doc(id).get(); return s.exists ? Object.assign({id:s.id}, s.data()) : null; }
    const r = await arLocalOp('readonly', st=> st.get(col+'/'+id)); return r ? r.v : null;
  },
  async set(col, id, obj){
    const db = await arDb(); const v = Object.assign({}, obj); delete v.id;
    if(db){ await db.collection(col).doc(id).set(v); return; }
    await arLocalOp('readwrite', st=> st.put({k:col+'/'+id, col, v:Object.assign({id}, v)}));
  },
  async del(col, id){
    const db = await arDb();
    if(db){ await db.collection(col).doc(id).delete(); return; }
    await arLocalOp('readwrite', st=> st.delete(col+'/'+id));
  },
  async where(col, field, val){
    const db = await arDb();
    if(db){ const s = await db.collection(col).where(field,'==',val).get(); return s.docs.map(d=>Object.assign({id:d.id}, d.data())); }
    const all = await arLocalOp('readonly', st=> st.index('col').getAll(col)) || [];
    return all.map(x=>x.v).filter(v=> v[field]===val);
  },
  async all(col){
    const db = await arDb();
    if(db){ const s = await db.collection(col).get(); return s.docs.map(d=>Object.assign({id:d.id}, d.data())); }
    const all = await arLocalOp('readonly', st=> st.index('col').getAll(col)) || [];
    return all.map(x=>x.v);
  },
};
async function arIsCloud(){ return !!(await arDb()); }

/* ---------- Fayllar (bo'laklab saqlanadi) ---------- */
const arBlobCache = new Map();
async function arSaveFile(fileId, blob){
  const b64 = await blobToBase64(blob);
  const n = Math.max(1, Math.ceil(b64.length / AR_CHUNK));
  for(let i=0;i<n;i++) await ST.set(AR_CHUNKS, fileId+'_'+i, {fileId, i, data: b64.slice(i*AR_CHUNK, (i+1)*AR_CHUNK)});
  arBlobCache.set(fileId, blob);
  return n;
}
async function arFileBlob(meta){
  if(arBlobCache.has(meta.id)) return arBlobCache.get(meta.id);
  const parts = await Promise.all(Array.from({length: meta.chunks||1}, (_,i)=> ST.get(AR_CHUNKS, meta.id+'_'+i)));
  if(parts.some(p=>!p)) throw new Error('Fayl to‘liq topilmadi');
  const blob = base64ToBlob(parts.map(p=>p.data).join(''), meta.type);
  arBlobCache.set(meta.id, blob);
  return blob;
}
async function arDeleteFile(meta){
  for(let i=0;i<(meta.chunks||1);i++){ try{ await ST.del(AR_CHUNKS, meta.id+'_'+i); }catch(e){} }
  arBlobCache.delete(meta.id);
}

    if(p1 !== p2) return err('Parollar bir-biriga mos emas.');
    const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    st.className = 'status'; st.textContent = 'Ro‘yxatdan o‘tkazilmoqda…';
    try{
      if(login.toLowerCase() === String(getCreds().login).toLowerCase() || await arFindUser(login)) { btn.disabled = false; return err('Bu login band. Boshqa login tanlang.'); }
      const salt = uid() + uid();
      const u = {id: 'u' + uid(), ism, telefon: phone, login, loginLower: login.toLowerCase(), salt, hash: arHashPass(p1, salt),
                 createdAt: new Date().toISOString(), blocked: false};
      await ST.set(AR_USERS, u.id, u);
      setUserSession({id:u.id, ism:u.ism, telefon:u.telefon, login:u.login});
      f.reset(); btn.disabled = false;
      showUserApp();
    }catch(ex){
      console.error(ex); btn.disabled = false;
      err('Ro‘yxatdan o‘tishda xatolik: ' + (ex && ex.message ? ex.message : ex) + '. Internet aloqasini tekshiring.');
    }
  };
})();
function formatUzPhone(v){
  let d = String(v).replace(/\D/g,'');
  if(!d.startsWith('998')) d = '998' + d.replace(/^998/,'');
  d = d.slice(0,12);
  const p = [d.slice(0,3), d.slice(3,5), d.slice(5,8), d.slice(8,10), d.slice(10,12)].filter(Boolean);
  return '+' + p.join(' ');
}

function uGo(tab){

async function uPollMessages(){
  const u = getUserSession(); if(!u) return;
  // akkaunt nofaol qilingan bo'lsa — chiqarib yuboramiz
  try{
    const me = await ST.get(AR_USERS, u.id);
    if(me && me.blocked){ clearUserSession(); clearInterval(uTimer); clearInterval(uMsgTimer); document.getElementById('userApp').style.display='none'; document.getElementById('uaContent').innerHTML=''; showLogin(); showBlockedNotice(); return; }
  }catch(e){}
  try{ uMsgs = await msgThread(u.id); }catch(e){ return; }
  const first = uSeenMsg === null;
  if(first) uSeenMsg = new Set();
  const fresh = uMsgs.filter(m=>m.from==='admin' && !m.readByUser && !uSeenMsg.has(m.id));
  fresh.forEach(m=> uSeenMsg.add(m.id));
  if(uTab==='chat' && fresh.length){ await msgMarkRead(uMsgs, 'user'); }
  else if(first && fresh.length){ showToast({icon:'💬', title:`Admindan ${fresh.length} ta yangi xabar`, time:msgTime(fresh[fresh.length-1].at), body:fresh[fresh.length-1].text, onClick:()=>uGo('chat')}); }

function arFieldMarkup(f, val){
  const [k,label,type,req,ph] = f;
  const lab = `<label>${esc(label)}${req?' <span style="color:var(--danger)">*</span>':' <span class="opt">(ixtiyoriy)</span>'}</label>`;
  if(type==='select') return `<div>${lab}<select id="ar_${k}"><option value="">— tanlang —</option>${ph.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  if(type==='textarea') return `<div class="full">${lab}<textarea id="ar_${k}" rows="3">${esc(val||'')}</textarea></div>`;
  if(k==='lokatsiya') return `<div class="full">${lab}<div class="loc-row"><input type="text" id="ar_${k}" value="${esc(val||'')}" placeholder="${esc(ph)}" style="flex:1;"><button type="button" class="secondary" id="arGeo" style="white-space:nowrap;padding:8px 10px;">📍 Joylashuvimni aniqlash</button></div><div class="hint">Do‘kon ichida turib bosing — xarita havolasi avtomatik yoziladi.</div></div>`;
  const full = (k==='tashkilot_nomi'||k==='manzil'||k==='rahbar_fish') ? 'full' : '';
  return `<div class="${full}">${lab}<input type="${type}" id="ar_${k}" value="${esc(val||'')}" placeholder="${esc(ph||'')}"></div>`;
}
