<!-- Bulutda saqlash (barcha qurilmalarda ko'rish) uchun — ixtiyoriy. Profil
     bo'limida Firebase loyihasi ulanmaguncha bu skriptlar shunchaki ishlatilmay
     turadi va ilovaning boshqa hech qanday joyiga ta'sir qilmaydi. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#132038;
    --ink-2:#1d2f52;
    --paper:#eef1f6;
    --paper-2:#ffffff;
    --line:#d7dce6;
    --gold:#b8863f;
    --gold-2:#8f6529;
    --ok:#2f7a4f;
    --danger:#a3323b;
    --text:#1a2233;
    --muted:#5b6579;
    --mono: 'Courier New', Courier, monospace;
    --serif: Georgia, 'Times New Roman', Times, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--text);font-family:var(--sans);}
  body{padding-bottom:60px;}

  .topbar{
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 60%, #24406e 100%);
    color:#fff; padding:18px 32px; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .topbar::after{
    content:"";position:absolute; right:-40px; top:-60px; width:220px;height:220px;border-radius:50%;
    border:1.5px dashed rgba(184,134,63,.45);
  }
  .topbar::before{
    content:"";position:absolute; right:30px; top:20px; width:120px;height:120px;border-radius:50%;
    border:1.5px solid rgba(184,134,63,.35);
  }
  .brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1;}
  .brand-logo{
    height:40px; width:auto; display:block; background:#fff; border-radius:8px;
    padding:6px 10px; flex:none;
  }
  .brand h1{font-family:var(--serif);font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;}
  .brand p{margin:2px 0 0;font-size:12px;color:#c9d3e6;letter-spacing:.3px;}
  .logout-btn{
    position:relative;z-index:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);
    color:#fff;padding:9px 16px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;
    font-family:var(--sans);flex:none;
  }
  .logout-btn:hover{background:rgba(255,255,255,.16);}

  .login-screen{
    position:fixed;inset:0;z-index:1000;
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 55%, #24406e 100%);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-card{
    background:#fff;border-radius:14px;padding:36px 34px;width:100%;max-width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;
  }
  .login-logo{height:46px;width:auto;margin:0 auto 18px;display:block;}
  .login-card h2{font-family:var(--serif);font-size:18px;margin:0 0 4px;color:var(--ink);}
  .login-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
  .login-card form{text-align:left;}
  .login-card label{margin-top:12px;}
  .login-card label:first-of-type{margin-top:0;}

  .tabs{
    display:flex;gap:6px;padding:0 32px;background:var(--paper-2);
    border-bottom:1px solid var(--line); overflow-x:auto;
  }
  .tab-btn{
    border:none;background:transparent;padding:14px 16px;font-size:13.5px;font-weight:600;
    color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;
    font-family:var(--sans);
  }
  .tab-btn .cnt{
    display:inline-block;min-width:18px;padding:0 5px;margin-left:7px;border-radius:9px;
    background:var(--paper);color:var(--muted);font-size:10.5px;font-weight:700;
  }
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--gold);}
  .tab-btn.active .cnt{background:var(--gold);color:#fff;}

  .wrap{max-width:1360px;margin:0 auto;padding:26px 32px;}
  .grid{display:grid;grid-template-columns:400px 1fr;gap:22px;align-items:start;}
  @media (max-width:980px){.grid{grid-template-columns:1fr;}}

  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:20px;}
  .card h2{font-family:var(--serif);font-size:16.5px;margin:0 0 4px;color:var(--ink);}
  .card .sub{font-size:12px;color:var(--muted);margin:0 0 16px;}

  .subtabs{display:flex;gap:8px;margin-bottom:16px;}
  .subtab{flex:1;border:1px solid var(--line);background:var(--paper);padding:8px 10px;border-radius:7px;
    font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;}
  .subtab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin:12px 0 5px;letter-spacing:.2px;}
  label .opt{font-weight:400;color:var(--muted);text-transform:none;}
  input[type=text],input[type=date],input[type=number],textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;
    font-family:var(--sans);background:#fbfcfe;color:var(--text);
  }
  input:focus,textarea:focus{outline:none;border-color:var(--gold);background:#fff;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hint{font-size:10.5px;color:var(--muted);margin-top:3px;}

  .actions{display:flex;gap:10px;margin-top:20px;}
  button.primary{
    background:var(--ink);color:#fff;border:none;padding:11px 18px;border-radius:7px;font-weight:700;
    font-size:13px;cursor:pointer;flex:1;font-family:var(--sans);
  }
  button.primary:hover{background:var(--ink-2);}
  button.secondary{
    background:transparent;color:var(--ink);border:1px solid var(--line);padding:11px 14px;border-radius:7px;
    font-weight:600;font-size:13px;cursor:pointer;font-family:var(--sans);
  }
  button.secondary:hover{border-color:var(--gold);color:var(--gold-2);}
  .status{margin-top:10px;font-size:12px;min-height:16px;}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--danger);}

  .right-col{display:flex;flex-direction:column;gap:18px;}
  .preview-shell{
    background:#c9cfdb;border-radius:10px;padding:18px;max-height:640px;overflow:auto;
  }
  .paper{
    background:#fff;width:210mm;min-height:100mm;margin:0 auto;padding:16mm 15mm;
    box-shadow:0 4px 18px rgba(0,0,0,.18);font-family:var(--serif);color:#1a1a1a;
    font-size:10.6px;line-height:1.48;box-sizing:border-box;
    overflow-wrap:anywhere;word-break:break-word;
  }
  .paper h3{font-size:12.5px;text-align:center;margin:0 0 2px;letter-spacing:.3px;overflow-wrap:anywhere;}
  .paper h4{font-size:11.3px;margin:16px 0 6px;letter-spacing:.3px;}
  .paper p{margin:5px 0;text-align:justify;}
  .paper .center{text-align:center;}
  .paper .doc-date{text-align:right;font-size:10.3px;margin-bottom:10px;white-space:nowrap;}
  .paper table{width:100%;border-collapse:collapse;margin:8px 0;font-size:10.3px;table-layout:fixed;}
  .paper table td,.paper table th{border:1px solid #999;padding:4px 6px;overflow-wrap:anywhere;word-break:break-word;}
  .paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px;font-size:10.3px;}
  .paper .sig b{display:block;margin-bottom:4px;}
  .paper .ph{color:#b23b3b;font-style:italic;}
  .paper .addendum{margin-top:16px;border-top:1px dashed #999;padding-top:10px;}
  .empty-preview{color:var(--muted);text-align:center;padding:60px 20px;font-size:13px;}
  .pdf-offscreen{position:fixed;left:-10000px;top:0;z-index:-1;}

  table.history{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.history th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
    padding:8px 8px;border-bottom:1px solid var(--line);
  }
  table.history td{padding:9px 8px;border-bottom:1px solid #eef0f4;vertical-align:top;}
  table.history tr:hover td{background:#f7f9fc;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
  .badge.bonus{background:#e8f3ec;color:var(--ok);}
  .badge.cancel{background:#f7e9ea;color:var(--danger);}
  .link-btn{background:none;border:none;color:var(--gold-2);font-weight:700;cursor:pointer;font-size:12px;padding:0;margin-right:12px;}
  .link-btn.del{color:var(--danger);}
  .empty-hist{color:var(--muted);font-size:12.5px;padding:18px 4px;}
</style>
</head>

// --- Kirish uchun boshlang'ich (standart) login va parol ---
// Bular faqat birinchi marta ishlatiladi. Tizimga kirgandan so'ng "Profil"
// bo'limi orqali login va parolni o'zgartirish mumkin — bunda yangi
// ma'lumotlar brauzer xotirasida (localStorage) saqlanadi va shu qurilmada
// keyingi kirishlarda ishlatiladi.
const APP_LOGIN = 'admin';
const APP_PASSWORD = 'birzum2026';
const AUTH_KEY = 'birzum_nasiya_auth';
const CREDS_KEY = 'birzum_nasiya_creds';

function getCreds(){
  try{
    const raw = localStorage.getItem(CREDS_KEY);
    if(raw){
      const c = JSON.parse(raw);
      if(c && c.login && c.password) return c;
    }
  }catch(e){}
  return {login: APP_LOGIN, password: APP_PASSWORD};
}
function setCreds(login, password){
  try{ localStorage.setItem(CREDS_KEY, JSON.stringify({login, password})); return true; }
  catch(e){ return false; }
}

// MUHIM: kirish holati ENDI faqat sessionStorage'da saqlanadi (localStorage'da
// EMAS). sessionStorage brauzer/ilova yopilganda (varaq/oyna yopilganda) avtomatik
// tozalanadi — shuning uchun ilova qayta ochilganda foydalanuvchi doim login va
// parolni qaytadan terib kirishi kerak bo'ladi. Oldingi versiyada holat
// localStorage'ga ham yozilib, u browser/kompyuter qayta ishga tushirilgandan
// keyin ham saqlanib qolar va tizim so'rovsiz ochilib ketardi — bu endi to'g'rilandi.
function isAuthed(){
  try{ return sessionStorage.getItem(AUTH_KEY) === '1'; }
  catch(e){ return false; }
}
function setAuthed(){
  try{ sessionStorage.setItem(AUTH_KEY,'1'); }catch(e){}
  // Eski versiyalarda localStorage'ga yozilgan "eslab qolingan" kirish holati
  // bo'lsa, uni ham tozalab qo'yamiz — shu qurilmada ilgari saqlanib qolgan
  // avtomatik kirish endi ishlamaydi.
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
}
function clearAuthed(){
  try{ sessionStorage.removeItem(AUTH_KEY); localStorage.removeItem(AUTH_KEY); }catch(e){}
}

  document.getElementById('loginScreen').style.display = 'none';

  initCloud().then(()=>{

}
function showLogin(){
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  const f = document.getElementById('loginForm');
  if(f) f.reset();
  const err = document.getElementById('loginError');
  if(err) err.textContent = '';
}

document.getElementById('loginForm').onsubmit = function(e){
  e.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  const creds = getCreds();
  if(u === creds.login && p === creds.password){
    err.textContent = '';
    setAuthed();
    showApp();
  }else{
    err.textContent = 'Login yoki parol noto‘g‘ri.';
  }
};
document.getElementById('logoutBtn').onclick = function(){

};

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fv(v,ph){
  const s = esc(v).trim();
  return s ? s : '<span class="ph">['+ph+']</span>';
}
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtDate(v){
  if(!v) return '<span class="ph">[sana]</span>';
  const iso = normalizeDateString(v);
  const parts = String(iso).split('-');
  if(parts.length===3){
    const [y,m,day] = parts;
    return esc(`${day}.${m}.${y}`);
  }
  return esc(v);
}
function pad2(n){ return String(n).padStart(2,'0'); }
function fullYear(y){
  y = parseInt(y,10);
  if(isNaN(y)) return y;
  if(y < 100) return y < 70 ? 2000+y : 1900+y; // ikki xonali yil: 00-69 -> 20xx, 70-99 -> 19xx
  return y;
}
// Turli manbalardan (Excel import, qo'lda kiritish) kelgan sana matnini
// <input type="date"> va fmtDate uchun kerakli "YYYY-MM-DD" ko'rinishiga
// keltiradi. Excel'dan matn (text) katak sifatida kelgan sanalar (masalan
// "6/23/26" yoki "23.06.2026") oldin hech qanday formatga o'girilmagani
// uchun shartnomada xato (o'girilmagan) holida chiqib qolar edi.
function normalizeDateString(v){
  const s = String(v||'').trim();
  if(!s) return s;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  // kun.oy.yil (nuqta bilan — O'zbekiston/Yevropa andozasi)
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if(m) return `${fullYear(m[3])}-${pad2(m[1])}-${pad2(m[2])}`;
  // kun-oy-yil (chiziqcha bilan)
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m) return `${fullYear(m[3])}-${pad2(m[1])}-${pad2(m[2])}`;
  // oy/kun/yil yoki kun/oy/yil (qiya chiziq bilan) — qaysi raqam 12 dan katta
  // bo'lsa o'sha kun ekanligi aniq bo'ladi; ikkalasi ham 12 dan kichik/teng
  // bo'lsa (noaniq holat), Excel'ning standart qisqa sana andozasiga muvofiq
  // oy/kun/yil deb qabul qilinadi.
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    const a = parseInt(m[1],10), b = parseInt(m[2],10), y = fullYear(m[3]);
    let month, day;
    if(a>12 && b<=12){ day=a; month=b; }
    else if(b>12 && a<=12){ month=a; day=b; }
    else { month=a; day=b; }
    return `${y}-${pad2(month)}-${pad2(day)}`;
  }
  return s;
}
function todayISO(){
  // Joriy (bugungi) sanani <input type="date"> uchun kerak bo'lgan
  // YYYY-MM-DD formatida qaytaradi — brauzerning mahalliy vaqt zonasi asosida.
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

  <p><b>«BIRZUM NASIYA» muddatli to‘lov tizimi</b> — mutloq mulk huquqi «FORTUNA BIZNES mikromoliya tashkiloti» MChJga

  <p><b>Kelishilgan aloqa kanallari</b> — Kreditor va SXKK ning elektron pochta manzillari, shuningdek ushbu shartnomaga

  <p><b>Tovar</b> — SXKK savdo obyektlarida Mijoz tomonidan sotib olinadigan tovarlar/xizmatlar bo‘lib, O‘zbekiston Respublikasi

  <p>Mazkur bo‘limda ko‘rsatilmagan atamalar ushbu shartnoma matnida O‘zbekiston Respublikasi qonunchiligiga muvofiq
  ma’nolarda qo‘llaniladi.</p>

  <h4>1. SHARTNOMA PREDMETI</h4>
  <p>1.1. Mazkur shartnoma doirasida SXKK Kreditorga «BIRZUM NASIYA muddatli to‘lov tizimi» orqali SXKK va uning
  Mijozlariga quyidagi axborot va konsultatsiya xizmatlari majmuasini tashkil etishni topshiradi, jumladan:</p>

  <p>— Mijozlar tomonidan Kreditordan olingan mikroqarzlar/kreditlarni qaytarish.</p>
  <p>1.2. Tomonlar «BIRZUM NASIYA muddatli to‘lov tizimi» mahsuloti doirasida mikroqarzlar va kreditlarni Mijozlarga

  yoki qisman to‘lovni amalga oshirish orqali, «BIRZUM NASIYA muddatli to‘lov tizimi» vositasida foydalaniladi.</p>

  <h4>2. SHARTNOMANI IJRO ETISHNING UMUMIY TARTIBI</h4>
  <p>2.1. Mazkur shartnoma Tomonlar tomonidan imzolangan vaqtdan boshlab tuzilgan hisoblanadi.</p>
  <p>2.2. Tomonlar shartnomani yuritish uchun mas’ul shaxslarni belgilaydilar va kelishilgan aloqa kanallari orqali ularning

  <p>2.3. Tomonlar shartnoma imzolanganidan keyin 5 (besh) ish kuni ichida o‘zaro hamkorlik bo‘yicha ma’lumotlarni bir-biriga

  <p>2.4. Tomonlar quyidagilar bilan kelishadilar:</p>
  <p>2.4.1. Shartnomada ko‘rsatilgan elektron pochta manzillariga yuborilgan barcha
  yozishmalar, bildirishnomalar va ogohlantirishlar, shu jumladan Tomonlar rekvizitlarini o‘zgartirishga oid ma’lumotlar, manzil
  egasiga to‘g‘ri yetkazilgan hisoblanadi.</p>
  <p>2.5. Tomonlar o‘z elektron pochta manzillari va/yoki boshqa kelishilgan aloqa kanallariga kelayotgan yozishmalarni o‘z
  vaqtida (kunda kamida bir marta) tekshirish majburiyatini oladilar.</p>
  <p>2.6. Agar SXKK xodimi ishdan bo‘shatilsa yoki shartnomada nazarda tutilgan vazifalardan, hamda Buyruqda ko‘rsatilgan
  vakolatlardan chetlashtirilsa, SXKK ushbu Buyruqni bekor qilishi va Kreditorni ushbu holat haqida Buyruq amal qilgan kunidan
  kechiktirmay kelishilgan aloqa kanallari orqali xabardor qilishi lozim, Buyruq raqami va sanasini ko‘rsatgan holda.</p>
  <p>2.7. Kreditor Mijozga mikroqarz/kredit berishni rad etishga haqli bo‘lib, buni Mijoz va SXKK ga izoh berish shart emas.</p>
  <p>2.8. Mazkur Shartnoma doirasida SXKK barcha kredit tashkilotlari (O‘zbekiston Respublikasi banklari), hisob raqamlari
  ochilgan yoki keyinchalik ochiladigan banklar bilan, Kreditor foydasiga mablag‘larni avtomatik yechib olish bo‘yicha

  <p>2.9. Tovar qaytarilganda yoki mijoz undan voz kechganda, SXKK Kreditordan haqiqatda kelib tushgan mablag‘ni Mijozning

  <p>2.10. Tovar qaytarilganda, SXKK o‘zi olgan mablag‘ni hamda Kreditor ushlab qolgan komissiya summasining 5% (besh
  foizi) miqdoridagi konsalting xizmati haqini Kreditorning hisob raqamiga o‘tkazadi. Kreditor ilgari olingan komissiyani 100%
  miqdorda daromaddan qaytarish orqali Mijozning kreditini to‘liq yopishni ta’minlaydi.</p>
  <p>2.11. Kreditor tovar/xizmat Mijozga mikroqarz/kredit hisobidan sotilganligi haqidagi ma’lumotni so‘rashi mumkin, va
  SXKK ushbu ma’lumotni 3 (uch) kalendar kun ichida taqdim etishga majburdir.</p>

  <h4>3. TO‘LOVLAR TARTIBI</h4>
  <p>3.1. Mazkur shartnoma doirasida ko‘rsatilgan xizmatlar uchun SXKK Kreditorga mukofot to‘lashi shart bo‘lib, ushbu

  <p>3.2. Mukofot to‘lovi Mijoz SXKK ga tovar/xizmatlar uchun to‘lov qilgan kuni amalga oshiriladi va bu Kreditorga mukofot

  <p>3.3. Kreditor har oy SXKK ga elektron shaklda xizmat ko‘rsatish akti va hisob-faktura taqdim etadi. SXKK ushbu aktni olgan
  kundan boshlab 3 (uch) ish kuni ichida imzolashi, muhr bilan tasdiqlashi va kelishilgan aloqa kanali orqali Kreditorga jo‘natishi
  shart. Agar SXKK aktdagi ma’lumotlarga rozi bo‘lmasa, u aktni kelishilgan aloqa kanali orqali asosli e’tirozlar bilan qaytarishi
  lozim shu muddat ichida. Belgilangan muddatda asosli e’tiroz yubormaslik SXKK ning akt va mukofot miqdoriga roziligi sifatida

  <p>3.4. Agar hisob-kitob sanasi bankning dam olish kuni (shanba, yakshanba) yoki bayram kuni (O‘zbekiston Respublikasi

  <p>3.5. Kreditorga mablag‘larni o‘tkazish bo‘yicha barcha xarajatlar, jumladan banklararo komissiyalar, SXKK zimmasiga
  yuklatiladi.</p>
  <p>3.6. To‘lov amalga oshirilgan sana sifatida mablag‘larning Kreditor hisob-raqamiga tushgan sanasi qabul qilinadi.</p>
  <p>3.7. Tomonlar kelishuviga ko‘ra yuborilgan hisob-faktura uchun alohida haq (to‘lov) talab etilmaydi. Mazkur hisob-faktura
  faqat shartnoma doirasida yuzaga kelgan qarzdorlikni qoplash (yopish) maqsadida rasmiylashtiriladi.</p>
  <p>3.8. Kreditor ajratilgan mikroqarz/kredit summasidan o‘ziga tegishli bo‘lgan mukofot (komissiya) summasini ushlab qolgan

  <h4>4. MA’LUMOTNI MAXFIYLIGI</h4>
  <p>4.1. Tomonlar shartnoma ijrosi davomida olingan ma’lumotlarni qat’iy maxfiy saqlashga va ushbu ma’lumotlarning oshkor
  etilmasligi uchun barcha mumkin bo‘lgan choralarni ko‘rishga majburdirlar.</p>
  <p>4.2. SXKK quyidagilarni bajarishga majbur:</p>
  <p>— Shartnoma ijrosi davomida Kreditor va Mijozlardan olingan, Tomonlar tomonidan tijorat siri deb tan olingan barcha
  ma’lumotlarni, shuningdek, Shartnoma muddati tugagandan yoki erta bekor qilinganidan keyin 5 (besh) yil davomida

  <p>— Shaxsga doir ma’lumotlarni O‘zbekiston Respublikasi qonunchiligiga muvofiq saqlash;</p>
  <p>— Tijorat siri va shaxsga doir ma’lumotlarni O‘zbekiston Respublikasi qonunchiligida belgilangan hollarda va tartibda
  taqdim etish.</p>
  <p>4.3. Shartnoma va uning ijrosi bilan bog‘liq barcha ma’lumotlar, jumladan, hujjatlarni rasmiylashtirish jarayonida olingan
  Mijozlar haqidagi ma’lumotlar; Kreditor tomonidan Mijozlarga ko‘rsatilgan mikroqarz/mikrokreditlar summasi va miqdori,
  «BIRZUM NASIYA muddatli to‘lov tizimi» mahsuloti doirasida berilgan xizmatlar, hujjat aylanmasi tartibi, shuningdek

  belgilangan hollarda vakolatli davlat organlariga taqdim etilishi mumkin. Ommaviy axborot esa maxfiy ma’lumot hisoblanmaydi.</p>
  <p>4.4. Maxfiy ma’lumotlarni oshkor qilish deganda, harakat yoki harakatsizlik natijasida maxfiy ma’lumotlarning istalgan
  shaklda (og‘zaki, yozma, elektron yoki boshqa), shu jumladan texnik vositalardan foydalangan holda, egasining roziligisiz yoki

  <p>4.5. Agar Kreditor va/yoki SXKKga Tomonlar xodimlaridan biri tomonidan axborot maxfiyligining amaldagi yoki ehtimoliy
  buzilishi ma’lum bo‘lsa, ular bu haqda zudlik bilan qarshi Tomonni xabardor qilishlari hamda maxfiy ma’lumotlarning taqdim
  etilishi (oshkor etilishi)ni oldini olish uchun barcha zarur choralarni ko‘rishlari shart.</p>
  <p>4.6. Kreditor tomonidan SXKK ga «BIRZUM NASIYA muddatli to‘lov tizimi»ga kirish uchun berilgan hisob ma’lumotlari

  <p>4.7. SXKK hisob ma’lumotlarini maxfiy va xavfsiz saqlashni ta’minlashi, ularni uchinchi shaxslarga oshkor qilmasligi va
  faqat mazkur shartnomani ijro etish maqsadida foydalanishi shart. Hisob ma’lumotlari berilgan vaqtdan boshlab ularni saqlash va
  ruxsatsiz kirishning oldini olish bo‘yicha to‘liq javobgarlik SXKK zimmasiga yuklanadi.</p>

  <h4>5. TOMONLARNING JAVOBGARLIGI</h4>
  <p>5.1. Shartnoma bo‘yicha o‘z zimmasiga olgan majburiyatlarni bajarmaslik yoki noto‘g‘ri bajarish uchun Tomonlar

  <p>5.2. Shartnoma talablarini bajarmaslik natijasida kelib chiqadigan noxush oqibatlar bilan bog‘liq barcha xavf-xatarni
  bunday buzilish sodir qilgan Tomon o‘z zimmasiga oladi.</p>
  <p>5.3. Mazkur shartnoma doirasida SXKK, SXKK va Kreditor o‘rtasidagi axborot almashish tizimiga ruxsatsiz shaxslar
  kirishiga javobgar bo‘lib, taqdim etilgan kirish huquqining noqonuniy ishlatilishi natijasida Kreditorga kelgan zararlarni to‘liq
  qoplaydi.</p>
  <p>5.4. Har qanday isbotlangan zarar qoplanishi shart. Tomonlar ushbu Shartnoma shartlari buzilgan taqdirda yuzaga kelgan
  barcha zarar va xarajatlarni to‘liq qoplaydilar.</p>
  <p>5.5. 2021-yil 04.10 sanasidagi PQ-5252-sonli Prezident qaroriga muvofiq, SXKK barcha savdolarini o‘zining kassa
  apparati yordamida mustaqil ravishda fiskallashtirishga majburdir.</p>
  <p>5.6. SXKK hisob ma’lumotlari yordamida tizimda amalga oshirilgan barcha harakatlar SXKK tomonidan amalga oshirilgan
  hisoblanadi va ularga tegishli huquqiy oqibatlarni keltirib chiqaradi.</p>
  <p>5.7. SXKK quyidagi holatlar natijasida Kreditor va/yoki uchinchi shaxslarga yetkazilgan har qanday zarar uchun javobgar
  bo‘ladi:</p>
  <p>— hisob ma’lumotlarining yo‘qolishi, oshkor qilinishi yoki kompromatatsiyasi;</p>
  <p>— SXKK aybi bilan tizimga ruxsatsiz kirish;</p>
  <p>— SXKK xodimlarining harakatlari yoki harakatsizligi.</p>
  <p>5.8. SXKK hisob ma’lumotlari yo‘qolgan, kompromatatsiya qilingan yoki ruxsatsiz kirish aniqlangan hollarda Kreditorni

// Bu ilova mustaqil HTML fayl sifatida brauzerda ochiladi, shuning uchun
// ma'lumotlar brauzerning o'z xotirasida (localStorage) saqlanadi — internetsiz
// ham ishlaydi, faqat shu kompyuter/shu brauzerga tegishli bo'ladi.
let activeTab = 'bosh';
let bonusSubTab = 'bonus'; // 'bonus' | 'cancel'
const DB = {bosh:[], qoshimcha:[], bonus:[], hamkor:[]};
const STORAGE_PREFIX = 'birzum_nasiya_';
let storageWarned = false;

function loadAll(){
  SECTIONS.forEach(s=>{
    if(!s.storageKey) return; // Profil kabi hujjat tarixi bo'lmagan bo'limlar
    try{
      const raw = localStorage.getItem(STORAGE_PREFIX + s.storageKey);
      DB[s.key] = raw ? JSON.parse(raw) : [];
    }catch(e){
      DB[s.key] = [];
    }
    initCounterFromExisting(s.key);
  });
}
function persist(key){
  const s = SECTIONS.find(x=>x.key===key);
  try{
    localStorage.setItem(STORAGE_PREFIX + s.storageKey, JSON.stringify(DB[key]));
    scheduleAutoBackup(key);
    cloudPushSection(key);
    return true;
  }catch(e){
    if(!storageWarned){
      storageWarned = true;
      alert('Diqqat: hujjatlarni saqlash imkoni bo‘lmadi (brauzer xotirasi bloklangan). PDF baribir yuklanadi, lekin tarixga yozilmaydi.');
    }
    return false;
  }
}

/* ============================= BULUTDA SAQLASH (BARCHA QURILMALARDA) =============================
   Ilova asosan localStorage'da (shu brauzer/qurilmada) ishlaydi — bu o'zgarmaydi.
   Qo'shimcha ravishda, agar Profil bo'limida Firebase (Firestore) loyihasi
   ulangan bo'lsa, har bir bo'lim (Hamkorlar, Bosh kelishuv, Qo'shimcha kelishuv,
   Bonus) o'zgarganda shu ma'lumot bulutga (Firestore'ga) ham yoziladi va sahifa
   ochilganda avval bulutdan eng so'nggi holat o'qib olinadi — shu orqali bir
   qurilmada kiritilgan hamkor boshqa qurilmada ham ko'rinadi. Firebase
   ulanmagan bo'lsa, ilova avvalgidek faqat shu qurilmada (localStorage) ishlayveradi.
*/
const CLOUD_CONFIG_KEY = STORAGE_PREFIX + 'cloud_config';
const CLOUD_COLLECTION = 'birzum_nasiya_data';
let cloudApp = null;
let cloudDb = null;
let cloudReady = false;
let cloudStatus = 'off'; // 'off' | 'connecting' | 'online' | 'error'
let cloudStatusMsg = '';
let cloudUnsubscribers = [];
let cloudPulledOnce = false;

// Ilovaga o'rnatib qo'yilgan (kod ichiga singdirilgan) Firebase konfiguratsiyasi.
// Shu tufayli har bir yangi qurilma/brauzerda Profil bo'limiga qo'lda
// firebaseConfig kiritish shart emas — sayt ochilishi bilan avtomatik
// shu loyihaga ulanadi. Agar kimdir Profil bo'limidan boshqa (masalan test)
// konfiguratsiyani qo'lda joylashtirsa, o'sha ustunlik qiladi.
const DEFAULT_CLOUD_CONFIG = {
  apiKey: "AIzaSyDel7Qc1DG2sxKNlL1iEYtzq_3vJ_BUn3A",
  authDomain: "shartnoma-web.firebaseapp.com",
  projectId: "shartnoma-web",
  storageBucket: "shartnoma-web.firebasestorage.app",
  messagingSenderId: "535357750557",
  appId: "1:535357750557:web:f73dd50cb80180c281f5f4",
  measurementId: "G-0VFQL9QWYD"
};

function getCloudConfig(){
  try{
    const raw = localStorage.getItem(CLOUD_CONFIG_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return DEFAULT_CLOUD_CONFIG;
}
function setCloudConfig(cfg){
  try{ localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg)); return true; }
  catch(e){ return false; }
}
function clearCloudConfig(){
  try{ localStorage.removeItem(CLOUD_CONFIG_KEY); }catch(e){}
}

function stopCloudRealtime(){
  cloudUnsubscribers.forEach(u=>{ try{ u(); }catch(e){} });
  cloudUnsubscribers = [];
}

async function initCloud(){
  stopCloudRealtime();
  cloudApp = null; cloudDb = null; cloudReady = false; cloudPulledOnce = false;
  const cfg = getCloudConfig();
  if(!cfg){ cloudStatus = 'off'; cloudStatusMsg = ''; updateCloudStatusUI(); return; }
  if(typeof firebase === 'undefined'){
    cloudStatus = 'error'; cloudStatusMsg = 'Bulut kutubxonasi yuklanmadi (internet aloqasini tekshiring).';
    updateCloudStatusUI();
    return;
  }
  cloudStatus = 'connecting'; cloudStatusMsg = ''; updateCloudStatusUI();
  try{
    // Qayta ulanganda (masalan, konfiguratsiya o'zgartirilganda) eski ilova
    // nusxasi to'liq o'chirilib, har safar yangi, toza ulanish yaratiladi.
    if(firebase.apps && firebase.apps.length){
      for(const a of firebase.apps.slice()){ try{ await a.delete(); }catch(e){} }
    }
    cloudApp = firebase.initializeApp(cfg);
    cloudDb = firebase.firestore(cloudApp);
    await cloudPullAll();
    cloudReady = true;
    cloudStatus = 'online'; cloudStatusMsg = '';
    subscribeCloudRealtime();
  }catch(e){
    console.error(e);
    cloudReady = false;
    cloudStatus = 'error';
    cloudStatusMsg = (e && e.message) ? e.message : String(e);
  }
  updateCloudStatusUI();
}

// Ilova ochilganda bulutdagi ENG SO'NGGI holatni bir marta to'liq o'qib, mahalliy
// (shu qurilmadagi) ma'lumotni shu bilan almashtiradi — shu orqali boshqa
// qurilmada qo'shilgan hamkorlar shu yerda ham ko'rinadi.
async function cloudPullAll(){
  if(!cloudDb) return;
  const keys = SECTIONS.filter(s=>s.storageKey).map(s=>s.key);
  for(const key of keys){
    try{
      const snap = await cloudDb.collection(CLOUD_COLLECTION).doc(key).get();
      if(snap.exists){
        const data = snap.data();
        DB[key] = Array.isArray(data.records) ? data.records : [];
        try{ localStorage.setItem(STORAGE_PREFIX + (SECTIONS.find(s=>s.key===key).storageKey), JSON.stringify(DB[key])); }catch(e){}
      }
      initCounterFromExisting(key);
    }catch(e){
      console.error('Bulutdan o‘qishda xatolik ('+key+'):', e);
    }
  }
  cloudPulledOnce = true;
}

// Bo'lim o'zgarganda (qo'shish/tahrirlash/o'chirish/import) shu bo'limning
// butun ro'yxati bulutga yoziladi — bu localStorage'ga yozishning aynan o'zi
// kabi, faqat manzil Firestore hujjati.
function cloudPushSection(key){
  if(!cloudReady || !cloudDb) return;
  cloudDb.collection(CLOUD_COLLECTION).doc(key).set({
    records: DB[key] || [],
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(e=>{
    console.error('Bulutga yozishda xatolik ('+key+'):', e);
    cloudStatus = 'error';
    cloudStatusMsg = (e && e.message) ? e.message : String(e);
    updateCloudStatusUI();
  });
}

// Boshqa qurilmada ma'lumot o'zgarsa, shu yerda sahifani qayta ochmasdan ham
// ro'yxat (tarix/hamkorlar jadvali) avtomatik yangilanadi. Forma maydonlariga
// tegilmaydi — shuning uchun kimdir formani to'ldirib turgan bo'lsa ham buzilmaydi.
function subscribeCloudRealtime(){
  if(!cloudDb) return;
  const keys = SECTIONS.filter(s=>s.storageKey).map(s=>s.key);
  keys.forEach(key=>{
    const unsub = cloudDb.collection(CLOUD_COLLECTION).doc(key).onSnapshot(snap=>{
      // O'zimiz hozirgina yozgan (hali serverga tasdiqlanmagan) o'zgarishni
      // qayta ishlamaymiz — aks holda cheksiz aylanishga olib kelishi mumkin.
      if(snap.metadata && snap.metadata.hasPendingWrites) return;
      if(!cloudPulledOnce) return;
      if(!snap.exists) return;
      const data = snap.data();
      DB[key] = Array.isArray(data.records) ? data.records : [];
      try{ localStorage.setItem(STORAGE_PREFIX + (SECTIONS.find(s=>s.key===key).storageKey), JSON.stringify(DB[key])); }catch(e){}
      initCounterFromExisting(key);
      renderTabs();
      if(key==='hamkor' && activeTab==='hamkor') renderHamkorTable();
      else if(activeTab===key) renderHistory(key);
    }, err=>{
      console.error('Bulut tinglashda xatolik ('+key+'):', err);
    });
    cloudUnsubscribers.push(unsub);
  });
}

function cloudStatusLabel(){
  if(cloudStatus==='online') return {cls:'ok', text:'✅ Ulangan — ma’lumotlar barcha qurilmalarda avtomatik sinxronlanadi.'};
  if(cloudStatus==='connecting') return {cls:'', text:'⏳ Ulanmoqda…'};
  if(cloudStatus==='error') return {cls:'err', text:'⚠️ Ulanishda xatolik: '+esc(cloudStatusMsg)};
  return {cls:'', text:'Ulanmagan — ma’lumotlar faqat shu qurilmada (brauzerda) saqlanadi.'};
}
function updateCloudStatusUI(){
  const el = document.getElementById('cloudStatus');
  if(!el) return;
  const s = cloudStatusLabel();
  el.className = 'status ' + s.cls;
  el.textContent = s.text;
}

/* ============================= HAR BIR BO'LIMNI ALOHIDA FAYLGA ZAXIRALASH / TIKLASH =============================
   Ilova ma'lumotlari brauzer xotirasida (localStorage) saqlanadi, ammo bu brauzer
   tozalansa yo'qolishi mumkin. Shu sababli har bir bo'lim (Hamkorlar, Bosh
   kelishuv, Qo'shimcha kelishuv, Bonus) O'ZINING ALOHIDA JSON fayliga yoziladi —
   bitta umumiy faylga emas. Papka tanlangan bo'lsa, shu bo'limda biror
   o'zgarish (qo'shish/tahrirlash/o'chirish/import) bo'lganda faqat o'sha
   bo'limning fayli avtomatik qayta yoziladi.
*/
const BACKUP_FILE_NAME = {
  hamkor: 'BirZum_Nasiya_Hamkorlar.json',
  bosh: 'BirZum_Nasiya_Bosh_kelishuv.json',
  qoshimcha: 'BirZum_Nasiya_Qoshimcha_kelishuv.json',
  bonus: 'BirZum_Nasiya_Bonus.json'
};
function buildSectionBackupPayload(key){
  const s = SECTIONS.find(x=>x.key===key);
  let counter = 0;
  try{ counter = parseInt(localStorage.getItem(counterStorageKey(key)) || '0', 10) || 0; }catch(e){ counter = 0; }
  return {
    app: 'birzum_nasiya_backup',
    version: 2,
    section: key,
    sectionLabel: s ? s.label : key,
    exportedAt: new Date().toISOString(),
    counter,
    records: DB[key] || []
  };
}
const autoBackupTimers = {};
function scheduleAutoBackup(key){
  // Ma'lumot har o'zgarganda darhol emas, biroz kutib (debounce) zaxira yoziladi —
  // shu orqali ketma-ket bir nechta o'zgarish bo'lsa ham papkaga ortiqcha yozilmaydi.
  if(!savedDirHandle) return;
  if(autoBackupTimers[key]) clearTimeout(autoBackupTimers[key]);
  autoBackupTimers[key] = setTimeout(()=>{ autoBackupTimers[key] = null; exportSectionBackup(key, false); }, 800);
}
async function exportSectionBackup(key, forceDownload){
  const statusEl = document.getElementById('status_backup');
  try{
    const payload = buildSectionBackupPayload(key);
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const filename = BACKUP_FILE_NAME[key] || ('BirZum_Nasiya_'+key+'.json');
    let savedToFolder = false;
    if(savedDirHandle){
      savedToFolder = await saveBlobToFolder(blob, filename, key);
    }
    if(!savedToFolder && forceDownload){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 3000);
    }
    return {ok:true, savedToFolder, filename};
  }catch(e){
    console.error(e);
    if(statusEl && forceDownload){ statusEl.className = 'status err'; statusEl.textContent = 'Zaxiralashda xatolik: '+(e && e.message ? e.message : e); }
    return {ok:false};
  }
}
async function exportAllBackupsNow(){
  const statusEl = document.getElementById('status_backup');
  const keys = SECTIONS.filter(s=>s.storageKey).map(s=>s.key);
  const results = [];
  for(const key of keys){
    results.push(await exportSectionBackup(key, true));
  }
  if(statusEl){
    const ok = results.filter(r=>r.ok);
    const toFolder = ok.filter(r=>r.savedToFolder);
    statusEl.className = ok.length===keys.length ? 'status ok' : 'status err';
    statusEl.textContent = toFolder.length===ok.length && savedDirHandle
      ? 'Har bir bo‘lim o‘zining alohida fayliga («'+esc(savedDirHandle.name)+'» papkasiga) yozildi: '+ok.map(r=>r.filename).join(', ')+'.'
      : 'Har bir bo‘lim uchun alohida fayl yuklab olindi: '+ok.map(r=>r.filename).join(', ')+'.';
  }
}
function restoreFromBackupFile(file){
  const statusEl = document.getElementById('status_backup');
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const payload = JSON.parse(reader.result);
      // Yangi format — bitta bo'limga tegishli alohida fayl (payload.section + payload.records).
      if(payload && payload.section && Array.isArray(payload.records)){
        const s = SECTIONS.find(x=>x.key===payload.section);
        if(!s){ throw new Error('Faylda tanish bo‘lim topilmadi.'); }
        if(!confirm('Diqqat: zaxiradan tiklash joriy «'+s.label+'» bo‘limidagi barcha ma’lumotlarni fayldagi ma’lumotlar bilan almashtiradi. Davom etasizmi?')) return;
        DB[s.key] = payload.records;
        persistNoBackup(s.key);
        if(payload.counter !== undefined){
          try{ localStorage.setItem(counterStorageKey(s.key), String(payload.counter)); }catch(e){}
        }
        initCounterFromExisting(s.key);
        scheduleAutoBackup(s.key);
        renderApp();
        if(statusEl){ statusEl.className = 'status ok'; statusEl.textContent = '«'+s.label+'» bo‘limi zaxiradan muvaffaqiyatli tiklandi.'; }
        return;
      }
      // Eski (bitta faylga birlashtirilgan) format bilan ham moslik — payload.data ichida
      // bir nechta bo'lim bo'lishi mumkin edi.
      const data = payload && payload.data ? payload.data : payload;
      if(!data || typeof data !== 'object'){ throw new Error('Fayl formati noto‘g‘ri.'); }
      const foundKeys = SECTIONS.filter(s=>s.storageKey && Array.isArray(data[s.key]));
      if(!foundKeys.length){ throw new Error('Faylda tanish bo‘limlar topilmadi.'); }
      if(!confirm('Diqqat: zaxiradan tiklash joriy ma’lumotlarni («'+foundKeys.map(s=>s.label).join('», «')+'») fayldagi ma’lumotlar bilan almashtiradi. Davom etasizmi?')) return;
      foundKeys.forEach(s=>{
        DB[s.key] = data[s.key];
        persistNoBackup(s.key);
        if(payload.counters && payload.counters[s.key] !== undefined){
          try{ localStorage.setItem(counterStorageKey(s.key), String(payload.counters[s.key])); }catch(e){}
        }
        initCounterFromExisting(s.key);
        scheduleAutoBackup(s.key);
      });
      renderApp();
      if(statusEl){ statusEl.className = 'status ok'; statusEl.textContent = 'Zaxiradan muvaffaqiyatli tiklandi: '+foundKeys.map(s=>s.label).join(', ')+'.'; }
    }catch(e){
      console.error(e);
      if(statusEl){ statusEl.className = 'status err'; statusEl.textContent = 'Zaxiradan tiklashda xatolik: '+(e && e.message ? e.message : e); }
    }
  };
  reader.onerror = ()=>{ if(statusEl){ statusEl.className='status err'; statusEl.textContent = 'Faylni o‘qib bo‘lmadi.'; } };
  reader.readAsText(file);
}
// Bitta bo'limni tiklashda ushbu bo'lim uchun avto-zaxira darhol qayta
// ishga tushmasligi uchun — localStorage'ga yoziladi, keyin scheduleAutoBackup
// chaqiruvchi tomonidan alohida ishga tushiriladi.
function persistNoBackup(key){
  const s = SECTIONS.find(x=>x.key===key);
  try{ localStorage.setItem(STORAGE_PREFIX + s.storageKey, JSON.stringify(DB[key])); }catch(e){}
  cloudPushSection(key);
}

/* ============================= AVTOMATIK RAQAMLASH (№) ============================= */
// Har bir bo'lim uchun alohida, doimiy o'sib boruvchi hisoblagich — hujjat/hamkor
// yaratilganda unga birin-ketin raqam avtomatik beriladi. Biror yozuv keyinchalik
// o'chirilsa ham bu hisoblagich pasaymaydi, shuning uchun qolgan yozuvlarning
// raqami o'zgarmay qoladi va yangi qo'shilganlar doim keyingi bo'sh raqamni oladi.
function counterStorageKey(key){ return STORAGE_PREFIX + 'counter_' + key; }
function initCounterFromExisting(key){
  // Eski (bu funksiya qo'shilishidan oldingi) bazada qo'lda kiritilgan № qiymatlari
  // bo'lishi mumkin — hisoblagich ulardan kichik bo'lib qolmasligi uchun tekshiramiz.
  let maxExisting = 0;
  (DB[key]||[]).forEach(r=>{
    const n = parseInt(r && r.data && r.data.no, 10);
    if(!isNaN(n) && n > maxExisting) maxExisting = n;
  });
  let cur = 0;
  try{ cur = parseInt(localStorage.getItem(counterStorageKey(key)) || '0', 10) || 0; }catch(e){ cur = 0; }
  if(maxExisting > cur){
    try{ localStorage.setItem(counterStorageKey(key), String(maxExisting)); }catch(e){}
  }
}
function nextSequenceNumber(key){
  let cur = 0;
  try{ cur = parseInt(localStorage.getItem(counterStorageKey(key)) || '0', 10) || 0; }catch(e){ cur = 0; }
  const next = cur + 1;
  try{ localStorage.setItem(counterStorageKey(key), String(next)); }catch(e){}
  return next;
}

// Manba bo'limlarni shu tartibda ko'rib chiqamiz: Hamkorlar — asosiy manba
// (eng ishonchli reestr), keyin Bosh kelishuv, Qo'shimcha kelishuv, Bonus —
// ammo yakuniy qiymat sifatida har doim ENG SO'NGGI (createdAt bo'yicha) va
// bo'sh bo'lmagan qiymat olinadi, qaysi bo'limda bo'lishidan qat'iy nazar.
const AUTOFILL_SCAN_ORDER = ['hamkor','bosh','qoshimcha','bonus'];

function buildMergedProfile(stir){
  const s = String(stir||'').trim();
  if(!s) return null;
  const profile = {};
  const profileTime = {};
  let found = false;
  AUTOFILL_SCAN_ORDER.forEach(dbKey=>{
    const map = CANON_FIELD_MAP[dbKey];
    (DB[dbKey]||[]).forEach(r=>{
      if(String((r.data && r.data.stir) || '').trim() !== s) return;
      found = true;
      const t = new Date(r.createdAt).getTime() || 0;
      Object.keys(map).forEach(srcKey=>{
        const canon = map[srcKey];
        const val = r.data ? r.data[srcKey] : undefined;
        if(val === undefined || val === null || String(val).trim() === '') return;
        if(profileTime[canon] === undefined || t >= profileTime[canon]){
          profile[canon] = val;
          profileTime[canon] = t;
        }
      });
    });
  });
  return found ? profile : null;
}

function autofillFromBosh(key){
  const statusEl = document.getElementById('status_'+key);
  const stirEl = document.getElementById('f_stir');
  const stirVal = stirEl ? stirEl.value : '';
  const profile = buildMergedProfile(stirVal);
  if(!profile){
    if(statusEl){ statusEl.className='status err'; statusEl.textContent = 'Diqqat: bu STIR bo‘yicha hech qanday bo‘limda ma’lumot topilmadi. Avval «Hamkorlar» bo‘limida shu tashkilotni kiriting.'; }
    return;
  }
  const map = AUTOFILL_MAP[key];
  if(!map) return;
  const missingLabels = [];
  Object.keys(map).forEach(targetField=>{
    const el = document.getElementById('f_'+targetField);
    if(!el) return;
    const canon = map[targetField];
    const val = profile[canon];
    if(val){
      el.value = val;
    }else{
      const fdef = FIELDS[key].find(f=>f[0]===targetField);
      if(fdef) missingLabels.push(fdef[1]);
    }
  });
  if(statusEl){
    statusEl.className = 'status ok';
    let msg = 'Ma’lumotlar «'+(profile.tashkilot_nomi||'tashkilot')+'» bo‘yicha avtomatik to‘ldirildi.';
    if(missingLabels.length){
      msg += ' Diqqat: quyidagi maydonlar hech bir bo‘limda topilmagani uchun bo‘sh qoldirildi: '+missingLabels.join(', ')+' — kerak bo‘lsa qo‘lda kiriting.';
    }
    statusEl.textContent = msg;
  }
}

/* ============================= FAYLDAN IMPORT QILISH (barcha bo'limlar uchun umumiy) ============================= */
// Hamkorlar, Bosh kelishuv, Qo'shimcha kelishuv va Bonus (shartnoma/bekor qilish)
// bo'limlariga Excel (.xlsx/.xls) yoki CSV fayldan bir vaqtda ko'plab yozuvlarni
// import qilish imkonini beradi. Ustun sarlavhalari FIELDS ro'yxatidagi maydon
// nomi yoki uning yorlig'i (label) bilan (belgilarga sezgir bo'lmagan holda) mos kelsa,
// qiymat tegishli maydonga joylashtiriladi. № ustuni import qilinmaydi — u ham
// avtomatik tayinlanadi.
// O'zbekcha kirill harflarni lotinga o'giradi — shu orqali ustun sarlavhasi
// kirillda, forma maydoni lotinda (yoki aksincha) yozilgan bo'lsa ham moslashadi.
const CYR2LAT_MAP = {
  'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z','и':'i','й':'y',
  'к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f',
  'х':'x','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'','ы':'i','ь':'','э':'e','ю':'yu','я':'ya',
  'ў':'o','қ':'q','ғ':'g','ҳ':'h'
};
function cyrToLat(s){
  return String(s||'').toLowerCase().split('').map(ch=> CYR2LAT_MAP[ch]!==undefined ? CYR2LAT_MAP[ch] : ch).join('');
}
function normKey(s){
  return cyrToLat(s).replace(/[^\p{L}\p{N}]+/gu,'').trim();
}
// Ba'zi maydonlar Excel fayllarda juda qisqartirilgan sarlavhalar bilan keladi
// (masalan "Hisob raqami" o'rniga faqat "Ҳ/р", "H/r" yoki "Х/р"). Bunday qisqa
// (2 harfli) sarlavhalar avvalgi versiyada umuman moslashtirilmas edi, chunki
// moslashtirish faqat 3+ harfli nomzodlar uchun ishlagan. Shu sababli aynan shu
// maydonlar uchun qo'shimcha "sinonim" nomzodlarni aniq (to'liq mos keladigan)
// ro'yxatga qo'shamiz — bu qisqa ustun nomlarini ham to'g'ridan-to'g'ri
// tanib olishni ta'minlaydi.
const FIELD_EXTRA_SYNONYMS = {
  hisob_raqami: ['hr','xr','h/r','x/r','ҳ/р','х/р','rs'],
  hr: ['hr','xr','h/r','x/r','ҳ/р','х/р','rs']
};
function buildFieldMatchers(key){
  return FIELDS[key].filter(f=>f[0]!=='no').map(f=>{
    const fieldKey = f[0], label = f[1], type = f[2];
    const shortLabel = label.split('(')[0];
    const extras = (FIELD_EXTRA_SYNONYMS[fieldKey] || []).map(normKey);
    const candidates = Array.from(new Set([normKey(fieldKey), normKey(label), normKey(shortLabel), ...extras])).filter(Boolean);
    return {fieldKey, type, candidates};
  });
}
function importRowToData(key, row, matchers){
  const d = {};
  const rowNormMap = {};
  Object.keys(row).forEach(h=>{
    const nk = normKey(h);
    if(nk) rowNormMap[nk] = row[h];
  });
  const rowNormKeys = Object.keys(rowNormMap);
  matchers.forEach(m=>{
    let found;
    // 1) Aniq mos kelish (ustun nomi maydon nomi/yorlig'iga so'zma-so'z teng —
    //    kirill/lotin farqi normKey ichida avtomatik hisobga olinadi)
    for(const cand of m.candidates){
      if(rowNormMap[cand] !== undefined){ found = rowNormMap[cand]; break; }
    }
    // 2) Aniq mos kelmasa — qisman mos kelishni tekshiramiz (ustun nomi ichida
    //    maydon nomi bor yoki aksincha), bu kichik farqlar (masalan qisqartma,
    //    qo'shimcha so'z) uchun ishlaydi. Nomuvofiq uzunlikdagi (juda uzun/
    //    umumiy) nomzodlarning tasodifan mos kelishini kamaytirish uchun eng
    //    yaqin uzunlikdagi ustunni tanlaymiz.
    if(found === undefined){
      let bestRk, bestDiff = Infinity;
      for(const cand of m.candidates){
        if(cand.length < 3) continue;
        rowNormKeys.forEach(rk=>{
          if(rk.length < 3) return;
          if(rk.includes(cand) || cand.includes(rk)){
            const diff = Math.abs(rk.length - cand.length);
            if(diff < bestDiff){ bestDiff = diff; bestRk = rk; }
          }
        });
      }
      if(bestRk) found = rowNormMap[bestRk];
    }
    if(found !== undefined && found !== null){
      let val = found;
      // Excel sana katagi ba'zan JS Date obyekti sifatida keladi — uni matnga aylantiramiz
      if(val instanceof Date && !isNaN(val)){
        const y=val.getFullYear(), mo=String(val.getMonth()+1).padStart(2,'0'), da=String(val.getDate()).padStart(2,'0');
        val = `${y}-${mo}-${da}`;
      }
      val = String(val).trim();
      // Sana turidagi maydonlar uchun — Excel'da matn katak sifatida kelgan
      // (masalan "6/23/26" yoki "23.06.2026") sanalarni ham "YYYY-MM-DD"
      // ko'rinishiga keltiramiz, aks holda forma/hujjatda noto'g'ri chiqadi.
      if(m.type==='date' && val) val = normalizeDateString(val);
      if(val !== '') d[m.fieldKey] = val;
    }
  });
  return d;
}

async function handleImportFile(key, file){
  const statusEl = document.getElementById('status_'+key);
  if(typeof XLSX === 'undefined'){
    if(statusEl){ statusEl.className='status err'; statusEl.textContent='Excel kutubxonasi yuklanmadi. Internet aloqasini tekshirib, sahifani qayta yuklang.'; }
    return;
  }
  try{
    if(statusEl){ statusEl.className='status'; statusEl.textContent='Fayl o‘qilmoqda…'; }
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true});
    const matchers = buildFieldMatchers(key);
    const allCandidateSet = new Set();
    matchers.forEach(m=>m.candidates.forEach(c=>{ if(c) allCandidateSet.add(c); }));

    // Fayl bir nechta varaq (list/sheet)dan iborat bo'lishi mumkin, shuningdek
    // kerakli ustunlar birinchi qatorda emas, pastroqda (sarlavha/sarlavha
    // qatoridan keyin) bo'lishi mumkin. Shu sababli barcha varaqlarning
    // dastlabki 20 qatorini tekshirib, forma maydonlariga ENG KO'P mos
    // keladigan varaq va qatorni avtomatik topamiz.
    let best = {sheetName:null, headerRow:0, score:-1};
    wb.SheetNames.forEach(sn=>{
      const ws = wb.Sheets[sn];
      let aoa = [];
      try{ aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false, blankrows:false}); }catch(e){ aoa = []; }
      const scanLimit = Math.min(aoa.length, 20);
      for(let r=0;r<scanLimit;r++){
        const rowCells = aoa[r] || [];
        let score = 0;
        rowCells.forEach(c=>{ if(allCandidateSet.has(normKey(c))) score++; });
        if(score > best.score){ best = {sheetName:sn, headerRow:r, score}; }
      }
    });

    if(!best.sheetName || best.score < 2){
      if(statusEl){
        statusEl.className='status err';
        statusEl.textContent = 'Faylda kerakli ustunlar topilmadi. Fayl bir nechta varaq (list)dan iborat bo‘lsa, ma’lumotlar joylashgan varaqda ustun sarlavhalari («'+FIELDS[key].filter(f=>f[0]!=='no').map(f=>f[1]).join('», «')+'») bilan mos bo‘lishi kerak.';
      }
      return;
    }

    const chosenSheet = wb.Sheets[best.sheetName];
    const rows = XLSX.utils.sheet_to_json(chosenSheet, {range:best.headerRow, defval:'', raw:false, dateNF:'yyyy-mm-dd'});
    if(!rows.length){
      if(statusEl){ statusEl.className='status err'; statusEl.textContent='Faylda ma’lumot topilmadi.'; }
      return;
    }
    let added = 0, skipped = 0;
    const missingFieldCounts = {};
    let firstFoundHeaders = null;
    const newRecords = [];
    rows.forEach(row=>{
      if(!firstFoundHeaders) firstFoundHeaders = Object.keys(row);
      const d = importRowToData(key, row, matchers);
      const missing = validate(key, d);
      if(missing.length){
        skipped++;
        missing.forEach(lbl=>{ missingFieldCounts[lbl] = (missingFieldCounts[lbl]||0) + 1; });
        return;
      }
      let kind = 'main';
      if(key==='bonus'){
        const rowNormMap = {};
        Object.keys(row).forEach(h=>{ rowNormMap[normKey(h)] = row[h]; });
        const turiVal = String(rowNormMap[normKey('Turi')] || rowNormMap[normKey('Kind')] || '').toLowerCase();
        kind = turiVal.indexOf('bekor') !== -1 ? 'cancel' : 'main';
      }
      newRecords.push({d, kind});
      added++;
    });

    if(added){
      // Yangi fayl import qilinganda shu bo'limdagi ESKI ma'lumotlar o'chirilib,
      // yangilari bilan almashtiriladi. "Bonus" bo'limida "Bonus shartnomasi" va
      // "Bonus bekor qilish" alohida ro'yxatlar hisoblanadi — faqat joriy sub-bo'lim
      // (bonusSubTab) ga tegishli yozuvlar o'chiriladi, ikkinchisiga tegilmaydi.
      const targetKind = key==='bonus' ? (bonusSubTab==='cancel' ? 'cancel' : 'main') : null;
      const toRemoveCount = key==='bonus'
        ? DB[key].filter(r=>r.kind===targetKind).length
        : DB[key].length;
      const confirmMsg = toRemoveCount
        ? `Diqqat: ushbu bo‘limdagi ${toRemoveCount} ta eski yozuv o‘chirilib, fayldan olingan ${added} ta yozuv bilan almashtiriladi. Davom etasizmi?`
        : `Fayldan ${added} ta yangi yozuv qo‘shiladi. Davom etasizmi?`;
      if(!confirm(confirmMsg)){
        if(statusEl){ statusEl.className='status'; statusEl.textContent='Import bekor qilindi — mavjud ma’lumotlar o‘zgartirilmadi.'; }
        return;
      }
      if(key==='bonus'){
        DB[key] = DB[key].filter(r=>r.kind!==targetKind);
      }else{
        DB[key] = [];
        // To'liq almashtirishda raqamlash (№) ham 1 dan qayta boshlanadi
        try{ localStorage.setItem(counterStorageKey(key), '0'); }catch(e){}
      }
      newRecords.forEach(rec=>{
        rec.d.no = nextSequenceNumber(key);
        DB[key].push({id:uid(), kind:rec.kind, data:rec.d, createdAt:new Date().toISOString()});
      });
    }
    persist(key);
    renderTabs();
    if(key==='hamkor'){ renderHamkorTable(); } else { renderHistory(key); }
    if(statusEl){
      statusEl.className = added ? 'status ok' : 'status err';
      let detail = '';
      const missingList = Object.keys(missingFieldCounts);
      if(missingList.length){
        detail += ' Fayldagi ustun sarlavhalari quyidagi majburiy maydonlarga mos kelmadi: «' + missingList.join('», «') + '».';
      }
      if(firstFoundHeaders && firstFoundHeaders.length){

      }
      detail += ' Ustun sarlavhalarini forma maydon nomlariga moslashtirib qaytadan urinib ko‘ring.';
      statusEl.textContent = added
        ? `${added} ta yozuv import qilindi (eski ma’lumotlar almashtirildi).` + (skipped ? ` (${skipped} ta qator majburiy maydonlar to‘liq bo‘lmagani uchun o‘tkazib yuborildi.)` : '')
        : `Hech qanday yozuv import qilinmadi — barcha qatorlarda majburiy maydonlar to‘liq emas (${skipped} ta qator o‘tkazib yuborildi).` + detail;
    }
  }catch(e){
    console.error(e);
    if(statusEl){ statusEl.className='status err'; statusEl.textContent='Import qilishda xatolik: '+(e && e.message ? e.message : e); }
  }

async function exportHamkorExcel(){
  if(typeof XLSX === 'undefined'){
    alert('Excel kutubxonasi yuklanmadi. Internet aloqasini tekshirib, sahifani qayta yuklang.');
    return;
  }
  if(!DB.hamkor.length){
    alert('Hozircha hamkorlar ro‘yxati bo‘sh — avval kamida bitta hamkor qo‘shing.');
    return;
  }
  const excelBtn = document.getElementById('hamkorExcelBtn');
  const originalLabel = excelBtn ? excelBtn.textContent : '';
  try{
    if(excelBtn){ excelBtn.disabled = true; excelBtn.textContent = 'Tayyorlanmoqda…'; }
    const rows = DB.hamkor.map((r)=>({
      '№': r.data.no||'',
      'Tashkilot nomi': r.data.tashkilot_nomi||'',
      'STIR': r.data.stir||'',
      'Brend nomi': r.data.brend||'',
      'Filial': r.data.filial||'',
      'Rahbar (lavozimi)': r.data.rahbar||'',
      'Rahbar F.I.Sh.': r.data.rahbar_fish||'',
      'PINFL': r.data.pinfl||'',
      'Manzil': r.data.manzil||'',
      'Hisob raqami': r.data.hisob_raqami||'',
      'Bank nomi': r.data.bank_nomi||'',
      'MFO': r.data.mfo||'',
      'Telefon raqami': r.data.telefon_raqami||'',
      'Telegram user / E-pochta': r.data.telegram_user||'',
      'Login': r.data.login||'',
      'Parol': r.data.parol||'',
      'Qo‘shilgan sana': new Date(r.createdAt).toLocaleString('uz-UZ')
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = Object.keys(rows[0]).map(k=>({wch: k==='Tashkilot nomi'||k==='Manzil' ? 28 : 16}));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Hamkorlar');
    const filename = 'Hamkorlar_royxati_'+todayISO()+'.xlsx';
    const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const blob = new Blob([wbout], {type:'application/octet-stream'});
    const savedToFolder = await saveBlobToFolder(blob, filename, 'hamkor');
    if(!savedToFolder){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 3000);
    }
  }catch(e){
    alert('Excel faylini yaratishda xatolik: '+(e && e.message ? e.message : e));
    console.error(e);
  }finally{
    if(excelBtn){ excelBtn.disabled = false; excelBtn.textContent = originalLabel; }
  }
}

// Foydalanuvchi Firebase konsolidan nusxalagan matnni turli ko'rinishlarda joylashtirishi mumkin:
// faqat { ... } JSON, yoki butun "const firebaseConfig = { ... };" bloki, izohlar bilan yoki izohsiz.
// Bu funksiya barcha holatlarni qabul qiladigan qilib matnni tozalaydi va obyektga aylantiradi.
function parseFirebaseConfigInput(raw){
  let s = String(raw);

  // 1) Ko'p qatorli va bir qatorli JS izohlarini olib tashlash (/* ... */ va // ...)
  s = s.replace(/\/\*[\s\S]*?\*\//g, '');
  s = s.replace(/(^|[^:])\/\/.*$/gm, '$1');

  // 2) Faqat birinchi "{" dan oxirgi "}" gacha bo'lgan qismni olish
  //    (const firebaseConfig = ... yoki oxiridagi ";" avtomatik chetlab o'tiladi)
  const start = s.indexOf('{');
  const end = s.lastIndexOf('}');
  if(start === -1 || end === -1 || end < start){
    throw new Error('firebaseConfig obyekti topilmadi');
  }
  s = s.slice(start, end + 1);

  // 3) Obyekt oxiridagi ortiqcha vergullarni olib tashlash: {a:1, b:2,} -> {a:1, b:2}
  s = s.replace(/,\s*([}\]])/g, '$1');

  // 4) Avval qat'iy JSON sifatida sinab ko'ramiz
  try{
    return JSON.parse(s);
  }catch(e){
    // 5) Agar kalitlar tirnoqsiz yoki bitta tirnoq bilan yozilgan bo'lsa
    //    (masalan apiKey: "...") — buni ham xavfsiz tarzda obyektga aylantiramiz.
    const obj = new Function('"use strict"; return (' + s + ');')();
    if(!obj || typeof obj !== 'object') throw new Error('Noto\u2018g\u2018ri format');
    return obj;
  }
}

}

function readForm(key){
  const d = {};
  FIELDS[key].forEach(f=>{ const el=document.getElementById('f_'+f[0]); if(el) d[f[0]] = el.value; });
  return d;
}
function writeForm(key,d){
  FIELDS[key].forEach(f=>{ const el=document.getElementById('f_'+f[0]); if(el) el.value = d[f[0]]||''; });
}
function validate(key,d){
  const missing = FIELDS[key].filter(f=>f[3]==='required' && !String(d[f[0]]||'').trim());
  return missing.map(f=>f[1]);
}

function docBuilder(key,d,kind){
  if(key==='hamkor') return hamkorHTML(d);
  if(key==='bosh') return boshHTML(d);

  if(key==='bonus') return kind==='cancel' ? bonusCancelHTML(d) : bonusHTML(d);
}

function labelFor(key,d,kind){
  if(key==='hamkor') return d.tashkilot_nomi || 'Nomsiz hamkor';

  if(key==='qoshimcha') return d.tashkilot_nomi || 'Nomsiz tashkilot';

// Joriy sessiyada har bir bo'lim uchun oxirgi shakllantirilgan hujjat yozuvining id'si —
// "Hujjat yaratish" (saqlash) va "PDF yuklab olish" (yuklab olish) endi ATAYLAB
// bir-biridan mustaqil ikkita amal: yaratish darhol PDF yuklamaydi, faqat ko'rinishni
// chizadi va bazaga saqlaydi; yuklab olish esa alohida tugma bosilgandagina ishga tushadi.
let lastGenerated = {};

async function generateAndSave(key,kind){
  const statusEl = document.getElementById('status_'+key);
  const submitBtn = document.querySelector('#form_'+key+' button[type=submit]');
  try{
    const d = readForm(key);
    const missing = validate(key,d);
    if(missing.length){
      statusEl.className='status err';
      statusEl.textContent = 'Quyidagi maydonlar to‘ldirilishi shart: '+missing.join(', ');
      return;
    }

    if(submitBtn) submitBtn.disabled = true;
    statusEl.className='status'; statusEl.textContent='Hujjat tayyorlanmoqda…';

    d.no = nextSequenceNumber(key);
    const previewEl = document.getElementById('preview_'+key);
    const docHtml = docBuilder(key,d,kind);
    previewEl.innerHTML = docHtml;

    const rec = {id:uid(), kind: kind||'main', data:d, createdAt:new Date().toISOString()};
    DB[key].push(rec);
    persist(key);
    renderTabs();
    renderHistory(key);
    lastGenerated[key] = rec.id;

    statusEl.className='status ok';
    statusEl.textContent = 'Hujjat (№'+d.no+') yaratildi va bazaga saqlandi. PDF fayl olish uchun «PDF yuklab olish» tugmasini bosing.';
  }catch(e){
    statusEl.className='status err';
    statusEl.textContent = 'Xatolik yuz berdi: '+(e && e.message ? e.message : e);
    console.error(e);
  }finally{
    if(submitBtn) submitBtn.disabled = false;
  }
}

// Yuklab olish tugmasi bosilganda mos yozuv topiladi: avval joriy seansda
// yaratilgan hujjat, bo'lmasa bazadagi oxirgi saqlangan hujjat, ular ham
// bo'lmasa — joriy forma ma'lumotlari asosida (validatsiyadan o'tkazib)
// yangi hujjat yaratiladi va o'sha yozuv qaytariladi. Shu tufayli forma
// to'ldirilib darhol «PDF/Word yuklab olish» bosilsa ham ishlaydi.
async function ensureRecordForDownload(key){
  const recId = lastGenerated[key];
  let rec = recId ? DB[key].find(r=>r.id===recId) : null;
  if(rec) return rec;
  if(DB[key] && DB[key].length) return DB[key][DB[key].length-1];
  await generateAndSave(key, key==='bonus'?bonusSubTab:undefined);
  const newRecId = lastGenerated[key];
  return newRecId ? DB[key].find(r=>r.id===newRecId) : null;
}

function insertPageBreakSpacers(paper, pageHeightMm){
  const pxPerMm = paper.offsetWidth / 210;
  const pageHeightPx = pxPerMm * (pageHeightMm || 297);
  const paperTop = paper.getBoundingClientRect().top;
  const avoidEls = paper.querySelectorAll('h3, h4, p, li, table, tr, .sig, .addendum');
  avoidEls.forEach(el=>{
    const rect = el.getBoundingClientRect();
    const top = rect.top - paperTop;
    const bottom = rect.bottom - paperTop;
    const elHeight = bottom - top;
    if(elHeight >= pageHeightPx) return; // o'zi bir sahifadan katta — bo'lishning iloji yo'q
    const pageEnd = (Math.floor(top / pageHeightPx) + 1) * pageHeightPx;
    if(bottom > pageEnd){
      const spacer = document.createElement('div');
      spacer.style.height = (pageEnd - top) + 'px';
      el.parentNode.insertBefore(spacer, el);
    }
  });
}

async function exportPdf(html, filename, sectionKey){
  // Kesilib qolmasligi uchun PDF sahifaning ko'rinadigan (scroll qilinadigan)
  // oynasidan emas, ekrandan tashqarida joylashgan alohida "toza" nusxadan olinadi.
  const holder = document.createElement('div');
  holder.className = 'pdf-offscreen';
  // Shartnoma PDF ko'rinishida chiqqanda shrift majburiy ravishda Times New
  // Roman, razmeri 12 bo'lishi kerak — buni ekrandagi (kichikroq) ko'rinishdan
  // mustaqil ravishda, faqat eksport nusxasiga qo'llaymiz.
  const styleTag = document.createElement('style');
  styleTag.textContent = `
    .pdf-export-font, .pdf-export-font *{ font-family:'Times New Roman', Times, serif !important; font-size:12pt !important; line-height:1.42 !important; }
    .pdf-export-font h3{ font-size:13pt !important; font-weight:700 !important; }
    .pdf-export-font h4{ font-size:12pt !important; font-weight:700 !important; }
    .pdf-export-font b, .pdf-export-font strong{ font-weight:700 !important; }
  `;
  holder.appendChild(styleTag);
  const paper = document.createElement('div');
  paper.className = 'paper pdf-export-font';
  paper.style.width = '210mm';
  paper.innerHTML = html;
  holder.appendChild(paper);
  document.body.appendChild(holder);
  try{
    await new Promise(r=>setTimeout(r,60));

    const pageWidth = 210, pageHeight = 297;
    // Har bir PDF sahifasining tepa va past qismida bo'sh joy (margin) qoldirish uchun.
    // Eski usulda faqat hujjatning eng boshi va oxirida bo'sh joy bo'lib, ikkinchi va
    // undan keyingi sahifalarning tepa/past chetiga matn tegib turardi — shuning uchun
    // rasm sahifalarga yaxlit emas, balki har biri alohida "bo'lak" (slice) sifatida,
    // tepasida va pastida margin bilan qo'shiladi.
    const topMarginMm = 12, bottomMarginMm = 12;
    const usableHeightMm = pageHeight - topMarginMm - bottomMarginMm;

    // Sarlavha, xatboshi, jadval va qatorlar sahifa chegarasida ikkiga bo'linib
    // "kesilib" yoki yarim ko'rinib qolmasligi uchun — ular joylashadigan joyda
    // kerakli bo'sh joy (spacer) qo'shib, elementni keyingi sahifaga o'tkazamiz.
    // Bu yerda aynan yuqoridagi usableHeightMm (chekka joylar ayirilgan haqiqiy
    // sahifa balandligi) bo'yicha hisoblanadi, aks holda spacer joylari PDF dagi
    // haqiqiy sahifa chegaralariga to'g'ri kelmay qolardi.
    insertPageBreakSpacers(paper, usableHeightMm);

    const canvas = await html2canvas(paper, {
      scale:2, backgroundColor:'#ffffff', useCORS:true,
      windowWidth: paper.scrollWidth, windowHeight: paper.scrollHeight
    });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const imgWidth = pageWidth;
    const pxPerMm = canvas.width / imgWidth;
    const usableHeightPx = Math.max(1, Math.round(usableHeightMm * pxPerMm));
    let renderedPx = 0;
    let firstPage = true;
    while(renderedPx < canvas.height){
      const sliceHeightPx = Math.min(usableHeightPx, canvas.height - renderedPx);
      const sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = canvas.width;
      sliceCanvas.height = sliceHeightPx;
      const sctx = sliceCanvas.getContext('2d');
      sctx.fillStyle = '#ffffff';
      sctx.fillRect(0,0,sliceCanvas.width, sliceCanvas.height);
      sctx.drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
      const sliceImgData = sliceCanvas.toDataURL('image/png');
      const sliceHeightMm = sliceHeightPx / pxPerMm;
      if(!firstPage) pdf.addPage();
      pdf.addImage(sliceImgData,'PNG',0,topMarginMm,imgWidth,sliceHeightMm);
      renderedPx += sliceHeightPx;
      firstPage = false;
    }
    const savedToFolder = await saveBlobToFolder(pdf.output('blob'), filename, sectionKey);
    if(!savedToFolder) pdf.save(filename);
  }finally{
    document.body.removeChild(holder);
  }
}

async function exportWord(html, filename, sectionKey){
  const wordHtml = buildWordDocument(html, filename);
  const blob = new Blob(['\ufeff', wordHtml], {type:'application/msword'});
  const savedToFolder = await saveBlobToFolder(blob, filename, sectionKey);
  if(!savedToFolder){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }
}

/* ============================= KOMPYUTERDAGI PAPKAGA (masalan, D: DISKKA) SAQLASH ============================= */
// File System Access API orqali foydalanuvchi bir marta papka (masalan, D: diskdagi
// papka) tanlaydi, shu papka manzili brauzerda (IndexedDB) eslab qolinadi va shundan
// keyin barcha yaratilgan shartnoma PDF fayllari avtomatik ravishda o'sha papkaga
// yozib boriladi. Bu funksiya faqat Chrome/Edge kabi Chromium brauzerlarida ishlaydi;
// qo'llab-quvvatlanmasa, tizim odatdagidek brauzer orqali yuklab olishga o'tadi.
const FS_DB_NAME = 'birzum_fs_handles';
const FS_STORE = 'handles';
const FS_KEY = 'save_dir';
let savedDirHandle = null;

function openHandleDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB yo‘q')); return; }
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(FS_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSetHandle(handle){
  try{
    const db = await openHandleDB();
    await new Promise((res,rej)=>{
      const tx = db.transaction(FS_STORE,'readwrite');
      tx.objectStore(FS_STORE).put(handle, FS_KEY);
      tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){ console.error('Papka manzilini saqlab bo‘lmadi', e); }
}
async function idbGetHandle(){
  try{
    const db = await openHandleDB();
    return await new Promise((res,rej)=>{
      const tx = db.transaction(FS_STORE,'readonly');
      const req = tx.objectStore(FS_STORE).get(FS_KEY);
      req.onsuccess = ()=>res(req.result || null);
      req.onerror = ()=>rej(req.error);
    });
  }catch(e){ return null; }
}
async function idbClearHandle(){
  try{
    const db = await openHandleDB();
    await new Promise((res,rej)=>{
      const tx = db.transaction(FS_STORE,'readwrite');
      tx.objectStore(FS_STORE).delete(FS_KEY);
      tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){}
}
async function verifyFolderPermission(handle, requestIfNeeded){
  if(!handle) return false;
  const opts = {mode:'readwrite'};
  try{
    if((await handle.queryPermission(opts)) === 'granted') return true;
    if(requestIfNeeded && (await handle.requestPermission(opts)) === 'granted') return true;
  }catch(e){}
  return false;
}
async function initSaveFolder(){
  try{ savedDirHandle = await idbGetHandle(); }catch(e){ savedDirHandle = null; }
}
async function chooseSaveFolder(){
  if(!window.showDirectoryPicker){

}
// Ba'zi brauzerlarda (masalan kompyuter/brauzer qayta ishga tushirilgandan keyin)
// avval tanlangan papkaga yozish ruxsati "ünutilishi" mumkin — bunday holatda
// avtomatik zaxiralash sukut bo'yicha (foydalanuvchi bosishisiz) qayta ruxsat
// so'ray olmaydi va HECH QANDAY OGOHLANTIRISHSIZ saqlamay qo'yishi mumkin edi.
// Shu sababli ilova ochilganda ruxsat holati tekshiriladi va zarur bo'lsa
// foydalanuvchiga ruxsatni bitta tugma bosish orqali qayta tasdiqlash imkoni
// ko'rsatiladi — shu orqali har bir bo‘limning o‘z papkasiga saqlanishi
// barqaror ishlaydi.
async function updateFolderStatusUI(){
  const el = document.getElementById('folderStatus');
  if(!el) return;
  if(!savedDirHandle){
    el.textContent = 'Hozircha papka tanlanmagan — PDF fayllar brauzerning standart «Yuklab olingan fayllar» papkasiga saqlanadi.';
    return;
  }
  let granted = false;
  try{ granted = (await savedDirHandle.queryPermission({mode:'readwrite'})) === 'granted'; }catch(e){ granted = false; }
  if(granted){
    el.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ Tanlangan papka: «'+esc(savedDirHandle.name)+'»</span> — har bir bo‘lim (Hamkorlar, Bosh kelishuv, Qo‘shimcha kelishuv, Bonus) uchun shu papka ichida avtomatik alohida ichki papka yaratiladi va shu bo‘limga tegishli barcha fayllar (PDF, Word, zaxira) faqat o‘sha ichki papkaga saqlanadi.';
  }else{
    el.innerHTML = '<span style="color:var(--danger);font-weight:700;">⚠ «'+esc(savedDirHandle.name)+'» papkasiga yozish ruxsati qayta tasdiqlanishi kerak</span> (odatda brauzer qayta ochilgandan keyin yuz beradi) — aks holda bo‘limlar o‘z papkasiga avtomatik saqlanmaydi. <button type="button" class="secondary" id="reconfirmFolderBtn" style="margin-left:6px;">Ruxsatni qayta tasdiqlash</button>';
    const btn = document.getElementById('reconfirmFolderBtn');
    if(btn) btn.onclick = async ()=>{
      const ok = await verifyFolderPermission(savedDirHandle, true);
      if(!ok) alert('Ruxsat berilmadi — papkani qaytadan tanlashga to‘g‘ri kelishi mumkin.');
      updateFolderStatusUI();
    };
  }
}
// PDF/Word/Excel/zaxira fayllar endi tanlangan papka ICHIDA, bo'lim nomi bilan
// avtomatik yaratiladigan ALOHIDA ICHKI PAPKAGA yoziladi (masalan, "D:\BirZum\
// Bosh kelishuv\..."), umumiy papkaga aralashtirilmaydi.
const SECTION_FOLDER_NAME = {
  hamkor: 'Hamkorlar',
  bosh: 'Bosh kelishuv',
  qoshimcha: 'Qoshimcha kelishuv',
  bonus: 'Bonus'
};
async function getSectionDirHandle(sectionKey){
  if(!savedDirHandle || !sectionKey) return savedDirHandle || null;
  try{
    const name = SECTION_FOLDER_NAME[sectionKey] || sectionKey;
    return await savedDirHandle.getDirectoryHandle(name, {create:true});
  }catch(e){
    console.error('Bo‘lim papkasini yaratishda xatolik', e);
    return savedDirHandle;
  }
}
// PDF/Word/Excel/JSON blobni tanlangan papkaning tegishli bo'lim-ichki-papkasiga
// yozishga urinadi. sectionKey berilmasa, to'g'ridan-to'g'ri asosiy papkaga yozadi.
// Muvaffaqiyatli bo'lsa true qaytaradi.
async function saveBlobToFolder(blob, filename, sectionKey){
  if(!savedDirHandle) return false;
  try{
    const ok = await verifyFolderPermission(savedDirHandle, true);
    if(!ok) return false;
    const dirHandle = await getSectionDirHandle(sectionKey);
    if(!dirHandle) return false;
    const fileHandle = await dirHandle.getFileHandle(filename, {create:true});
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    return true;
  }catch(e){
    console.error('Papkaga saqlashda xatolik', e);
    return false;
  }
}

function renderHistory(key){
  const host = document.getElementById('hist_'+key);
  if(!host) return;
  const searchEl = document.getElementById('histSearch_'+key);
  const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
  let list = DB[key].slice().reverse();
  if(q){
    list = list.filter(r=>{
      const stirVal = String((r.data && r.data.stir) || '').toLowerCase();
      const nameVal = String((r.data && r.data.tashkilot_nomi) || '').toLowerCase();
      return stirVal.includes(q) || nameVal.includes(q);
    });
  }
  if(!list.length){
    host.innerHTML = q
      ? '<div class="empty-hist">«'+esc(searchEl.value)+'» bo‘yicha hech qanday hujjat topilmadi.</div>'
      : '<div class="empty-hist">Hozircha saqlangan hujjatlar yo‘q.</div>';
    return;
  }
  host.innerHTML = `
    <table class="history">
      <tr><th>Tashkilot</th><th>STIR</th><th>Sana</th>${key==='bonus'?'<th>Turi</th>':''}<th></th></tr>
      ${list.map(r=>`
        <tr>
          <td>${esc(labelFor(key,r.data,r.kind))}</td>
          <td>${esc((r.data && r.data.stir) ? r.data.stir : '—')}</td>
          <td>${esc(new Date(r.createdAt).toLocaleString('uz-UZ'))}</td>
          ${key==='bonus'?`<td><span class="badge ${r.kind==='cancel'?'cancel':'bonus'}">${r.kind==='cancel'?'Bekor qilish':'Bonus'}</span></td>`:''}
          <td>
            <button class="link-btn" data-act="dl" data-id="${r.id}">PDF yuklab olish</button>
            <button class="link-btn" data-act="dlword" data-id="${r.id}">Word yuklab olish</button>
            <button class="link-btn" data-act="edit" data-id="${r.id}">Formaga qaytarish</button>
            <button class="link-btn del" data-act="del" data-id="${r.id}">O‘chirish</button>
          </td>
        </tr>`).join('')}
    </table>`;

  host.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = async ()=>{
      const rec = DB[key].find(r=>r.id===btn.dataset.id);
      if(!rec) return;
      if(btn.dataset.act==='dl'){
        const originalLabel = btn.textContent;
        try{
          btn.disabled = true; btn.textContent = 'Tayyorlanmoqda…';
          const previewEl = document.getElementById('preview_'+key);
          const docHtml = docBuilder(key,rec.data,rec.kind);
          previewEl.innerHTML = docHtml;
          await new Promise(r=>setTimeout(r,50));
          await exportPdf(docHtml, fileNameFor(key,rec.data,rec.kind), key);
        }catch(e){
          alert('PDF yaratishda xatolik: '+(e && e.message ? e.message : e));
          console.error(e);
        }finally{
          btn.disabled = false; btn.textContent = originalLabel;
        }
      }else if(btn.dataset.act==='dlword'){
        const originalLabel = btn.textContent;
        try{
          btn.disabled = true; btn.textContent = 'Tayyorlanmoqda…';
          const docHtml = docBuilder(key,rec.data,rec.kind);
          await exportWord(docHtml, fileNameFor(key,rec.data,rec.kind,'doc'), key);
        }catch(e){
          alert('Word fayl yaratishda xatolik: '+(e && e.message ? e.message : e));
          console.error(e);
        }finally{
          btn.disabled = false; btn.textContent = originalLabel;
        }
      }else if(btn.dataset.act==='edit'){
        writeForm(key, rec.data);
        if(key==='bonus'){ bonusSubTab = rec.kind==='cancel'?'cancel':'bonus'; renderApp(); writeForm(key, rec.data); }
        const previewEl = document.getElementById('preview_'+key);
        previewEl.innerHTML = docBuilder(key,rec.data,rec.kind);
      }else if(btn.dataset.act==='del'){
        if(confirm('Ushbu hujjatni bazadan o‘chirishni tasdiqlaysizmi?')){
          DB[key] = DB[key].filter(r=>r.id!==rec.id);
          persist(key);
          renderTabs();
          renderHistory(key);
        }
      }
    };
  });
}

function bindSectionEvents(key){
  if(key === 'profil'){
    bindProfilEvents();
    return;
  }
  if(key === 'hamkor'){
    bindHamkorEvents();
    return;
  }
  const form = document.getElementById('form_'+key);
  if(form){
    form.onsubmit = (e)=>{
      e.preventDefault();
      generateAndSave(key, key==='bonus'?bonusSubTab:undefined);
    };
  }
  const clearBtn = document.getElementById('clear_'+key);
  if(clearBtn){
    clearBtn.onclick = ()=>{
      form.reset();
      document.getElementById('preview_'+key).innerHTML = '<div class="empty-preview">Formani to‘ldirib «Shartnoma yaratish» tugmasini bosing.</div>';
      document.getElementById('status_'+key).textContent = '';
    };
  }
  const dlBtn = document.getElementById('dl_'+key);
  if(dlBtn){ dlBtn.onclick = ()=> downloadGeneratedPdf(key); }
  const dlWordBtn = document.getElementById('dlword_'+key);
  if(dlWordBtn){ dlWordBtn.onclick = ()=> downloadGeneratedWord(key); }
  // Excel/CSV fayldan import qilish tugmasi — barcha bo'limlarda (bosh, qoshimcha,
  // bonus) ishlashi uchun tugma bosilganda fayl tanlash oynasi ochilishi kerak.
  bindImportButton(key);
  if(key==='bonus'){
    document.querySelectorAll('.subtab').forEach(st=>{
      st.onclick = ()=>{
        const d = readForm('bonus');
        bonusSubTab = st.dataset.sub;
        renderApp();
        writeForm('bonus', d);
      };
    });
  }
  // STIR bo'yicha "Tortib olish" tugmasi — Bosh kelishuvda kiritilgan STIR
  // asosida shu bo'lim formasini avtomatik to'ldiradi.
  if(key==='bosh' || key==='qoshimcha' || key==='bonus'){
    const stirBtn = document.getElementById('stirfill_'+key);
    if(stirBtn){
      stirBtn.onclick = ()=> autofillFromBosh(key);
    }
  }
  // Saqlangan hujjatlar ro'yxatini STIR yoki tashkilot nomi bo'yicha qidirish —
  // teriladigan har bir harfda ro'yxat jonli (live) filtrlanadi.
  const histSearchEl = document.getElementById('histSearch_'+key);
  if(histSearchEl){
    histSearchEl.oninput = ()=> renderHistory(key);
  }
  renderHistory(key);
}

/* ============================= INIT ============================= */
// Ilova login tasdiqlangandan keyin (yoki oldin autentifikatsiya
// mavjud bo'lsa darhol) ishga tushadi.
if(isAuthed()){ showApp(); } else { showLogin(); }
</script>
