span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">to‘g‘risida<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">ushbu<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">shartnomani<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">tuzdilar.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:0pt;padding-right:0.2pt;text-indent:0pt;text-align:left;padding-top:0.85pt;line-height:0;font-size:0\" data-tabs=\"25\"><span style=\"font-size:10pt;line-height:11.55pt\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:39.8pt;padding-right:0.2pt;text-indent:0pt;text-align:center;padding-top:0.85pt;line-height:0;font-size:0\" data-tabs=\"25\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">ATAMALAR VA TA’RIFLAR<\/span><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:36pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">Mazkur Shartnomada quyidagi atamalar va ularning ta’riflari qo‘llaniladi:<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:36pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">«BIRZUM NASIYA» muddatli to‘lov tizimi<\/span><span style=\"font-size:10pt;line-height:11.55pt\"> – mutloq mulk huquqi «FORTUNA BIZNES mikromoliya tashkiloti» MChJga tegishli bo‘lgan dasturiy mahsulot bo‘lib, Kreditor, SXKK va ularning mijozlari o‘rtasidagi o‘zaro hamkorlikni ta’minlash, shuningdek Kreditor tomonidan mikromoliyaviy xizmatlar ko‘rsatishda foydalanish uchun mo‘ljallangan va internet tarmog‘idagi quyidagi manzil asosida faoliyat yuritadi: <\/span><span class=\"wlink\"><span style=\"font-size:10pt;line-height:11.55pt\">https://merchant.birzumnasiya.uz<\/span><\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:36pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">Mijoz (kredit oluvchi)<\/span><span style=\"font-size:10pt;line-height:11.55pt\"> – \"Mijoz (kredit oluvchi) – O‘zbekiston Respublikasi rezidenti bo‘lgan, Kreditor tomonidan mikromoliyaviy xizmat ko‘rsatiladigan jismoniy shaxs;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:36pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">Mikromoliyaviy xizmat<\/span><span style=\"font-size:10pt;line-height:11.55pt\"> – O‘zbekiston Respublikasi qonunchiligiga muvofiq Kreditor tomonidan Mijozga ko‘rsatiladigan xizmat bo‘lib, jumladan mikroqarzlar va kreditlar berishni o‘z ichiga oladi;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:36pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">Kredit<\/span><span style=\"font-size:10pt;line-height:11.55pt\"> – SXKK dan tovarlar (ishlar, xizmatlar) sotib olish uchun Kreditor tomonidan Mijozga yoki SXKKga qaytarishlilik, to‘lovlilik shartlari asosida taqdim etiladigan pul mablag‘lari;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:36pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">Hisobot oyi (davri)<\/span><span style=\"font-size:10pt;line-height:11.55pt\"> – Shartnomaga muvofiq xizmatlar ko‘rsatilgan kalendar oy;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:36pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">Kreditor xodimi<\/span><span style=\"font-size:10pt;line-height:11.55pt\"> – Kreditor bilan mehnat munosabatlarida bo‘lgan va ariza beruvchilardan mikromoliyaviy xizmat ko‘rsatish masalasini ko‘rib chiqish uchun zarur hujjatlar va ma’lumotlarni qabul qilish, Kreditorning moliyaviy faoliyati bo‘yicha tushuntirish berish, SXKK mijozlariga maslahat berish hamda ularga xizmatlardan oqilona foydalanish bo‘yicha amaliy yordam ko‘rsatishga vakolatli shaxs;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:36pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">SXKK xodimi<\/span><span style=\"font-size:10pt;line-height:11.55pt\"> – SXKK bilan mehnat munosabatlarida bo‘lgan, bu holat uning shartnomada nazarda tutilgan vazifalarni bajarishga ruxsati mavjudligi bilan tasdiqlanadigan va SXKK tomonidan tegishli buyruq yoki boshqa hujjat asosida vakolat berilgan shaxs bo‘lib, ariza beruvchilardan hujjatlar va ma’lumotlarni qabul qilish, ularga mikroqarz/kredit berish va undan foydalanish shartlari bo‘yicha axborot va maslahatlar berish, shuningdek SXKK hududida barcha zarur hujjatlarni rasmiylashtirish huquqiga ega;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:36pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">Kelishilgan aloqa kanallari<\/span><span style=\"font-size:10pt;line-height:11.55pt\"> – Kreditor va SXKK ning elektron pochta manzillari, shuningdek ushbu shartnomaga muvofiq hujjatlar va bildirishnomalar almashinuvi amalga oshiriladigan boshqa texnik aloqa vositalari;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:36pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">Tovar<\/span><span style=\"font-size:10pt;line-height:11.55pt\"> – SXKK savdo obyektlarida Mijoz tomonidan sotib olinadigan tovarlar/xizmatlar bo‘lib, O‘zbekiston Respublikasi qonunchiligi talablariga muvofiq ruxsat etilmagan tovarlar bundan mustasno;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:36pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">Mazkur bo’limda ko‘rsatilmagan atamalar ushbu shartnoma matnida O‘zbekiston Respublikasi qonunchiligiga muvofiq ma’nolarda qo‘llaniladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:0pt;padding-right:0.2pt;text-indent:0pt;text-align:left;padding-top:0.05pt;line-height:0;font-size:0\" data-tabs=\"25\"><span style=\"font-size:10pt;line-height:11.55pt\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:0pt;padding-right:0.2pt;text-indent:0pt;text-align:center;line-height:11.3pt;font-size:10pt\" data-tabs=\"284\"><span style=\"font-size:10pt;font-weight:bold\">1.<\/span><span class=\"wt\" style=\"font-size:10pt;font-weight:bold\"><\/span><span style=\"font-size:10pt;font-weight:bold\">SHARTNOMA PREDMETI<\/span><span style=\"font-size:10pt;font-weight:bold;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:17.45pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">1.1. Mazkur<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">shartnoma<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">doirasida<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">SXKK<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Kreditorga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">«BIRZUM<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">NASIYA<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">muddatli<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">to‘lov<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">tizimi»<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">orqali<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">SXKK<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">va<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">uning<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Mijozlariga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">quyidagi<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">axborot<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">va<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">konsultatsiya<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">xizmatlari<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">majmuasini<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">tashkil<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">etishni<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">topshiradi, jumladan:<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">SXKK ni «BIRZUM NASIYA muddatli to‘lov tizimi» doirasida Kreditor hamkorlari tarkibiga kiritish; <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">SXKK Mijozlari tomonidan Kreditordan mikromoliyaviy xizmatlar olish, shu jumladan «BIRZUM NASIYA» muddatli to‘lov tizimi mahsuloti doirasida; <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Mijozlarga mikromoliyalashtirish masalalari bo‘yicha maslahat berish; <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Mijozlar tomonidan olingan mikroqarzlar/kreditlar, shuningdek ularning o‘z mablag‘larini SXKK tomonidan sotiladigan tovarlar uchun to‘lovga «BIRZUM NASIYA muddatli to‘lov tizimi» orqali yo‘naltirish; <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Mijozlar tomonidan Kreditordan olingan mikroqarzlar/kreditlarni qaytarish; <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:17.45pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">1.2. Tomonlar «BIRZUM NASIYA muddatli to‘lov tizimi» mahsuloti doirasida mikroqarzlar va kreditlarni Mijozlarga quyidagi shartlarda taqdim etilishini kelishib oldilar:<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:36pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"720\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">mikroqarz/kredit muddati – 3, 6, 9, 12, 18 va 24 oy; <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:36pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"720\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">mikroqarz/kreditlar SXKK savdo obyektlarida Kreditor tomonidan taqdim etiladigan mikrozaym/kredit hisobidan to‘liq yoki qisman to‘lovni amalga oshirish orqali, «BIRZUM NASIYA muddatli to‘lov tizimi» vositasida foydalaniladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:0pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:0pt;padding-right:0.2pt;text-indent:0pt;text-align:center;line-height:13.25pt;font-size:10pt\" data-tabs=\"284\"><span style=\"font-size:10pt;font-weight:bold\">2.<\/span><span class=\"wt\" style=\"font-size:10pt;font-weight:bold\"><\/span><span style=\"font-size:10pt;font-weight:bold\">SHARTNOMANI IJRO ETISHNING UMUMIY TARTIBI<\/span><span style=\"font-size:10pt;font-weight:bold;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">2.1.Mazkur shartnoma Tomonlar tomonidan imzolangan vaqtdan boshlab tuzilgan hisoblanadi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">2.2.Tomonlar shartnomani yuritish uchun mas’ul shaxslarni belgilaydilar va kelishilgan aloqa kanallari orqali ularning ma’lumotlarini (F.I.Sh., lavozimi, telefon raqami, elektron pochta manzili) shartnoma tuzilganidan keyin kechiktirmay 5 (besh) ish kuni ichida bir-biriga taqdim etadilar, shuningdek, Tomonlar o‘rtasida hamkorlik uchun zarur bo‘lgan boshqa ma’lumotlarni ham yuboradilar.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">2.3. Tomonlar shartnoma imzolanganidan keyin 5 (besh) ish kuni ichida o‘zaro hamkorlik bo‘yicha ma’lumotlarni bir-biriga taqdim etadilar.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:21.3pt;padding-right:0pt;text-indent:0pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">2.4. Tomonlar quyidagilar bilan kelishadilar:<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">2.4.1. Shartnomada ko‘rsatilgan elektron pochta manzillariga yuborilgan barcha yozishmalar, bildirishnomalar va ogohlantirishlar, shu jumladan Tomonlar rekvizitlarini o‘zgartirishga oid ma’lumotlar, manzil egasiga to‘g‘ri yetkazilgan hisoblanadi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">2.5. Tomonlar o‘z elektron pochta manzillari va/ yoki boshqa kelishilgan aloqa kanallariga kelayotgan yozishmalarni o‘z vaqtida (kunda kamida bir marta) tekshirish majburiyatini oladilar.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">2.6. Agar SXKK xodimi ishdan bo‘shatilsa yoki shartnomada nazarda tutilgan vazifalardan, hamda Buyruqda ko‘rsatilgan vakolatlardan chetlashtirilsa, SXKK ushbu Buyruqni bekor qilishi va Kreditorni ushbu holat haqida Buyruq amal qilgan kunidan kechiktirmay kelishilgan aloqa kanallari orqali xabardor qilishi lozim, Buyruq raqami va sanasini ko‘rsatgan holda.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">2.7. Kreditor Mijozga mikroqarz/kredit berishni rad etishga haqli bo‘lib, buni Mijoz va SXKK ga izoh berish shart emas.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:left;line-height:0;font-size:0\" data-tabs=\"\"><span style=\"font-size:10pt;line-height:11.55pt\">2.8<\/span><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Mazkur shartnoma doirasida agar SXKK yuzaga kelgan qarzdorliklarni o‘z vaqtida kreditorga o‘tkazib bermagan xollarda kreditor SXKKning oldin amalga oshirilgan lekin kreditor tomonidan xali SXKK xisob raqamiga o‘tkazib berilmagan mablag‘lar xisobidan ushlab qolishga xaqli. Bu mablag‘lar: Kreditorning mukofoti va/ yoki tovarni qaytarish, rad etish holatida mablag‘lar (Shartnoma 2.10-bandiga muvofiq), shuningdek mazkur shartnoma doirasida SXKK oldidagi boshqa qarzdorliklarni <\/span><br><span style=\"font-size:10pt;line-height:11.55pt\">o‘z ichiga oladi.<\/span><span style=\"font-size:12pt;line-height:13.8pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">2.9. Tovar qaytarilganda yoki mijoz undan voz kechganda, SXKK Kreditordan haqiqatda kelib tushgan mablagʻni Mijozning mikroqarzini yopish uchun Kreditorning hisob raqamiga qaytaradi. Tovarni qaytarish Oʻzbekiston Respublikasi qonunchiligiga muvofiq amalga oshiriladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">2.10. Tovar qaytarilganda, SXKK oʻzi olgan mablagʻni hamda Kreditor ushlab qolgan komissiya summasining 5% (besh foizi) miqdoridagi konsalting xizmati haqini Kreditorning hisob raqamiga oʻtkazadi. Kreditor ilgari olingan komissiyani 100% miqdorda daromaddan qaytarish orqali Mijozning kreditini toʻliq yopishni taʼminlaydi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">2.11. Kreditor tovar/xizmat Mijozga mikroqarz/kredit hisobidan sotilganligi haqidagi ma’lumotni so‘rashi mumkin, va SXKK ushbu ma’lumotni 3 (uch) kalendar kun ichida taqdim etishga majburdir.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp :10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">amalga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">oshiriladi<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">va<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">bu<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Kreditorga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">mukofot<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">summasini<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Mijoz<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">tomonidan<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">SXKK<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">foydasiga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">yuboriladigan<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">mikroqarz/kredit<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">mablag‘laridan<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">ushlab<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">qolish<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">orqali<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">amalga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">oshiriladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">3.3. Kreditor har oy SXKK ga elektron shaklda xizmat ko‘rsatish akti va hisob-faktura taqdim etadi. SXKK ushbu aktni olgan kundan boshlab 3 (uch) ish kuni ichida imzolashi, muhr bilan tasdiqlashi va kelishilgan aloqa kanali orqali Kreditorga jo‘natishi shart. Agar SXKK aktdagi ma’lumotlarga rozi bo‘lmasa, u aktni kelishilgan aloqa kanali orqali asosli e’tirozlar bilan qaytarishi lozim shu muddat ichida. Belgilangan muddatda asosli e’tiroz yubormaslik SXKK ning akt va mukofot miqdoriga roziligi sifatida qabul qilinadi. Xizmatlar SXKK tomonidan imzolangan akt kelgan kuni ko‘rsatilgan va qabul qilingan hisoblanadi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">3.4. Agar hisob-kitob sanasi bankning dam olish kuni (shanba, yakshanba) yoki bayram kuni (O‘zbekiston Respublikasi qonunlariga muvofiq belgilangan davlat bayramlari va dam olish kunlari) ga to‘g‘ri kelsa, hisob-kitob sanasi ushbu dam olish/bayram kunidan keyingi birinchi ish kuniga ko‘chiriladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">3.5. Kreditorga mablag‘larni o‘tkazish bo‘yicha barcha xarajatlar, jumladan banklararo komissiyalar, SXKK zimmasiga yuklatiladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">3.6. To‘lov amalga oshirilgan sana sifatida mablag‘larning Kreditor hisob-raqamiga tushgan sanasi qabul qilinadi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">3.7. Tomonlar kelishuvoga koʻra yuborilgan hisob-faktura uchun alohida haq (toʻlov) talab etilmaydi. Mazkur hisob-faktura faqat shartnoma doirasida yuzaga kelgan qarzdorlikni qoplash (yopish) maqsadida rasmiylashtiriladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">3.8 Kreditor ajratilgan mikroqarz/kredit summasidan o‘ziga tegishli bo‘lgan mukofot (komissiya) summasini ushlab qolgan holda, qolgan mablag‘ni «BIRZUM NASIYA» tizimida Mikroqarz/Kredit muvaffaqiyatli tasdiqlangan kundan boshlab 5 (besh) bank ish kuni ichida SXKKning hisob-raqamiga o‘tkazib beradi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:4.35pt;padding-right:0.2pt;text-indent:0pt;text-align:right;line-height:0;font-size:0\" data-tabs=\"25\"><span style=\"font-size:10pt;line-height:11.55pt\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:0pt;padding-right:0.2pt;text-indent:21.3pt;text-align:center;padding-top:3.65pt;line-height:0;font-size:0\" data-tabs=\"25\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">4.<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\"><\/span><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">MA’LUMOTNI MAXFIYLIGI<\/span><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">4.1.<\/span><span style=\"font-size:12pt;line-height:13.8pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Tomonlar<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">shartnoma<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">ijrosi<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">davomida<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">olingan<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">ma’lumotlarni<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">qat’iy<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">maxfiy<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">saqlashga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">va<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">ushbu<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">ma’lumotlarning<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">oshkor<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">etilmasligi<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">uchun<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">barcha<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">mumkin<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">bo‘lgan<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">choralarni<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">ko‘rishga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">majburdirlar.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">4.2. SXKK quyidagilarni bajarishga majbur:<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:42.55pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"851\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Shartnoma ijrosi davomida Kreditor va Mijozlardan olingan, Tomonlar tomonidan tijorat siri deb tan olingan barcha ma’lumotlarni, shuningdek, Shartnoma muddati tugagandan yoki erta bekor qilinganidan keyin 5 (besh) yil davomida maxfiy saqlash; <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:42.55pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"851\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Shaxsga doir ma’lumotlarni O‘zbekiston Respublikasi qonunchiligiga muvofiq saqlash; <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:42.55pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"851\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Tijorat siri va shaxsga doir ma’lumotlarni O‘zbekiston Respublikasi qonunchiligida belgilangan hollarda va tartibda taqdim etish. <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:24.55pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">4.3. Shartnoma va uning ijrosi bilan bog‘liq barcha ma’lumotlar, jumladan, hujjatlarni rasmiylashtirish jarayonida olingan Mijozlar haqidagi ma’lumotlar; Kreditor tomonidan Mijozlarga ko‘rsatilgan mikroqarz/mikrokreditlar summasi va miqdori, «BIRZUM NASIYA muddatli to‘lov tizimi» mahsuloti doirasida berilgan xizmatlar, hujjat aylanmasi tartibi, shuningdek, qonunchilik bilan himoyalangan boshqa ma’lumotlar maxfiy hisoblanadi. Ushbu ma’lumotlar faqat amaldagi qonunchilikda belgilangan hollarda vakolatli davlat organlariga taqdim etilishi mumkin.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Ommaviy axborot esa maxfiy ma’lumot hisoblanmaydi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:24.55pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">4.4. Maxfiy ma’lumotlarni oshkor qilish deganda, harakat yoki harakatsizlik natijasida maxfiy ma’lumotlarning istalgan shaklda (og‘zaki, yozma, elektron yoki boshqa), shu jumladan texnik vositalardan foydalangan holda, egasining roziligisiz yoki mazkur Shartnomaga zid ravishda uchinchi shaxslarga ma’lum bo‘lib qolishi tushuniladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:24.55pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">4.5. Agar Kreditor va/yoki SXKKga Tomonlar xodimlaridan biri tomonidan axborot maxfiyligining amaldagi yoki ehtimoliy buzilishi ma’lum bo‘lsa, ular bu haqda zudlik bilan qarshi Tomonni xabardor qilishlari hamda maxfiy ma’lumotlarning taqdim etilishi (oshkor etilishi)ni oldini olish uchun barcha zarur choralarni ko‘rishlari shart.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:24.55pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">4.6. Kreditor tomonidan SXKK ga «BIRZUM NASIYA muddatli to‘lov tizimi»ga kirish uchun berilgan hisob ma’lumotlari (login va parol) maxfiy ma’lumot sifatida tan olinadi. Hisob ma’lumotlari Kreditor tomonidan shartnomada belgilangan kelishilgan aloqa kanallari (shu jumladan elektron pochta va/ yoki Tomonlar tomonidan belgilangan Telegram) orqali taqdim etiladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:24.55pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">4.7. SXKK hisob ma’lumotlarini maxfiy va xavfsiz saqlashni ta’minlashi, ularni uchinchi shaxslarga oshkor qilmasligi va faqat mazkur shartnomani ijro etish maqsadida foydalanishi shart. Hisob ma’lumotlari berilgan vaqtdan boshlab ularni saqlash va ruxsatsiz kirishning oldini olish bo‘yicha to‘liq javobgarlik SXKK zimmasiga yuklanadi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:0pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:12pt;line-height:13.8pt\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:14.2pt;padding-right:0.2pt;text-indent:-14.2pt;text-align:center;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"284\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">5.<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\"><\/span><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">TOMONLARNING JAVOBGARLIGI<\/span><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:28.35pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.1.<\/span><span style=\"font-size:12pt;line-height:13.8pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Shartnoma<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">bo‘yicha<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">o‘z<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">zimmasiga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">olgan<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">majburiyatlarni<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-heigh 10pt;line-height:11.55pt\">5.2. Shartnoma<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">talablarini<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">bajarmaslik<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">natijasida<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">kelib<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">chiqadigan<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">noxush<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">oqibatlar<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">bilan<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">bog‘liq<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">barcha<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">xavf-xatarni<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">bunday<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">buzilish<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">sodir<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">qilgan<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Tomon<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">o‘z<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">zimmasiga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">oladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:28.35pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.3. Mazkur<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">shartnoma<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">doirasida<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">SXKK, SXKK<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">va<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Kreditor<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">o‘rtasidagi<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">axborot<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">almashish<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">tizimiga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">ruxsatsiz<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">shaxslar<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">kirishiga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">javobgar<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">bo‘lib, taqdim<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">etilgan<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">kirish<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">huquqining<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">noqonuniy<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">ishlatilishi<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">natijasida<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Kreditorga<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">kelgan<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">zararlarni<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">to‘liq<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">qoplaydi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:28.35pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.4. Har qanday isbotlangan zarar qoplanishi shart. Tomonlar ushbu Shartnoma shartlari buzilgan taqdirda yuzaga kelgan barcha zarar va xarajatlarni to‘liq qoplaydilar.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:28.35pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.5. 2021-yil 04.10 sanasidagi PQ-5252-sonli Prezident qaroriga muvofiq, SXKK barcha savdolarini o‘zining kassa apparati yordamida mustaqil ravishda fiskallashtirishga majburdir.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:28.35pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.6. SXKK hisob ma’lumotlari yordamida tizimda amalga oshirilgan barcha harakatlar SXKK tomonidan amalga oshirilgan hisoblanadi va ularga tegishli huquqiy oqibatlarni keltirib chiqaradi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">    <\/span><span style=\"font-size:10pt;line-height:11.55pt\">5.7. SXKK quyidagi holatlar natijasida Kreditor va/yoki uchinchi shaxslarga yetkazilgan har qanday zarar uchun javobgar bo‘ladi:<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-13.65pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">hisob ma’lumotlarining yo‘qolishi, oshkor qilinishi yoki kompromatatsiyasi; <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-13.65pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">SXKK aybi bilan tizimga ruxsatsiz kirish; <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-13.65pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">SXKK xodimlarining harakatlari yoki harakatsizligi. <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.8pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.8. SXKK hisob ma’lumotlari yo‘qolgan, kompromatatsiya qilingan yoki ruxsatsiz kirish aniqlangan hollarda Kreditorni darhol xabardor qilishi shart.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.8pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.9. Kreditor xavfsizlik tahdidi, shubhali faoliyat yoki ushbu Shartnoma shartlari buzilganini aniqlagan taqdirda SXKK ning tizimga kirishini vaziyat aniqlanguncha vaqtincha to‘xtatishga haqli.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.8pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.10. Tomonlar tan oladiki, Kreditor tizimi ma’lumotlari (operatsiyalar jurnallari (loglar), tizimga kirish ma’lumotlari, IP-manzillar va boshqa texnik ma’lumotlar) nizolarni hal etishda dalil sifatida ishlatilishi mumkin.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.8pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.11. SXKK hisob ma’lumotlarini olish uchun belgilangan aloqa kanallari (elektron pochta va Telegram) ishonchliligi va xavfsizligi hamda uchinchi shaxslarning ushbu kanallarga kirishiga javobgar bo‘ladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.8pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.12. Agar hisob ma’lumotlari yoki SXKK ning aloqa kanallarining kompromatatsiyasi Kreditor aybisiz sodir bo‘lgan bo‘lsa, Kreditor bunga javobgar hisoblanmaydi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.8pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.13. SXKK tomonidan «BIRZUM NASIYA muddatli toʻlov tizimi» orqali amalga oshirilgan harakatlarda quyidagi holatlar aniqlangan taqdirda, Kreditor nizoli operatsiya summasi miqdorida SXKKga oʻtkazib berilishi lozim boʻlgan mablagʻlarni bir tomonlama tartibda vaqtincha ushlab turish huquqiga ega:<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-13.65pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Mijozga tovarni yetkazib bermaslik yoki shartnomada belgilangan muddatda topshirmaslik;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-13.65pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Tovar (ish, xizmat) realizatsiyasi oʻrniga naqd pul mablagʻlarini yechib berish (naqdlashtirish) holatlari;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-13.65pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Mijozga mikroqarz shartnomasi va toʻlov jadvalini yozma yoki elektron shaklda taqdim etmaslik;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-13.65pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Mijoz murojaati, eʻtirozi yoki vakolatli davlat organlarining talabi asosida nizoli holat yuzaga kelishi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.8pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.14. Kreditor ushbu shartnomaning 5.13-bandida koʻrsatilgan nizoli holat toʻliq bartaraf etilgunga qadar, SXKKning «BIRZUM NASIYA muddatli toʻlov tizimi»dan foydalanish huquqini, jumladan tizimga kirish (login/parol faoliyatini) va yangi operatsiyalarni amalga oshirish imkoniyatini vaqtincha cheklash yoki bloklash huquqiga ega boʻladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.8pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">5.15. Mablagʻlarni ushlab turish muddati hamda tizimdan foydalanish huquqining cheklanishi nizoli holat Tomonlar yoki vakolatli organlar tomonidan toʻliq oʻrganilib, yakuniy qaror qabul qilingunga qadar amal qiladi. Arizani koʻrib chiqish va nizo natijasiga koʻra:<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-13.65pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Kreditor yoki Mijozning talablari asosli deb topilganda, yetkazilgan zarar yoki qaytarilishi lozim boʻlgan mablagʻlar ushlab turilgan summadan bir tomonlama chegirib qoplanadi;<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-13.65pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">SXKKning aybi aniqlanmagan taqdirda, ushlab turilgan mablagʻlar 3 (uch) bank ish kuni ichida SXKKning hisob-raqamiga oʻtkazib beriladi hamda tizimga kirish huquqi toʻliq tiklanadi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:0pt;padding-right:0.2pt;text-indent:0pt;text-align:center;padding-top:11.55pt;line-height:0;font-size:0\" data-tabs=\"\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">6. FORS-MAJOR HOLATLARI<\/span><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">6.1 Tomonlar, agar o‘z majburiyatlarini bajarmaslik yoki noto‘g‘ri bajarish holati kutilmagan va mazkur sharoitlarda oldini olish imkonsiz bo‘lgan kuchli majburiyatdan tashqari holatlar (fors-major) natijasida sodir bo‘lgan bo‘lsa, javobgarlikdan ozod qilinadi. Bunday holatlar quyidagilarni o‘z ichiga oladi: tabiiy ofatlar, harbiy harakatlar, terroristik harakatlar, blokada, boshqa oldini ololmaydigan holatlar, shuningdek davlat organlarining normativ hujjatlar qabul qilishi va/yoki shartnomani bajarishni imkonsiz qiladigan harakatlari (faqat bir Tomonga nisbatan qabul qilingan hujjatlar yoki harakatlar bundan mustasno).<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Fors-major holati yuz bergan taqdirda, zarar ko‘rgan Tomon boshqa Tomonni kelishilgan aloqa kanallari orqali yozma ravishda 5 (besh) kalendar kun ichida xabardor qilishi shart. Bunday holatda, Shartnoma bo‘yicha majburiyatlarni bajarish muddati fors-major davomiyligi bilan uzaytiriladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:202.65pt;padding-right:0.2pt;text-indent:0pt;text-align:center;line-height:0;font-size:0\" data-tabs=\"0\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:56.7pt;padding-right:0.2pt;text-indent:-14.15pt;text-align:center;line-height:0;font-size:0\" data-tabs=\"0\" data-hang=\"1134\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">7.<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\"><\/span><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">SHARTNOMA MUDDATI, O‘ZGARTIRISH VA BEKOR QILISH TARTIBI,<\/span><br><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">BOSHQA SHARTLAR<\/span><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:21.3pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">7.1 Mazkur shartnoma cheklangan bo‘lmagan muddatga amal qiladi va shartnomada belgilangan tartib bo‘yicha bekor qilinmaguncha kuchda bo‘ladi. Shartnoma har bir Tomon tashabbusi bilan, bir tomonlama (shartnomani bajarishdan voz kechish) tarzda erta bekor qilinishi mumkin. Buning uchun kamida 14 (o‘n to‘rt) kalendar kun oldin kelishilgan aloqa kanallari orqali yozma xabar yuborilishi shart. Shartnoma xabar berilgan kundagi sanadan boshlab bekor qilingan hisoblanadi. Shu bilan birga, Tomonlar qaror qabul qilinganidan boshlab shartnoma bo‘yicha majburiyatlarni vaqtincha to‘xtatishga haqli.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Shartnomadan bir Tomonning voz kechishi, voz kechish paytida yuzaga kelgan majburiyatlarni bajarishga ta’sir qilmaydi. Agar SXKK shartnoma shartlarini bajarmasa yoki noto‘g‘ri bajarsa, Shartnoma Kreditor tashabbusi bilan qaror qabul qilingan kundan boshlab bekor qilinadi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:17.45pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">7.2 Shartnomaga o‘zgartirish va qo‘shimchalar kiritish tartibi<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Kreditor, kelishilgan aloqa kanallari orqali xabar yuborish orqali, shartnoma shartlarini bir tomonlama o‘zgartirishga haqli. Agar xabarda boshqa sana ko‘rsatilmagan bo‘lsa, o‘zgartirishlar xabar yuborilgan kundan boshlab 5 (besh) kalendar kundan keyin kuchga kiradi. <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Agar SXKK kiritilgan o‘zgartirishlarga rozi bo‘lmasa (bu haqda SXKK xabarni olgan kundan boshlab 3 (uch) kalendar kun ichida yozma ravishda Kreditorni xabardor qiladi), Kreditor xabar yuborilgan kundan boshlab 5 (besh) kalendar kundan keyin shartnomani bir tomonlama ravishda bekor qilishga haqli bo‘ladi, shu jumladan SXKK tomonidan rozi bo‘lmagan o‘zgartirishlar qismini ham bekor qilish mumkin. <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:35.45pt;padding-right:0pt;text-indent:-18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-hang=\"709\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">-<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt\"><\/span><span style=\"font-size:10pt;line-height:11.55pt\">Tomonlar, shuningdek, bank rekvizitlari, joylashuv (manzil), telefon raqamlari, elektron pochta manzillari, shartnoma shartlarini bajarish huquqiga ega xodimlar haqidagi ma’lumotlarni kelishilgan aloqa kanallari orqali 2 (ikki) ish kuni ichida bir-biriga xabar berishga majburdirlar. <\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:17.45pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">7.3 Mazkur shartnoma imzolanganidan keyin Tomonlar o‘rtasida oldin tuzilgan, shunga o‘xshash predmetga ega shartnomalar bekor hisoblanadi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:17.45pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">7.4 Nizolarni hal qilish tartibi: Tomonlar shartnoma ijrosi davomida yuzaga kelishi mumkin bo‘lgan nizolarni muzokaralar va sudgacha (da’vo) tartibida hal qilishga intiladilar. Da’vo qabul qiluvchi Tomon, da’vo xabari olgan kundan boshlab 10 (o‘n) kalendar kun ichida boshqa Tomonni da’vo natijalari haqida yozma xabarda xabardor qilishi shart, agar shartnomada boshqa muddat belgilangan bo‘lmasa.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Yuqoridagi tartibda hal qilinmagan nizolar O‘zbekiston Respublikasi amaldagi qonunchiligiga muvofiq, Farg‘ona interrayon iqtisodiy sudida ko‘rib chiqiladi.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Mazkur shartnomada ko‘rsatilmagan barcha holatlarda Tomonlar O‘zbekiston Respublikasi qonunchiligiga amal qiladilar.<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:0pt;padding-right:0.2pt;text-indent:0pt;text-align:left;padding-top:0.1pt;line-height:0;font-size:0\" data-tabs=\"25\"><span style=\"font-size:10pt;line-height:11.55pt\">&#8203;<\/span><\/p><p class=\"wp\" style=\"padding-left:4.35pt;padding-right:0.2pt;text-indent:0pt;text-align:center;line-height:0;font-size:0\" data-tabs=\"25,426\"><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">8.<\/span><span class=\"wt\" style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\"><\/span><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold\">KORRUPSIYAGA QARSHI SHARTLAR<\/span><span style=\"font-size:10pt;line-height:11.55pt;font-weight:bold;line-height:0\">&#8203;<\/span><\/p><p class=\"wp wj\" style=\"padding-left:0pt;padding-right:0pt;text-indent:18pt;text-align:justify;line-height:0;font-size:0\" data-tabs=\"\" data-wc=\"1\"><span style=\"font-size:10pt;line-height:11.55pt\">8.1 Tomonlar<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">va<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">Shartnoma<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">majburiyatlarini<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">bajarish<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">uchun<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span><span style=\"font-size:10pt;line-height:11.55pt\">jalb<\/span><span style=\"font-size:10pt;line-height:11.55pt;line-height:0\"> <\/span>
