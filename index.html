<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#132038;
    --ink-2:#1d2f52;
    --paper:#eef1f6;
    --paper-2:#ffffff;
    --line:#d7dce6;
    --gold:#b8863f;
    --gold-2:#8f6529;
    --ok:#2f7a4f;
    --danger:#a3323b;
    --text:#1a2233;
    --muted:#5b6579;
    --mono: 'Courier New', Courier, monospace;
    --serif: Georgia, 'Times New Roman', Times, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--text);font-family:var(--sans);}
  body{padding-bottom:60px;}

  .topbar{
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 60%, #24406e 100%);
    color:#fff; padding:18px 32px; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .topbar::after{
    content:"";position:absolute; right:-40px; top:-60px; width:220px;height:220px;border-radius:50%;
    border:1.5px dashed rgba(184,134,63,.45);
  }
  .topbar::before{
    content:"";position:absolute; right:30px; top:20px; width:120px;height:120px;border-radius:50%;
    border:1.5px solid rgba(184,134,63,.35);
  }
  .brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1;}
  .brand-logo{
    height:40px; width:auto; display:block; background:#fff; border-radius:8px;
    padding:6px 10px; flex:none;
  }
  .brand h1{font-family:var(--serif);font-size:20px;margin:0;font-weight:700;letter-spacing:.2px;}
  .brand p{margin:2px 0 0;font-size:12px;color:#c9d3e6;letter-spacing:.3px;}
  .logout-btn{
    position:relative;z-index:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);
    color:#fff;padding:9px 16px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;
    font-family:var(--sans);flex:none;
  }
  .logout-btn:hover{background:rgba(255,255,255,.16);}

  .login-screen{
    position:fixed;inset:0;z-index:1000;
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 55%, #24406e 100%);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-card{
    background:#fff;border-radius:14px;padding:36px 34px;width:100%;max-width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;
  }
  .login-logo{height:46px;width:auto;margin:0 auto 18px;display:block;}
  .login-card h2{font-family:var(--serif);font-size:18px;margin:0 0 4px;color:var(--ink);}
  .login-sub{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
  .login-card form{text-align:left;}
  .login-card label{margin-top:12px;}
  .login-card label:first-of-type{margin-top:0;}

  .tabs{
    display:flex;gap:6px;padding:0 32px;background:var(--paper-2);
    border-bottom:1px solid var(--line); overflow-x:auto;
  }
  .tab-btn{
    border:none;background:transparent;padding:14px 16px;font-size:13.5px;font-weight:600;
    color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;
    font-family:var(--sans);
  }
  .tab-btn .cnt{
    display:inline-block;min-width:18px;padding:0 5px;margin-left:7px;border-radius:9px;
    background:var(--paper);color:var(--muted);font-size:10.5px;font-weight:700;
  }
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--gold);}
  .tab-btn.active .cnt{background:var(--gold);color:#fff;}

  .wrap{max-width:1360px;margin:0 auto;padding:26px 32px;}
  .grid{display:grid;grid-template-columns:400px 1fr;gap:22px;align-items:start;}
  @media (max-width:980px){.grid{grid-template-columns:1fr;}}

  .card{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:20px;}
  .card h2{font-family:var(--serif);font-size:16.5px;margin:0 0 4px;color:var(--ink);}
  .card .sub{font-size:12px;color:var(--muted);margin:0 0 16px;}

  .subtabs{display:flex;gap:8px;margin-bottom:16px;}
  .subtab{flex:1;border:1px solid var(--line);background:var(--paper);padding:8px 10px;border-radius:7px;
    font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;}
  .subtab.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin:12px 0 5px;letter-spacing:.2px;}
  label .opt{font-weight:400;color:var(--muted);text-transform:none;}
  input[type=text],input[type=date],input[type=number],textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;
    font-family:var(--sans);background:#fbfcfe;color:var(--text);
  }
  input:focus,textarea:focus{outline:none;border-color:var(--gold);background:#fff;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .hint{font-size:10.5px;color:var(--muted);margin-top:3px;}

  .actions{display:flex;gap:10px;margin-top:20px;}
  button.primary{
    background:var(--ink);color:#fff;border:none;padding:11px 18px;border-radius:7px;font-weight:700;
    font-size:13px;cursor:pointer;flex:1;font-family:var(--sans);
  }
  button.primary:hover{background:var(--ink-2);}
  button.secondary{
    background:transparent;color:var(--ink);border:1px solid var(--line);padding:11px 14px;border-radius:7px;
    font-weight:600;font-size:13px;cursor:pointer;font-family:var(--sans);
  }
  button.secondary:hover{border-color:var(--gold);color:var(--gold-2);}
  .status{margin-top:10px;font-size:12px;min-height:16px;}
  .status.ok{color:var(--ok);}
  .status.err{color:var(--danger);}

  .right-col{display:flex;flex-direction:column;gap:18px;}
  .preview-shell{
    background:#c9cfdb;border-radius:10px;padding:18px;max-height:640px;overflow:auto;
  }
  .paper{
    background:#fff;width:210mm;min-height:100mm;margin:0 auto;padding:16mm 15mm;
    box-shadow:0 4px 18px rgba(0,0,0,.18);font-family:var(--serif);color:#1a1a1a;
    font-size:10.6px;line-height:1.48;box-sizing:border-box;
    overflow-wrap:anywhere;word-break:break-word;
  }
  .paper h3{font-size:12.5px;text-align:center;margin:0 0 2px;letter-spacing:.3px;overflow-wrap:anywhere;}
  .paper h4{font-size:11.3px;margin:16px 0 6px;letter-spacing:.3px;}
  .paper p{margin:5px 0;text-align:justify;}
  .paper .center{text-align:center;}
  .paper .doc-date{text-align:right;font-size:10.3px;margin-bottom:10px;white-space:nowrap;}
  .paper table{width:100%;border-collapse:collapse;margin:8px 0;font-size:10.3px;table-layout:fixed;}
  .paper table td,.paper table th{border:1px solid #999;padding:4px 6px;overflow-wrap:anywhere;word-break:break-word;}
  .paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px;font-size:10.3px;}
  .paper .sig b{display:block;margin-bottom:4px;}
  .paper .ph{color:#b23b3b;font-style:italic;}
  .paper .addendum{margin-top:16px;border-top:1px dashed #999;padding-top:10px;}
  .empty-preview{color:var(--muted);text-align:center;padding:60px 20px;font-size:13px;}
  .pdf-offscreen{position:fixed;left:-10000px;top:0;z-index:-1;}
  /* ---- Bosh kelishuv: Word sahifalari ---- */
.wl-doc{position:relative;font-family:'Times New Roman',Times,'Liberation Serif',Tinos,serif;color:#000;white-space:pre-wrap;hyphens:manual;-webkit-hyphens:manual;font-kerning:none;font-variant-ligatures:none;text-rendering:geometricPrecision;overflow-wrap:normal;word-break:normal;line-height:normal;font-size:11pt;text-align:left;letter-spacing:0;}
.wl-doc p.wp{margin:0;}
.wl-doc table.wtbl{border-collapse:collapse;table-layout:fixed;border-spacing:0;}
.wl-doc table.wtbl td{box-sizing:content-box;}
.wl-measure{position:absolute;left:-30000px;top:0;visibility:hidden;}
.wl-page{position:relative;background:#fff;overflow:hidden;box-sizing:border-box;}
.wl-clip{position:absolute;overflow:hidden;}
.wl-clip>.wl-doc{position:absolute;left:0;}
.wl-doc p.wj span{word-spacing:-0.065em;}
.wl-doc table.wtbl,.wl-doc table.wtbl td{white-space:pre-wrap;text-align:left;font-weight:normal;font-style:normal;font-size:11pt;line-height:normal;color:#000;}
.wl-doc table.wtbl{margin-top:0;margin-bottom:0;}
.wl-doc table.wtbl td{overflow-wrap:normal;word-break:normal;}
.wl-host{display:block;}
.wl-host .empty-preview{background:#fff;border-radius:4px;}
.wl-pv{margin:0 auto 14px;box-shadow:0 4px 18px rgba(0,0,0,.18);background:#fff;overflow:hidden;}
.wl-pv:last-child{margin-bottom:0;}


  table.history{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.history th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
    padding:8px 8px;border-bottom:1px solid var(--line);
  }
  table.history td{padding:9px 8px;border-bottom:1px solid #eef0f4;vertical-align:top;}
  table.history tr:hover td{background:#f7f9fc;}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
  .badge.bonus{background:#e8f3ec;color:var(--ok);}
  .badge.cancel{background:#f7e9ea;color:var(--danger);}
  .link-btn{background:none;border:none;color:var(--gold-2);font-weight:700;cursor:pointer;font-size:12px;padding:0;margin-right:12px;}
  .link-btn.del{color:var(--danger);}
  .empty-hist{color:var(--muted);font-size:12.5px;padding:18px 4px;}
  /* ============ MAVZU (kunduzgi / tungi) VA ASOSIY RANG ============ */
  :root{
    --accent:#7ab51d; --accent-2:#5f8f12; --accent-soft:rgba(122,181,29,.13); --accent-ink:#ffffff;
    --bg:#f2f4f7; --paper:#f2f4f7; --paper-2:#ffffff; --line:#e1e5ec; --line-2:#eef0f4;
    --text:#1d2433; --muted:#6b7385; --ink:#1b4352; --ink-2:#2a5565;
    --input-bg:#fbfcfe; --hover:#f6f8fb; --preview-bg:#cfd5df; --sidebar-bg:#ffffff;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --gold:var(--accent); --gold-2:var(--accent-2);
    --sb-w:262px;
  }
  :root[data-theme="dark"]{
    --bg:#0e1420; --paper:#0e1420; --paper-2:#161f2e; --line:#273346; --line-2:#1f2a3a;
    --text:#e2e8f1; --muted:#93a0b5; --ink:#eef3fa; --ink-2:#c9d5e6;
    --input-bg:#101927; --hover:#1b2638; --preview-bg:#0a0f18; --sidebar-bg:#121a28;
    --shadow:0 1px 3px rgba(0,0,0,.35);
    --ok:#4cc27e; --danger:#ef6b74;
    color-scheme:dark;
  }
  html,body{background:var(--bg);}
  body{padding-bottom:0;}

  /* ============ ILOVA QOBIG'I: CHAP MENYU + ASOSIY QISM ============ */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    position:sticky;top:0;height:100vh;width:var(--sb-w);flex:none;z-index:50;
    background:var(--sidebar-bg);border-right:1px solid var(--line);
    display:flex;flex-direction:column;transition:width .2s ease;
  }
  .sb-head{position:relative;display:flex;align-items:center;height:68px;padding:0 18px;border-bottom:1px solid var(--line-2);}
  .sb-logo{height:34px;width:150px;object-fit:contain;object-position:left center;display:block;transition:width .2s ease;}
  :root[data-theme="dark"] .sb-logo{background:#fff;border-radius:7px;padding:3px 6px;}
  .sb-toggle{
    position:absolute;right:-12px;top:22px;width:24px;height:24px;border-radius:50%;
    border:1px solid var(--line);background:var(--paper-2);color:var(--muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0;box-shadow:var(--shadow);
  }
  .sb-toggle:hover{color:var(--accent-2);border-color:var(--accent);}
  .sb-toggle svg{width:14px;height:14px;transition:transform .2s;}
  .sb-nav{flex:1;overflow-y:auto;padding:14px 0;}
  .nav-item{
    display:flex;align-items:center;gap:12px;margin:3px 12px;padding:10px 12px;border-radius:9px;
    color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:none;
    width:calc(100% - 24px);text-align:left;font-family:var(--sans);white-space:nowrap;position:relative;
  }
  .nav-item svg{width:19px;height:19px;flex:none;color:var(--muted);}
  .nav-item:hover{background:var(--hover);}
  .nav-item.active{background:var(--accent-soft);color:var(--ink);font-weight:700;}
  .nav-item.active svg{color:var(--accent);}
  .nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);}
  .nav-label{flex:1;overflow:hidden;text-overflow:ellipsis;}
  .nav-cnt{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--paper);border-radius:10px;padding:1px 7px;}
  .nav-item.active .nav-cnt{background:var(--accent);color:var(--accent-ink);}
  .sb-foot{padding:14px 12px;border-top:1px solid var(--line-2);}
  .sb-user{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:9px 10px;
    font-size:12px;font-weight:700;letter-spacing:.4px;cursor:pointer;font-family:var(--sans);white-space:nowrap;
  }
  .sb-user:hover{background:var(--accent-2);}
  .sb-user svg{width:16px;height:16px;flex:none;}
  .sidebar.collapsed{--sb-w:72px;}
  .sidebar.collapsed .sb-logo{width:34px;height:34px;object-fit:cover;object-position:left center;}
  .sidebar.collapsed .sb-head{padding:0 19px;}
  .sidebar.collapsed .sb-toggle svg{transform:rotate(180deg);}
  .sidebar.collapsed .nav-label,.sidebar.collapsed .nav-cnt,.sidebar.collapsed .sb-user span{display:none;}
  .sidebar.collapsed .nav-item{justify-content:center;padding:11px 0;}
  .sidebar.collapsed .nav-item:hover::after{
    content:attr(data-title);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);
    background:var(--ink);color:var(--paper-2);font-size:12px;font-weight:600;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:60;
  }

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 28px 4px;}
  .page-head h1{margin:0;font-size:24px;font-weight:700;color:var(--ink);font-family:var(--sans);letter-spacing:-.2px;}
  .page-head .ph-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .ph-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--paper-2);color:var(--muted);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  }
  .icon-btn:hover{color:var(--accent-2);border-color:var(--accent);}
  .icon-btn svg{width:18px;height:18px;}
  .burger{display:none;}
  .wrap{max-width:none;margin:0;padding:16px 28px 40px;}
  .sb-backdrop{display:none;}
  @media (max-width:900px){
    .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;--sb-w:250px !important;box-shadow:0 10px 40px rgba(0,0,0,.25);}
    .sidebar.open{transform:none;}
    .sidebar.collapsed .nav-label,.sidebar.collapsed .nav-cnt,.sidebar.collapsed .sb-user span{display:initial;}
    .sidebar.collapsed .nav-item{justify-content:flex-start;padding:10px 12px;}
    .sidebar.collapsed .sb-logo{width:150px;}
    .sb-toggle{display:none;}
    .burger{display:inline-flex;}
    .sb-backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;}
    .page-head{padding:14px 16px 2px;}
    .page-head h1{font-size:20px;}
    .wrap{padding:12px 16px 30px;}
  }

  /* ============ UMUMIY ELEMENTLAR (mavzuga moslash) ============ */
  .card{border-radius:12px;box-shadow:var(--shadow);}
  input[type=text],input[type=date],input[type=number],input[type=password],input[type=search],input[type=email],input[type=tel],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;
    font-family:var(--sans);background:var(--input-bg);color:var(--text);
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--paper-2);box-shadow:0 0 0 3px var(--accent-soft);}
  input:disabled{opacity:.75;cursor:not-allowed;}
  button.primary{background:var(--accent);color:var(--accent-ink);}
  button.primary:hover{background:var(--accent-2);}
  button.primary:disabled{opacity:.6;cursor:default;}
  button.secondary{background:var(--paper-2);color:var(--text);}
  button.secondary:hover{border-color:var(--accent);color:var(--accent-2);}
  :root[data-theme="dark"] button.secondary:hover{color:var(--accent);}
  .subtab{background:var(--paper);}
  .subtab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .preview-shell{background:var(--preview-bg);}
  table.history td{border-bottom:1px solid var(--line-2);}
  table.history tr:hover td{background:var(--hover);}
  :root[data-theme="dark"] .link-btn{color:var(--accent);}
  :root[data-theme="dark"] .badge.bonus{background:rgba(76,194,126,.15);}
  :root[data-theme="dark"] .badge.cancel{background:rgba(239,107,116,.15);}
  :root[data-theme="dark"] .empty-preview{color:var(--muted);}
  .paper .empty-preview{color:#5b6579;}

  /* ============ LOGIN OYNASI ============ */
  .login-screen{background:radial-gradient(1200px 600px at 20% 10%, #24406e 0%, transparent 60%),linear-gradient(135deg,#132038 0%,#1d2f52 55%,#24406e 100%);}
  .login-card{border-radius:16px;padding:38px 34px 30px;}
  .login-card h2{color:#132038;}
  .login-card label{color:#1d2f52;}
  .login-card input[type=text],.login-card input[type=password]{
    height:44px;padding:10px 13px;font-size:14px;border-radius:9px;border:1px solid #d7dce6;background:#f8fafc;color:#1a2233;
  }
  .login-card input:focus{border-color:#7ab51d;background:#fff;box-shadow:0 0 0 3px rgba(122,181,29,.18);}
  .pass-wrap{position:relative;}
  .pass-wrap input{padding-right:46px !important;}
  .pass-eye{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;background:none;
    color:#6b7385;cursor:pointer;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .pass-eye:hover{color:#1d2f52;background:#eef1f6;}
  .pass-eye svg{width:18px;height:18px;}
  .login-card button.primary{height:44px;border-radius:9px;font-size:14px;background:#132038;color:#fff;}
  .login-card button.primary:hover{background:#1d2f52;}

  /* ============ HAMKORLAR (ro'yxat + tafsilot) ============ */
  .hk-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:16px;align-items:start;}
  @media (max-width:1180px){.hk-grid{grid-template-columns:1fr;}}
  .hk-card{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);}
  .hk-card-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;}
  .hk-card-head h2{margin:0;font-size:15.5px;font-weight:700;color:var(--ink);font-family:var(--sans);}
  .hk-plus{
    width:24px;height:24px;border-radius:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-2);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-size:17px;font-weight:700;line-height:1;
  }
  :root[data-theme="dark"] .hk-plus{color:var(--accent);}
  .hk-plus:hover{background:var(--accent);color:var(--accent-ink);}
  .hk-tools{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap;}
  .hk-tool{border:1px solid var(--line);background:var(--paper-2);color:var(--text);border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);white-space:nowrap;}
  .hk-tool:hover{border-color:var(--accent);color:var(--accent-2);}
  .hk-search{position:relative;width:260px;max-width:100%;}
  .hk-search input{padding-left:32px;height:34px;font-size:12.5px;}
  .hk-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);}
  .hk-table-wrap{overflow:auto;max-height:calc(100vh - 290px);min-height:240px;}
  table.hk-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.hk-table th{
    position:sticky;top:0;z-index:1;background:var(--paper-2);text-align:left;font-size:11px;font-weight:700;color:var(--muted);
    padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  table.hk-table td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;}
  table.hk-table tbody tr{cursor:pointer;}
  table.hk-table tbody tr:hover td{background:var(--hover);}
  table.hk-table tbody tr.sel td{background:var(--accent-soft);}
  table.hk-table tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent);}
  .hk-name{font-weight:600;color:var(--text);}
  .hk-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .hk-ico{border:none;background:none;cursor:pointer;padding:3px;border-radius:5px;color:var(--accent-2);display:inline-flex;}
  .hk-ico.del{color:var(--danger);}
  .hk-ico:hover{background:var(--hover);}
  .hk-ico svg{width:15px;height:15px;}
  .hk-clip{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);}
  .hk-clip svg{width:13px;height:13px;}
  .hk-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line-2);flex-wrap:wrap;}
  .hk-pages{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
  .hk-pg{
    min-width:28px;height:28px;padding:0 6px;border:1px solid var(--line);background:var(--paper-2);color:var(--text);
    border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--sans);
  }
  .hk-pg:hover:not(:disabled){border-color:var(--accent);}
  .hk-pg.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;}
  .hk-pg:disabled{opacity:.4;cursor:default;}
  .hk-size{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  .hk-size select{width:auto;padding:5px 8px;font-size:12px;}
  .hk-detail-body{padding:16px;}
  .hk-form{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .hk-form .full{grid-column:1 / -1;}
  .hk-form label{margin:10px 0 4px;font-size:11px;}
  .hk-form input{padding:8px 10px;font-size:12.5px;}
  @media (max-width:560px){.hk-form{grid-template-columns:1fr;}}
  .hk-empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px;}
  .hk-empty svg{width:42px;height:42px;opacity:.45;display:block;margin:0 auto 10px;}
  .hk-section{margin-top:18px;border-top:1px solid var(--line-2);padding-top:14px;}
  .hk-section h3{font-size:13.5px;margin:0 0 4px;color:var(--ink);font-family:var(--sans);display:flex;align-items:center;gap:8px;}
  .hk-section .sub{font-size:11.5px;color:var(--muted);margin:0 0 10px;}
  .hk-drop{
    border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px;
    cursor:pointer;background:var(--input-bg);transition:border-color .15s, background .15s;
  }
  .hk-drop:hover,.hk-drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text);}
  .hk-drop b{color:var(--accent-2);}
  :root[data-theme="dark"] .hk-drop b{color:var(--accent);}
  .hk-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:12px;}
  .hk-file{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--paper-2);display:flex;flex-direction:column;}
  .hk-thumb{height:92px;background:var(--hover);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
  .hk-thumb img{width:100%;height:100%;object-fit:cover;}
  .hk-thumb .ext{font-size:12px;font-weight:800;letter-spacing:.5px;color:#fff;background:#8a93a6;border-radius:6px;padding:8px 9px;}
  .hk-thumb .ext.pdf{background:#d04545;} .hk-thumb .ext.doc{background:#2f6fd6;} .hk-thumb .ext.xls{background:#22884a;}
  .hk-fmeta{padding:6px 8px;font-size:11px;}
  .hk-fname{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hk-fsub{color:var(--muted);font-size:10.5px;display:flex;justify-content:space-between;gap:4px;margin-top:2px;}
  .hk-factions{display:flex;border-top:1px solid var(--line-2);}
  .hk-factions button{flex:1;border:none;background:none;padding:5px 0;font-size:11px;cursor:pointer;color:var(--accent-2);font-weight:600;font-family:var(--sans);}
  :root[data-theme="dark"] .hk-factions button{color:var(--accent);}
  .hk-factions button.del{color:var(--danger);}
  .hk-factions button:hover{background:var(--hover);}
  .hk-badge-local{font-size:9.5px;font-weight:700;color:#b26b00;}
  .hk-docs{width:100%;border-collapse:collapse;font-size:12px;}
  .hk-docs td{padding:7px 6px;border-bottom:1px solid var(--line-2);}
  .hk-docs .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent-2);}
  :root[data-theme="dark"] .hk-docs .tag{color:var(--accent);}
  .hk-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  .hk-actions button{flex:1;min-width:120px;}
  .danger-btn{background:var(--paper-2);color:var(--danger);border:1px solid var(--line);padding:11px 14px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;font-family:var(--sans);}
  .danger-btn:hover{border-color:var(--danger);}
  .hk-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);margin-top:12px;cursor:pointer;}

  /* Fayl ko'rish oynasi */
  .viewer{position:fixed;inset:0;z-index:900;background:rgba(10,14,22,.78);display:flex;flex-direction:column;}
  .viewer-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;font-size:13px;}
  .viewer-bar .vname{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .viewer-bar button,.viewer-bar a{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:7px 12px;font-size:12.5px;cursor:pointer;text-decoration:none;font-family:var(--sans);}
  .viewer-bar button:hover,.viewer-bar a:hover{background:rgba(255,255,255,.22);}
  .viewer-body{flex:1;display:flex;align-items:center;justify-content:center;padding:0 16px 16px;min-height:0;}
  .viewer-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;background:#fff;}
  .viewer-body iframe{width:100%;height:100%;border:none;border-radius:6px;background:#fff;}
  .viewer-body .vnone{color:#fff;text-align:center;font-size:14px;}

  /* ============ SOZLAMALAR ============ */
  .set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;align-items:start;}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);}
  .set-row:last-child{border-bottom:none;}
  .set-row .sl{font-size:13px;font-weight:600;color:var(--text);}
  .set-row .sd{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;}
  .seg button{border:none;background:var(--paper-2);color:var(--text);padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);border-right:1px solid var(--line);}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--accent);color:var(--accent-ink);}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;}
  .sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--paper-2);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;}
  .sw.on{box-shadow:0 0 0 2px var(--text);}
  .sw-custom{width:30px;height:30px;border:none;background:none;padding:0;cursor:pointer;}
  .switch{position:relative;width:40px;height:22px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch span{position:absolute;inset:0;background:var(--line);border-radius:22px;transition:.2s;cursor:pointer;}
  .switch span::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch input:checked + span{background:var(--accent);}
  .switch input:checked + span::before{transform:translateX(18px);}
  .set-select{width:auto;min-width:190px;}

  /* ---- qo'shimcha moslashlar ---- */
  .grid > *, .right-col > *, .set-grid > *{min-width:0;}
  .main{overflow-x:hidden;}
  .card h2{font-family:var(--sans);font-weight:700;letter-spacing:-.1px;}
  .set-grid{grid-template-columns:repeat(auto-fill,minmax(400px,1fr));}
  @media (max-width:520px){.set-grid{grid-template-columns:1fr;}}
  .set-row{flex-wrap:wrap;}
  .set-row > div:first-child{flex:1 1 170px;}
  .set-grid .actions{flex-wrap:wrap;}
  .set-grid .actions button{flex:1 1 200px;}
  .hk-card-head h2{flex:none;}
  @media (max-width:900px){ .hk-search{width:100%;} .hk-tools{width:100%;margin-left:0;} .hk-table-wrap{max-height:none;} }

  /* ============ OYNA (modal) ============ */
  .modal-back{position:fixed;inset:0;z-index:800;background:rgba(15,21,32,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;}
  .modal{background:var(--paper-2);color:var(--text);border-radius:12px;width:100%;max-width:760px;box-shadow:0 24px 70px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:92vh;}
  .modal form{display:flex;flex-direction:column;min-height:0;flex:1;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line-2);}
  .modal-head h3{margin:0;font-size:17px;color:var(--ink);font-family:var(--sans);}
  .modal-x{width:32px;height:32px;border-radius:7px;border:1.5px solid var(--text);background:var(--paper-2);color:var(--text);cursor:pointer;font-size:14px;font-weight:700;}
  .modal-x:hover{background:var(--hover);}
  .modal-body{padding:6px 20px 16px;overflow:auto;}
  .modal-foot{display:flex;justify-content:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line-2);}
  .modal-foot button{min-width:170px;}
  .hk-ro input[readonly]{background:var(--paper);border-color:var(--line-2);color:var(--text);cursor:default;}
  .hk-ro input[readonly]:focus{box-shadow:none;border-color:var(--line-2);}
  .hk-ro-link{display:block;padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--paper);font-size:12.5px;color:var(--accent-2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  :root[data-theme="dark"] .hk-ro-link{color:var(--accent);}
  .ro-box{padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--paper);font-size:12.5px;white-space:pre-wrap;min-height:34px;}

  /* ============ RO'YXATDAN O'TISH ============ */
  .login-alt{text-align:center;font-size:12.5px;color:#5b6579;margin-top:16px;}
  .login-alt a{color:#5f8f12;font-weight:700;text-decoration:none;}
  .login-alt a:hover{text-decoration:underline;}
  .login-card .row2 label{margin-top:12px;}

  /* ============ STATUS BELGILARI ============ */
  .st-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .st-new{background:rgba(37,99,235,.12);color:#2563eb;}
  .st-re{background:rgba(124,58,237,.12);color:#7c3aed;}
  .st-ret{background:rgba(217,119,6,.14);color:#b45309;}
  .st-ok{background:rgba(22,163,74,.13);color:#15803d;}
  .st-rej{background:rgba(220,38,38,.12);color:#dc2626;}
  :root[data-theme="dark"] .st-new{color:#7aa7ff;} :root[data-theme="dark"] .st-re{color:#b394ff;}
  :root[data-theme="dark"] .st-ret{color:#f5b04a;} :root[data-theme="dark"] .st-ok{color:#4cc27e;} :root[data-theme="dark"] .st-rej{color:#ff7d7d;}
  .nav-cnt.hot{background:#dc2626 !important;color:#fff !important;}

  /* ============ ARIZALAR (admin) ============ */
  .ar-chips{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;}
  .ar-chip{border:1px solid var(--line);background:var(--paper-2);color:var(--text);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--sans);display:inline-flex;gap:6px;align-items:center;}
  .ar-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .ar-chip-n{font-size:10.5px;opacity:.8;}
  .ar-chip-n:empty{display:none;}
  .ar-applicant{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line-2);border-radius:10px;background:var(--paper);}
  .ar-av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex:none;}
  .ar-note{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:12.5px;line-height:1.45;border:1px solid var(--line);}
  .ar-note.warn{background:rgba(217,119,6,.09);border-color:rgba(217,119,6,.35);}
  .ar-note.bad{background:rgba(220,38,38,.07);border-color:rgba(220,38,38,.3);}
  .ar-note.good{background:rgba(22,163,74,.08);border-color:rgba(22,163,74,.3);}
  .ar-decide{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .ar-decide button{flex:1 1 150px;}
  .warn-btn{background:var(--paper-2);color:#b45309;border:1px solid var(--line);padding:11px 14px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;font-family:var(--sans);}
  .warn-btn:hover{border-color:#d97706;}
  .ar-decide button:disabled{opacity:.45;cursor:default;}
  .ar-hist{list-style:none;padding:0;margin:0;}
  .ar-hist li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;}
  .ar-hist .dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none;background:var(--muted);}
  .ar-hist .dot.st-new{background:#2563eb;} .ar-hist .dot.st-re{background:#7c3aed;} .ar-hist .dot.st-ret{background:#d97706;} .ar-hist .dot.st-ok{background:#16a34a;} .ar-hist .dot.st-rej{background:#dc2626;}
  .ar-hist-note{margin-top:3px;color:var(--text);background:var(--paper);border-radius:6px;padding:6px 8px;white-space:pre-wrap;}
  .muted{color:var(--muted);font-weight:400;}
  #arIzoh{min-height:70px;}

  /* hujjat joylari */
  .ar-h3{font-size:14px;color:var(--ink);margin:18px 0 6px;font-family:var(--sans);}
  .ar-docs{display:flex;flex-direction:column;gap:10px;}
  .ar-slot{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper-2);}
  .ar-slot.need{border-color:rgba(217,119,6,.45);}
  .ar-slot.ok{border-color:rgba(22,163,74,.45);}
  .ar-slot-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-size:12.5px;}
  .ar-slot-cnt{font-size:11px;font-weight:700;color:var(--muted);background:var(--paper);border-radius:10px;padding:2px 8px;white-space:nowrap;}
  .ar-slot.ok .ar-slot-cnt{color:#15803d;background:rgba(22,163,74,.12);}
  .ar-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .ar-th{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--hover);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .ar-th img{width:100%;height:100%;object-fit:cover;}
  .ar-th .ext{font-size:11px;font-weight:800;color:#fff;background:#8a93a6;border-radius:5px;padding:6px 7px;}
  .ar-th .ext.pdf{background:#d04545;}
  .ar-th-name{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ar-th-x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:10px;cursor:pointer;padding:0;}
  .ar-add{width:84px;height:84px;border-radius:8px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--accent-2);cursor:pointer;margin:0;background:var(--input-bg);}
  .ar-add:hover{border-color:var(--accent);background:var(--accent-soft);}
  .ar-docs.view .ar-slot{padding:8px 10px;}
  .modal textarea, .ua-main textarea, .hk-card textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;font-family:var(--sans);background:var(--input-bg);color:var(--text);resize:vertical;}

  /* ============ FOYDALANUVCHI SAHIFASI ============ */
  .ua-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 24px;background:var(--sidebar-bg);border-bottom:1px solid var(--line);}
  .ua-top img{height:34px;}
  :root[data-theme="dark"] .ua-top img{background:#fff;border-radius:7px;padding:3px 6px;}
  .ua-top .ua-title{font-weight:700;color:var(--ink);font-size:15px;}
  .ua-top .ua-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .ua-user{font-size:13px;font-weight:600;color:var(--text);padding:0 6px;}
  .ua-wrap{max-width:1280px;margin:0 auto;padding:20px 24px 40px;}
  .ua-grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start;}
  .ua-side{display:flex;flex-direction:column;gap:16px;}
  @media (max-width:980px){.ua-grid{grid-template-columns:1fr;} .ua-wrap{padding:14px 12px 30px;} .ua-top{padding:10px 12px;} .ua-top .ua-title{display:none;}}
  .req-list{margin:0;padding-left:20px;font-size:13px;line-height:1.55;}
  .req-list li{margin:5px 0;}
  .req-note{color:var(--muted);font-size:12px;}
  .ua-req{border-left:4px solid var(--accent);}
  .ua-list{display:flex;flex-direction:column;gap:8px;}
  .ua-item{border:1px solid var(--line);border-radius:9px;background:var(--paper-2);padding:10px 12px;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--text);}
  .ua-item:hover{border-color:var(--accent);}
  .ua-item.sel{border-color:var(--accent);background:var(--accent-soft);}
  .ua-item-top{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;}
  .ua-item-sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .ua-item-note{font-size:11.5px;color:#b45309;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ua-steps{font-size:13px;line-height:1.6;padding-left:20px;}
  .ar-msg{font-size:13px;margin:12px 0 0;}
  .ua-flash{display:none;}
  .ua-flash.ok{display:block;margin-top:10px;padding:10px 12px;border-radius:9px;background:rgba(22,163,74,.1);color:var(--text);font-size:12.5px;border:1px solid rgba(22,163,74,.3);}
  #userApp .card{border-radius:12px;}
  .login-card input[type=tel]{height:44px;padding:10px 13px;font-size:14px;border-radius:9px;border:1px solid #d7dce6;background:#f8fafc;color:#1a2233;}
  .modal-foot button{flex:0 1 220px;}
  .login-screen{overflow:auto;align-items:flex-start;padding-top:6vh;}
  .login-card{margin:auto;}

  /* ============ v4: logo, mobil chiqish, import kartasi ============ */
  :root[data-theme="dark"] .sb-logo, :root[data-theme="dark"] .ua-top img{background:none !important;padding:0 !important;border-radius:0 !important;}
  .sidebar{height:100vh;height:100dvh;}
  .mobile-only{display:none !important;}
  @media (max-width:900px){ .mobile-only{display:inline-flex !important;} .sb-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom));} }
  .imp-card{grid-column:1 / -1;}
  .imp-how{font-size:12.5px;line-height:1.6;margin:0 0 10px;padding-left:20px;color:var(--text);}
  .imp-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line-2);flex-wrap:wrap;}
  .imp-text{flex:1 1 260px;}
  .imp-text .sl{font-size:13.5px;font-weight:700;color:var(--ink);}
  .imp-text .sd{font-size:12px;color:var(--muted);margin-top:2px;}
  .imp-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .imp-btns button{padding:9px 14px;}

  /* ============ bildirishnomalar ============ */
  #toastBox{position:fixed;top:14px;right:14px;z-index:2000;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 28px));pointer-events:none;}
  .toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;background:var(--paper-2);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:11px 12px;box-shadow:0 12px 36px rgba(0,0,0,.22);cursor:pointer;opacity:0;transform:translateY(-8px);transition:.25s ease;}
  .toast.show{opacity:1;transform:none;}
  .toast-ic{font-size:20px;line-height:1;}
  .toast-tx{flex:1;min-width:0;font-size:13px;}
  .toast-tx b{display:inline-block;margin-right:6px;}
  .toast-time{font-size:11px;color:var(--muted);}
  .toast-body{margin-top:3px;color:var(--text);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .toast-x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:2px;}
  .blocked-note{line-height:1.6;background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.3);border-radius:9px;padding:10px 12px;}
  .blocked-note a{color:#1d5fd1;font-weight:700;}

  /* ============ chat ============ */
  .chat{border:1px solid var(--line);border-radius:12px;background:var(--paper-2);display:flex;flex-direction:column;overflow:hidden;}
  .chat-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-2);font-size:13px;}
  .ar-av.sm{width:32px;height:32px;font-size:13px;}
  .chat-body{height:340px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--paper);}
  .chat-empty{margin:auto;color:var(--muted);font-size:12.5px;text-align:center;}
  .msg{display:flex;flex-direction:column;max-width:82%;}
  .msg.me{align-self:flex-end;align-items:flex-end;}
  .msg.them{align-self:flex-start;}
  .bubble{padding:8px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;word-wrap:break-word;overflow-wrap:anywhere;}
  .msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;}
  .msg.them .bubble{background:var(--paper-2);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msg.sys.them .bubble{border-color:rgba(122,181,29,.45);}
  .msg .bubble a{color:inherit;text-decoration:underline;}
  .msg .meta{font-size:10.5px;color:var(--muted);margin-top:3px;padding:0 4px;}
  .chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line-2);align-items:flex-end;}
  .chat-input textarea{flex:1;resize:none;min-height:40px;max-height:140px;border-radius:20px;padding:10px 14px;font-size:14px;}
  .chat-input button{width:44px;height:40px;border-radius:50%;padding:0;font-size:16px;flex:none;}
  .u-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;}
  .u-stats > div{border:1px solid var(--line-2);border-radius:10px;padding:9px 8px;background:var(--paper);text-align:center;}
  .u-stats b{display:block;font-size:18px;color:var(--ink);}
  .u-stats span{font-size:10.5px;color:var(--muted);}
  .u-stats.big b{font-size:22px;}
  .u-stats > div.st-new b{color:#2563eb;} .u-stats > div.st-ret b{color:#d97706;} .u-stats > div.st-ok b{color:#16a34a;} .u-stats > div.st-rej b{color:#dc2626;}
  .u-stats > div[class^="st-"]{background:var(--paper);}
  .u-bar{display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:12px;background:var(--line-2);}
  .u-bar i.st-new{background:#2563eb;} .u-bar i.st-ret{background:#d97706;} .u-bar i.st-ok{background:#16a34a;} .u-bar i.st-rej{background:#dc2626;}
  @media (max-width:560px){ .u-stats{grid-template-columns:repeat(3,1fr);} }

  /* ============ foydalanuvchi sahifasi: bo'limlar ============ */
  .ua-tabs{display:flex;gap:4px;margin-left:18px;}
  .ua-tab{position:relative;display:inline-flex;align-items:center;gap:7px;border:none;background:none;color:var(--muted);font-family:var(--sans);font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;}
  .ua-tab svg{width:17px;height:17px;}
  .ua-tab:hover{background:var(--hover);color:var(--text);}
  .ua-tab.on{background:var(--accent-soft);color:var(--ink);}
  .ua-tab.on svg{color:var(--accent);}
  .ua-badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#dc2626;color:#fff;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}
  .ua-bottom{display:none;}
  .ua-req summary{list-style:none;cursor:pointer;}
  .ua-req summary::-webkit-details-marker{display:none;}
  .ua-req summary h2{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .ua-req summary h2::after{content:"▾";color:var(--muted);font-size:14px;transition:transform .2s;}
  .ua-req[open] summary h2::after{transform:rotate(180deg);}
  .ua-back{border:none;background:none;color:var(--accent-2);font-weight:700;font-size:14px;padding:4px 2px 10px;cursor:pointer;font-family:var(--sans);}
  :root[data-theme="dark"] .ua-back{color:var(--accent);}
  .ua-profile{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;max-width:1100px;margin:0 auto;}
  .ua-profile .card:first-child{grid-column:1 / -1;}
  .ua-help a{color:var(--accent-2);font-weight:700;}
  .ua-chat-wrap{max-width:820px;margin:0 auto;}
  .ua-chat-wrap .chat-body{height:calc(100vh - 260px);height:calc(100dvh - 260px);min-height:260px;}

  @media (max-width:760px){
    #userApp{padding-bottom:calc(68px + env(safe-area-inset-bottom));}
    .ua-top{padding:8px 12px;gap:8px;}
    .ua-top img{height:28px;}
    .ua-tabs,.ua-user{display:none;}
    .ua-top .icon-btn{width:38px;height:38px;}
    .ua-bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--sidebar-bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08);}
    .ua-bottom .ua-tab{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:6px 2px;margin:0;}
    .ua-bottom .ua-tab svg{width:22px;height:22px;}
    .ua-bottom .ua-badge{position:absolute;top:2px;left:calc(50% + 6px);}
    .ua-wrap{padding:12px 10px 20px;}
    #userApp .card{padding:16px 14px;border-radius:14px;}
    #userApp .card h2{font-size:16px;}
    #userApp input,#userApp select,#userApp textarea{font-size:16px;}
    #userApp .hk-form{grid-template-columns:1fr;}
    #userApp .hk-actions{flex-direction:column;}
    #userApp .hk-actions button{width:100%;min-height:48px;font-size:15px;}
    #userApp .primary{min-height:46px;}
    .ar-th,.ar-add{width:calc((100% - 24px)/4);height:auto;aspect-ratio:1;}
    .ar-slot{padding:10px;}
    .ua-profile{grid-template-columns:1fr;}
    .ua-chat-wrap .chat-body{height:calc(100dvh - 250px);}

<script>
/* ============================= UTILITIES ============================= */
// --- Kirish uchun boshlang'ich (standart) login va parol ---
// Bular faqat birinchi marta ishlatiladi. Tizimga kirgandan so'ng "Profil"
// bo'limi orqali login va parolni o'zgartirish mumkin — bunda yangi
// ma'lumotlar brauzer xotirasida (localStorage) saqlanadi va shu qurilmada
// keyingi kirishlarda ishlatiladi.
const APP_LOGIN = 'admin';
const APP_PASSWORD = 'birzum2026';
const AUTH_KEY = 'birzum_nasiya_auth';
const CREDS_KEY = 'birzum_nasiya_creds';

function getCreds(){
  try{
    const raw = localStorage.getItem(CREDS_KEY);
    if(raw){
      const c = JSON.parse(raw);
      if(c && c.login && c.password) return c;
    }
  }catch(e){}
  return {login: APP_LOGIN, password: APP_PASSWORD};
}
function setCreds(login, password){
  try{ localStorage.setItem(CREDS_KEY, JSON.stringify({login, password})); return true; }
  catch(e){ return false; }
}

// MUHIM: kirish holati ENDI faqat sessionStorage'da saqlanadi (localStorage'da
// EMAS). sessionStorage brauzer/ilova yopilganda (varaq/oyna yopilganda) avtomatik
// tozalanadi — shuning uchun ilova qayta ochilganda foydalanuvchi doim login va
// parolni qaytadan terib kirishi kerak bo'ladi. Oldingi versiyada holat
// localStorage'ga ham yozilib, u browser/kompyuter qayta ishga tushirilgandan
// keyin ham saqlanib qolar va tizim so'rovsiz ochilib ketardi — bu endi to'g'rilandi.
function isAuthed(){
  try{ return sessionStorage.getItem(AUTH_KEY) === '1'; }
  catch(e){ return false; }
}
function setAuthed(){
  try{ sessionStorage.setItem(AUTH_KEY,'1'); }catch(e){}
  // Eski versiyalarda localStorage'ga yozilgan "eslab qolingan" kirish holati
  // bo'lsa, uni ham tozalab qo'yamiz — shu qurilmada ilgari saqlanib qolgan
  // avtomatik kirish endi ishlamaydi.
  try{ localStorage.removeItem(AUTH_KEY); }catch(e){}
}
function clearAuthed(){
  try{ sessionStorage.removeItem(AUTH_KEY); localStorage.removeItem(AUTH_KEY); }catch(e){}
}

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fv(v,ph){
  const s = esc(v).trim();
  return s ? s : '<span class="ph">['+ph+']</span>';
}
function uid(){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmtDate(v){
  if(!v) return '<span class="ph">[sana]</span>';
  const iso = normalizeDateString(v);
  const parts = String(iso).split('-');
  if(parts.length===3){
    const [y,m,day] = parts;
    return esc(`${day}.${m}.${y}`);
  }
  return esc(v);
}
function pad2(n){ return String(n).padStart(2,'0'); }
function fullYear(y){
  y = parseInt(y,10);
  if(isNaN(y)) return y;
  if(y < 100) return y < 70 ? 2000+y : 1900+y; // ikki xonali yil: 00-69 -> 20xx, 70-99 -> 19xx
  return y;
}
// Turli manbalardan (Excel import, qo'lda kiritish) kelgan sana matnini
// <input type="date"> va fmtDate uchun kerakli "YYYY-MM-DD" ko'rinishiga
// keltiradi. Excel'dan matn (text) katak sifatida kelgan sanalar (masalan
// "6/23/26" yoki "23.06.2026") oldin hech qanday formatga o'girilmagani
// uchun shartnomada xato (o'girilmagan) holida chiqib qolar edi.
function normalizeDateString(v){
  const s = String(v||'').trim();
  if(!s) return s;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  // kun.oy.yil (nuqta bilan — O'zbekiston/Yevropa andozasi)
  m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);
  if(m) return `${fullYear(m[3])}-${pad2(m[1])}-${pad2(m[2])}`;
  // kun-oy-yil (chiziqcha bilan)
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m) return `${fullYear(m[3])}-${pad2(m[1])}-${pad2(m[2])}`;
  // oy/kun/yil yoki kun/oy/yil (qiya chiziq bilan) — qaysi raqam 12 dan katta
  // bo'lsa o'sha kun ekanligi aniq bo'ladi; ikkalasi ham 12 dan kichik/teng
  // bo'lsa (noaniq holat), Excel'ning standart qisqa sana andozasiga muvofiq
  // oy/kun/yil deb qabul qilinadi.
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){
    const a = parseInt(m[1],10), b = parseInt(m[2],10), y = fullYear(m[3]);
    let month, day;
    if(a>12 && b<=12){ day=a; month=b; }
    else if(b>12 && a<=12){ month=a; day=b; }
    else { month=a; day=b; }
    return `${y}-${pad2(month)}-${pad2(day)}`;
  }
  return s;
}
function todayISO(){
  // Joriy (bugungi) sanani <input type="date"> uchun kerak bo'lgan
  // YYYY-MM-DD formatida qaytaradi — brauzerning mahalliy vaqt zonasi asosida.
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

/* ============================= WORD-ANIQ SHARTNOMA DVIGATELI =============================
   Bosh kelishuv shartnomasi Word faylining (Konsalting shartnoma-UZB) o'zidan olingan
   aniq nusxa asosida chiziladi: matn, shrift (Times New Roman), razmerlar, chekinishlar,
   tab-to'xtash joylari va sahifa chegaralari (A4, Word dagi marginlar) Word dagidek.
   Sahifalarga bo'lish ham Word kabi — qator (satr) chegarasida amalga oshiriladi. */
const WL_PX_PER_TW = 1/15;           // 1 twip = 1/20 pt = 1/15 px (96 dpi)
const WL_TAB_DEFAULT = 720;          // Word: standart tab qadamlari (0.5 dyuym)

function wlEscape(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function wlFill(tpl, values){
  return tpl.html.replace(/\{\{([A-Z0-9_]+)\}\}/g, (m,k)=> wlEscape(values[k]!==undefined ? values[k] : ''));
}
function wlContentWidthTw(page){ return page.w - page.left - page.right; }
function wlContentHeightTw(page){ return page.h - page.top - page.bottom; }

// Word dagidek tab kengliklarini hisoblash: har bir tab keyingi to'xtash joyigacha cho'ziladi
// (paragrafning o'z tab-to'xtashlari, osilgan chekinish va har 720 twip standart to'xtashlar).
function wlFixTabs(root){
  root.querySelectorAll('p.wp').forEach(p=>{
    const tabs = p.querySelectorAll('span.wt');
    if(!tabs.length) return;
    const cell = p.closest('td.wcell');
    let originLeft;
    if(cell){
      const r = cell.getBoundingClientRect();
      const cs = getComputedStyle(cell);
      originLeft = r.left + parseFloat(cs.borderLeftWidth) + parseFloat(cs.paddingLeft);
    }else{
      originLeft = root.getBoundingClientRect().left;
    }
    // Word: markazlashgan/o'ngga tekislangan paragrafda ham tab joyi chapga tekislangan
    // holatdagidek hisoblanadi, so'ng butun qator markazlashtiriladi.
    const savedAlign = p.style.textAlign;
    if(savedAlign==='center' || savedAlign==='right') p.style.textAlign = 'left';
    const custom = (p.dataset.tabs||'').split(',').filter(Boolean).map(Number);
    if(p.dataset.hang) custom.push(Number(p.dataset.hang));
    custom.sort((a,b)=>a-b);
    tabs.forEach(t=>{
      t.style.display='inline-block';
      t.style.width='0px';
      const x = (t.getBoundingClientRect().left - originLeft) / WL_PX_PER_TW; // twips
      let next = custom.find(s=>s > x + 1);
      if(next===undefined){
        next = (Math.floor((x+1)/WL_TAB_DEFAULT)+1)*WL_TAB_DEFAULT;
      }
      t.style.width = ((next - x) * WL_PX_PER_TW) + 'px';
    });
    p.style.textAlign = savedAlign;
  });
}

// Qatorlar (satrlar) ro'yxatini tuzadi: har bir qator — {top,bottom,p,li,n,wc,text}.
// Sahifa faqat ikki qator orasidan bo'linadi (qator hech qachon kesilmaydi).
function wlLines(root){
  const top0 = root.getBoundingClientRect().top;
  const range = document.createRange();
  const lines = [];
  const paras = Array.from(root.querySelectorAll('p.wp'));
  paras.forEach((p, pi)=>{
    const rects = [];
    let hasText = false;
    const walker = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
    let n;
    while((n = walker.nextNode())){
      if(!n.nodeValue) continue;
      if(n.nodeValue.replace(/[\u200b\s]/g,'')) hasText = true;
      range.selectNodeContents(n);
      for(const r of range.getClientRects()){
        if(r.height <= 0) continue;
        rects.push([r.top - top0, r.bottom - top0]);
      }
    }
    if(!rects.length){
      const r = p.getBoundingClientRect();
      rects.push([r.top - top0, r.bottom - top0]);
    }
    rects.sort((a,b)=>a[0]-b[0]);
    const pl = [];
    for(const [t,b] of rects){
      const last = pl[pl.length-1];
      if(last && t < last[1] - 1){ if(b > last[1]) last[1] = b; }
      else pl.push([t,b]);
    }
    // birinchi qatorga paragrafning yuqori bo'shlig'i (spacing before) ham qo'shiladi
    const pr = p.getBoundingClientRect();
    const inTable = !!p.closest('table.wtbl');
    pl.forEach((ln, li)=>{
      lines.push({top: ln[0], bottom: ln[1], p: pi, li, n: pl.length, wc: p.dataset.wc==='1' && !inTable,
                  inTable, text: hasText});
    });
  });
  // Jadval qatorlarini bitta "blok" sifatida qo'shamiz (chegara chiziqlari kesilmasin)
  root.querySelectorAll('table.wtbl tr').forEach(tr=>{
    const r = tr.getBoundingClientRect();
    lines.push({top: r.top - top0, bottom: r.bottom - top0, p: -1, li: 0, n: 1, wc: false, row: true, text: true});
  });
  lines.sort((a,b)=>a.top-b.top || a.bottom-b.bottom);
  return lines;
}

function wlComputeCuts(root, page){
  const H = wlContentHeightTw(page) * WL_PX_PER_TW;
  const lines = wlLines(root);
  // matnli oxirgi qator — undan keyingi bo'sh paragraflar alohida sahifa ochmaydi
  const lastText = lines.filter(l=>l.text).reduce((m,l)=>Math.max(m,l.bottom), 0);
  const total = Math.max(lastText, 1);
  const cuts = [0];
  let start = 0;
  let guard = 0;
  while(total - start > H + 0.5 && guard++ < 100){
    // shu sahifaga to'liq sig'adigan oxirgi qator
    let idx = -1;
    for(let i=0;i<lines.length;i++){
      const l = lines[i];
      if(l.top < start - 0.5) continue;
      if(l.bottom - start <= H + 0.5) idx = i; else break;
    }
    if(idx < 0){ cuts.push(start + H); start += H; continue; }
    let cutLine = lines[idx];
    // Word: "osilib qolgan qator" (widow/orphan) nazorati — paragraf bo'linsa,
    // har ikki sahifada kamida 2 qatordan qolishi kerak.
    const nxt = lines.slice(idx+1).find(l=>l.top >= cutLine.bottom - 0.5);
    if(nxt && nxt.p === cutLine.p && cutLine.p >= 0 && cutLine.wc){
      const k = cutLine.li + 1, m = cutLine.n - k;
      let keep = k;
      if(m < 2) keep = Math.min(keep, cutLine.n - 2);
      if(keep < 2) keep = 0;
      if(keep !== k){
        const sameP = lines.filter(l=>l.p === cutLine.p).sort((a,b)=>a.li-b.li);
        if(keep === 0){
          // butun paragraf keyingi sahifaga — uning oldidagi qatordan kesamiz
          const firstTop = sameP[0].top;
          const prev = lines.filter(l=>l.bottom <= firstTop + 0.5 && l.top >= start - 0.5);
          if(prev.length) cutLine = prev.reduce((a,b)=>b.bottom > a.bottom ? b : a);
        }else{
          cutLine = sameP[keep-1];
        }
      }
    }
    let cut = cutLine.bottom;
    if(cut <= start + 1) cut = start + H;
    cuts.push(cut);
    start = cut;
  }
  cuts.push(Math.max(total, start + 1));
  return cuts;
}

// Asosiy funksiya: shablonni to'ldirib, Word sahifalari ko'rinishidagi DOM elementlarini qaytaradi.
async function wlRenderPages(tpl, values){
  const page = tpl.page;
  const html = wlFill(tpl, values);
  const measure = document.createElement('div');
  measure.className = 'wl-doc wl-measure';
  measure.style.width = (wlContentWidthTw(page) * WL_PX_PER_TW) + 'px';
  measure.innerHTML = html;
  document.body.appendChild(measure);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    wlFixTabs(measure);
    const cuts = wlComputeCuts(measure, page);
    const fixedHtml = measure.innerHTML;
    const pages = [];
    for(let i=0;i<cuts.length-1;i++){
      const pg = document.createElement('div');
      pg.className = 'wl-page';
      pg.style.width = (page.w * WL_PX_PER_TW) + 'px';
      pg.style.height = (page.h * WL_PX_PER_TW) + 'px';
      const clip = document.createElement('div');
      clip.className = 'wl-clip';
      clip.style.left = (page.left * WL_PX_PER_TW) + 'px';
      // Keyingi sahifalarda oldingi qatorning pastki uchlari (g, y, q) ko'rinib
      // qolmasligi uchun yuqoridan 2px yashiriladi (u joy qator orasidagi bo'shliq).
      const trim = i > 0 ? 2 : 0;
      clip.style.top = (page.top * WL_PX_PER_TW + trim) + 'px';
      clip.style.width = (wlContentWidthTw(page) * WL_PX_PER_TW + 40) + 'px';
      clip.style.height = (cuts[i+1] - cuts[i] - trim) + 'px';
      const flow = document.createElement('div');
      flow.className = 'wl-doc';
      flow.style.width = (wlContentWidthTw(page) * WL_PX_PER_TW) + 'px';
      flow.style.top = (-cuts[i] - trim) + 'px';
      flow.innerHTML = fixedHtml;
      clip.appendChild(flow);
      pg.appendChild(clip);
      pages.push(pg);
    }
    return pages;
  }finally{
    document.body.removeChild(measure);
  }
}

/* ============================= BOSH KELISHUV — WORD SHABLONI ASOSIDA ============================= */
// Bosh kelishuv endi qo'lda yozilgan HTML matndan EMAS, balki aynan
// «Konsalting shartnoma-UZB 07.05.2026.docx» faylining o'zidan yasaladi:
//  • Word (.docx) — asl fayl ichidagi 13 ta birlashtirish (MERGEFIELD) maydoni
//    o'rniga forma ma'lumotlari qo'yiladi; qolgan hammasi (matn, shrift, jadval,
//    chekinishlar, sahifa o'lchami) asl fayldagidek, bitta harf ham o'zgarmaydi.
//  • Ko'rinish va PDF — o'sha fayldan olingan aniq nusxa (BOSH_TPL) Word kabi
//    sahifalarga bo'lib chiziladi (Times New Roman, Word qator balandligi,
//    Word sahifa chegaralari va "osilib qolgan qator" qoidasi bilan).
function boshPlainDate(v){
  if(!v) return '';
  const iso = normalizeDateString(v);
  const p = String(iso).split('-');
  if(p.length===3) return `${p[2]}.${p[1]}.${p[0]}`;
  return String(v);
}
// "XOJAMURATOV SAPARMURAT DUYSENBAEVICH" -> "S.D.Xojamuratov" (Word dagi Раҳбар2 maydoni)
function boshShortName(fish){
  const t = String(fish||'').trim().split(/\s+/).filter(Boolean);
  if(!t.length) return '';
  const cap = w => w.charAt(0).toLocaleUpperCase('uz') + w.slice(1).toLocaleLowerCase('uz');
  const ini = w => {
    const m = w.match(/^(sh|ch|ng|[og][‘'ʻ’`])/i);
    const head = m ? m[0] : w.charAt(0);
    return cap(head) + '.';
  };
  if(t.length===1) return cap(t[0]);
  return ini(t[1]) + (t[2] ? ini(t[2]) : '') + cap(t[0]);
}
function boshValues(d){
  const r = String(d.rahbar||'').trim();
  // "Раҳбар (qisqa)" maydoniga "S.D.Xojamuratov" ko'rinishida yozilgan bo'lsa — o'shani olamiz
  const shortFromField = /^\S{1,3}\.\s?\S{1,3}\.\s?\S+/.test(r) ? r : '';
  return {
    NOMER: d.shartnoma_raqami||'',
    SANA: d.shartnoma_sanasi ? boshPlainDate(d.shartnoma_sanasi)+' yil' : '',
    TASHKILOT: d.tashkilot_nomi||'',
    RAHBAR: d.rahbar_fish||'',
    MANZIL: d.manzil||'',
    HR: d.hisob_raqami||'',
    MFO: d.mfo||'',
    BANK: d.bank_nomi||'',
    STIR: d.stir||'',
    TELEFON: d.telefon_raqami||'',
    TELEGRAM: d.telegram_user||'',
    RAHBAR2: shortFromField || boshShortName(d.rahbar_fish),
  };
}

function resetPreviewHost(el){
  if(el){ el.className = 'paper'; }
}
// Ko'rinish oynasida Word sahifalarini (A4) kichraytirib ko'rsatadi
async function renderBoshPreview(previewEl, d){
  if(!previewEl) return;
  previewEl.className = 'wl-host';
  previewEl.innerHTML = '<div class="empty-preview">Hujjat tayyorlanmoqda…</div>';
  const pages = await wlRenderPages(BOSH_TPL, boshValues(d));
  previewEl.innerHTML = '';
  const shell = previewEl.parentElement;
  const avail = Math.max(200, (shell ? shell.clientWidth - 36 : 600));
  const pw = BOSH_TPL.page.w * WL_PX_PER_TW, ph = BOSH_TPL.page.h * WL_PX_PER_TW;
  const scale = Math.min(1, avail / pw);
  pages.forEach((pg, i)=>{
    const wrap = document.createElement('div');
    wrap.className = 'wl-pv';
    wrap.style.width = (pw*scale)+'px';
    wrap.style.height = (ph*scale)+'px';
    pg.style.transform = `scale(${scale})`;
    pg.style.transformOrigin = '0 0';
    wrap.appendChild(pg);
    previewEl.appendChild(wrap);
  });
}

// Umumiy ko'rinish chizuvchi: bosh kelishuv — Word shabloni, qolganlari — avvalgidek
async function showPreview(key, d, kind){
  const previewEl = document.getElementById('preview_'+key);
  if(!previewEl) return;
  if(key==='bosh') return renderBoshPreview(previewEl, d);
  resetPreviewHost(previewEl);
  previewEl.innerHTML = docBuilder(key, d, kind);
}

// PDF: har bir Word sahifasi alohida rasmga olinadi va asl sahifa o'lchamida
// (595 x 842.5 pt — Word faylidagi 11900 x 16850 twip) PDF ga joylanadi.
async function exportBoshPdf(d, filename, sectionKey){
  const page = BOSH_TPL.page;
  const pages = await wlRenderPages(BOSH_TPL, boshValues(d));
  const holder = document.createElement('div');
  holder.className = 'pdf-offscreen';
  pages.forEach(p=>holder.appendChild(p));
  document.body.appendChild(holder);
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const { jsPDF } = window.jspdf;
    const wPt = page.w/20, hPt = page.h/20;
    const pdf = new jsPDF({orientation:'p', unit:'pt', format:[wPt, hPt], compress:true});
    for(let i=0;i<pages.length;i++){
      const canvas = await html2canvas(pages[i], {scale:2.5, backgroundColor:'#ffffff', useCORS:true, logging:false});
      const img = canvas.toDataURL('image/png');
      if(i>0) pdf.addPage([wPt, hPt], 'p');
      pdf.addImage(img, 'PNG', 0, 0, wPt, hPt, undefined, 'SLOW');
    }
    const blob = pdf.output('blob');
    const savedToFolder = await saveBlobToFolder(blob, filename, sectionKey);
    if(!savedToFolder) pdf.save(filename);
  }finally{
    document.body.removeChild(holder);
  }
}

// Word: asl .docx fayl ichidagi maydonlarni to'ldirib, haqiqiy .docx qaytaradi
function boshXmlEsc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
async function buildBoshDocxBlob(d){
  if(typeof JSZip === 'undefined') throw new Error('JSZip kutubxonasi yuklanmadi. Internet aloqasini tekshirib, sahifani qayta yuklang.');
  const zip = await JSZip.loadAsync(BOSH_DOCX_B64, {base64:true});
  const vals = boshValues(d);
  let xml = await zip.file('word/document.xml').async('string');
  xml = xml.replace(/\{\{([A-Z0-9_]+)\}\}/g, (m,k)=> boshXmlEsc(vals[k]!==undefined ? vals[k] : ''));
  zip.file('word/document.xml', xml);
  return zip.generateAsync({type:'blob', compression:'DEFLATE',
    mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
async function exportBoshDocx(d, filename, sectionKey){
  const blob = await buildBoshDocxBlob(d);
  const savedToFolder = await saveBlobToFolder(blob, filename, sectionKey);
  if(!savedToFolder){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }
}
