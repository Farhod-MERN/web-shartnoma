function uDocSlotMarkup(d){
  const files = uDraft.files.filter(f=>f.docType===d.k);
  const need = !d.min ? '<span class="opt">(ixtiyoriy)</span>' : (d.min ? ` <span style="color:var(--danger)">*</span>${d.min>1?` <span class="opt">(kamida ${d.min} ta)</span>`:''}` : '');
  const ok = d.min ? files.length >= d.min : null;
  return `<div class="ar-slot ${ok===false?'need':''} ${ok?'ok':''}" data-slot="${d.k}">
    <div class="ar-slot-head"><div><b>${esc(d.t)}</b> ${need}${d.hint?`<div class="hint">${esc(d.hint)}</div>`:''}</div>
      <span class="ar-slot-cnt" data-noi18n>${files.length}${d.min>1?' / '+d.min:''}</span></div>
    <div class="ar-thumbs">${files.map((f,i)=>`<div class="ar-th" data-noi18n>${f.thumbUrl?`<img src="${f.thumbUrl}" alt="">`:`<span class="ext ${/pdf/i.test(f.type)?'pdf':''}">${esc(hfExt(f))}</span>`}
        <button type="button" class="ar-th-x" data-rm="${d.k}:${uDraft.files.indexOf(f)}" title="Olib tashlash">✕</button><div class="ar-th-name">${esc(f.name)}</div></div>`).join('')}
      <label class="ar-add" title="Fayl qo‘shish">＋<input type="file" data-add="${d.k}" multiple accept="image/*,.pdf" ${d.k==='selfi'?'capture="user"':''} style="display:none;"></label>
    </div>
  </div>`;
}
function uCollectData(){
  AR_FIELDS.forEach(([k])=>{ const el = document.getElementById('ar_'+k); if(el) uDraft.data[k] = el.value.trim(); });
}
function bindUForm(){
  uDraft.files.forEach(f=>{
    if(!f.thumbUrl && /^image\//.test(f.type)){
      const b = f.blob || arBlobCache.get(f.id);
      if(b){ f.thumbUrl = URL.createObjectURL(b); }
      else if(f.id){ arFileBlob(f).then(bl=>{ f.thumbUrl = URL.createObjectURL(bl); if(uView==='form'){ uCollectData(); renderUserApp(); } }).catch(()=>{}); }
    }
  });
  const tel = document.getElementById('ar_telefon_raqami');
  if(tel){ if(!tel.value) tel.value = '+998 '; tel.addEventListener('input', ()=>{ tel.value = formatUzPhone(tel.value); }); }
  const geo = document.getElementById('arGeo');
  if(geo) geo.onclick = ()=>{
    const st = document.getElementById('arStatus');
    if(!navigator.geolocation){ st.className='status err'; st.textContent='Brauzer joylashuvni aniqlay olmaydi — xarita havolasini qo‘lda kiriting.'; return; }
    geo.disabled = true; st.className='status'; st.textContent='Joylashuv aniqlanmoqda…';
    navigator.geolocation.getCurrentPosition(p=>{
      const {latitude, longitude} = p.coords;
      document.getElementById('ar_lokatsiya').value = `https://maps.google.com/?q=${latitude.toFixed(6)},${longitude.toFixed(6)}`;
      geo.disabled = false; st.className='status ok'; st.textContent='Joylashuv yozildi.';
    }, err=>{ geo.disabled = false; st.className='status err'; st.textContent='Joylashuvni aniqlab bo‘lmadi (ruxsat berilmagan bo‘lishi mumkin). Havolani qo‘lda kiriting.'; }, {enableHighAccuracy:true, timeout:15000});
  };
  document.querySelectorAll('[data-add]').forEach(inp=>{
    inp.onchange = async ()=>{
      const k = inp.dataset.add; const files = Array.from(inp.files||[]);
      uCollectData();
      const st = document.getElementById('arStatus');
      for(const file of files){
        if(!/^image\/|pdf/i.test(file.type) && !/\.pdf$/i.test(file.name)){ st.className='status err'; st.textContent='Faqat rasm yoki PDF yuklash mumkin: '+file.name; continue; }
        let f = await hfCompressImage(file);
        if(f.size > AR_MAX_FILE){ st.className='status err'; st.textContent='«'+file.name+'» juda katta (10 MB dan oshmasin).'; continue; }
        const item = {docType:k, name:f.name, type:f.type||'application/octet-stream', size:f.size, blob:f, isNew:true};
        if(/^image\//.test(item.type)) item.thumbUrl = URL.createObjectURL(f);
        uDraft.files.push(item);
      }
      renderUserApp();
    };
  });
  document.querySelectorAll('[data-rm]').forEach(b=> b.onclick = ()=>{
    uCollectData();
    const idx = Number(b.dataset.rm.split(':')[1]);
    const f = uDraft.files[idx];
    if(f && f.id && !f.isNew) uDraft.removed.push(f);
    uDraft.files.splice(idx,1);
    renderUserApp();
  });
  document.getElementById('arCancel').onclick = ()=>{ uView = uDraft && uDraft.id ? 'view' : 'list'; uCurrentId = uDraft && uDraft.id || null; renderUserApp(); };
  document.getElementById('arForm').onsubmit = (e)=>{ e.preventDefault(); uSubmit(); };
}
function arValidate(data, files){
  const miss = [];
  AR_FIELDS.forEach(([k,l,t,req])=>{ if(req && !String(data[k]||'').trim()) miss.push(l); });
  const cnt = k=> files.filter(f=>f.docType===k).length;
  AR_DOCS.forEach(d=>{ if(d.min && cnt(d.k) < d.min) miss.push(d.t + (d.min>1 ? ` (kamida ${d.min} ta, hozir ${cnt(d.k)} ta)` : '')); });
  return miss;
}
async function uSubmit(){
  uCollectData();
  const st = document.getElementById('arStatus');
  const btn = document.getElementById('arSubmit');
  const miss = arValidate(uDraft.data, uDraft.files);
  if(miss.length){ st.className='status err'; st.innerHTML = '<b>Quyidagilar to‘ldirilmagan:</b><br>• ' + miss.map(esc).join('<br>• '); return; }
  const u = getUserSession();
  btn.disabled = true;
  try{
    const isEdit = !!uDraft.id;
    const prev = isEdit ? uArizalar.find(a=>a.id===uDraft.id) : null;
    const id = isEdit ? uDraft.id : 'a' + uid();
    const metas = [];
    const newOnes = uDraft.files.filter(f=>f.isNew);
    let done = 0;
    for(const f of uDraft.files){
      if(f.isNew){
        st.className='status'; st.textContent = `Fayllar yuklanmoqda: ${++done} / ${newOnes.length} …`;
        const fid = 'f' + uid();
        const chunks = await arSaveFile(fid, f.blob);
        metas.push({id:fid, docType:f.docType, name:f.name, type:f.type, size:f.size, chunks, addedAt:new Date().toISOString()});
      }else{
        metas.push({id:f.id, docType:f.docType, name:f.name, type:f.type, size:f.size, chunks:f.chunks, addedAt:f.addedAt});
      }
    }
    for(const r of uDraft.removed) await arDeleteFile(r);
    const now = new Date().toISOString();
    const status = isEdit ? 'qayta' : 'yangi';
    const history = (prev && prev.history ? prev.history.slice() : []);
    history.push({at:now, by:'user', name:u.ism||u.login, status, izoh: isEdit ? 'Tuzatilib qayta yuborildi' : 'Ariza yuborildi'});
    const doc = {
      userId:u.id, userLogin:u.login, userIsm:u.ism, userTelefon:u.telefon,
      status, adminIzoh: prev ? (prev.adminIzoh||'') : '', data: Object.assign({}, uDraft.data), files: metas, history,
      createdAt: prev ? prev.createdAt : now, updatedAt: now,
    };
    await ST.set(AR_COL, id, doc);
    const cloud = await arIsCloud();
    uDraft = null; uView = 'view'; uCurrentId = id;
    await uRefresh();
    const st2 = document.getElementById('uaFlash');
    if(st2){ st2.className = 'ua-flash ok'; st2.textContent = cloud ? '✅ Ariza adminga yuborildi. Holatini shu sahifada kuzatib borishingiz mumkin.' : '⚠ Ariza saqlandi, lekin internet (bulut) ulanmagani uchun hozircha faqat shu qurilmada turibdi.'; setTimeout(()=>{ st2.className='ua-flash'; st2.textContent=''; }, 8000); }
  }catch(e){
    console.error(e); btn.disabled = false;
    st.className='status err'; st.textContent = 'Yuborishda xatolik: ' + (e && e.message ? e.message : e) + '. Internetni tekshirib, qayta urinib ko‘ring.';
  }
}

async function arHydrateFiles(root, a){
  root.querySelectorAll('img[data-lazy]').forEach(async img=>{
    const meta = (a.files||[]).find(f=>f.id===img.dataset.lazy); if(!meta) return;
    try{ const b = await arFileBlob(meta); img.src = URL.createObjectURL(b); }catch(e){ img.alt = '⚠'; }

async function arAdminLoad(silent){
  try{
    AR_CACHE = (await ST.all(AR_COL)).sort((a,b)=> String(b.updatedAt||b.createdAt).localeCompare(String(a.updatedAt||a.createdAt)));
    arLoaded = true;
    const pend = AR_CACHE.filter(a=>a.status==='yangi'||a.status==='qayta');
    const keyOf = a=> a.id+'@'+(a.updatedAt||a.createdAt);
    if(arSeenPending===null){
      arSeenPending = new Set(pend.map(keyOf));
      if(pend.length) showToast({icon:'📨', title:`${pend.length} ta ariza ko‘rib chiqilishini kutmoqda`, body:'Arizalar bo‘limini oching', onClick:()=>{ activeTab='arizalar'; renderApp(); }});
    }else{
      pend.filter(a=>!arSeenPending.has(keyOf(a))).forEach(a=>{

        showToast({icon:'📨', title:(a.status==='qayta'?'Tuzatilgan ariza: ':'Yangi ariza: ') + (a.userIsm||''), time:msgTime(a.updatedAt||a.createdAt), body:a.data&&a.data.tashkilot_nomi||'', onClick:()=>{ arSelId=a.id; activeTab='arizalar'; renderApp(); }});

async function arDecide(a, status){
  const st = document.getElementById('arDecideStatus');
  const izoh = document.getElementById('arIzoh').value.trim();
  if((status==='qaytarildi' || status==='rad') && !izoh){ st.className='status err'; st.textContent = status==='qaytarildi' ? 'Qaytarish uchun kamchiliklarni izohga yozing.' : 'Rad etish sababini izohga yozing.'; return; }
  const q = {qabul:'Ariza qabul qilinsin va hamkor «Hamkorlar» ro‘yxatiga (fayllari bilan) qo‘shilsinmi?', qaytarildi:'Ariza tuzatish uchun foydalanuvchiga qaytarilsinmi?', rad:'Ariza rad etilsinmi?'}[status];
  if(!confirm(q)) return;
  document.querySelectorAll('.ar-decide button').forEach(b=>b.disabled = true);
  try{
    const now = new Date().toISOString();
    const upd = Object.assign({}, a);
    upd.status = status; upd.adminIzoh = izoh; upd.updatedAt = now;
    upd.history = (a.history||[]).concat([{at:now, by:'admin', status, izoh}]);
    if(status==='qabul'){
      st.className='status'; st.textContent='Hamkorlar ro‘yxatiga qo‘shilmoqda…';
      upd.hamkorId = await arCreateHamkor(a, (m)=>{ st.textContent = m; });
    }
    await ST.set(AR_COL, a.id, upd);
    Object.assign(a, upd);
    try{
      const nm = a.data && a.data.tashkilot_nomi || 'arizangiz';
      const txt = {qabul:`✅ «${nm}» bo‘yicha arizangiz qabul qilindi. Tez orada shartnoma bo‘yicha siz bilan bog‘lanamiz.`,
                   qaytarildi:`↩ «${nm}» bo‘yicha arizangiz tuzatish uchun qaytarildi.`,
                   rad:`✕ «${nm}» bo‘yicha arizangiz rad etildi.`}[status] + (izoh ? `\nIzoh: ${izoh}` : '');
      await msgSend(a.userId, 'admin', txt, {userIsm:a.userIsm, system:true, arizaId:a.id});
    }catch(e){ console.error('Xabar yuborilmadi', e); }
    st.className='status ok';
    st.textContent = {qabul:'Ariza qabul qilindi. Hamkor ro‘yxatga qo‘shildi — endi Bosh shartnoma bo‘limida STIR orqali shartnoma tuzishingiz mumkin.', qaytarildi:'Ariza foydalanuvchiga tuzatish uchun qaytarildi.', rad:'Ariza rad etildi.'}[status];
    const keep = st.textContent;
    renderTabs(); renderArList(); renderArDetail();
    const st2 = document.getElementById('arDecideStatus'); if(st2){ st2.className='status ok'; st2.textContent = keep; }
  }catch(e){
    console.error(e);
    st.className='status err'; st.textContent = 'Xatolik: ' + (e && e.message ? e.message : e);
    document.querySelectorAll('.ar-decide button').forEach(b=>b.disabled = false);
  }
}
async function arCreateHamkor(a, progress){
  const d = a.data || {};
  const map = {tashkilot_nomi:d.tashkilot_nomi, stir:d.stir, brend:d.brend, rahbar_fish:d.rahbar_fish, telefon_raqami:d.telefon_raqami,
               manzil:d.manzil, lokatsiya:d.lokatsiya, hisob_raqami:d.hisob_raqami, mfo:d.mfo, bank_nomi:d.bank_nomi};
  let rec = DB.hamkor.find(r=> String((r.data&&r.data.stir)||'').trim() === String(d.stir||'').trim() && d.stir);
  if(rec){
    Object.keys(map).forEach(k=>{ if(map[k] && !String(rec.data[k]||'').trim()) rec.data[k] = map[k]; });
  }else{
    const data = {no: nextSequenceNumber('hamkor')};
    Object.keys(map).forEach(k=>{ data[k] = map[k] || ''; });
    rec = {id:uid(), kind:'main', data, createdAt:new Date().toISOString(), fromAriza:a.id};
    DB.hamkor.push(rec);
  }
  persist('hamkor');
  const files = a.files || [];
  let n = 0;
  for(const f of files){
    progress && progress(`Fayllar hamkorga ko‘chirilmoqda: ${++n} / ${files.length}`);
    try{
      const blob = await arFileBlob(f);
      const label = (AR_DOCS.find(x=>x.k===f.docType)||{t:f.docType}).t.split(' — ')[0].split(' (')[0];
      await hfAdd(rec, new File([blob], label + ' - ' + f.name, {type:f.type}));
    }catch(e){ console.error('Fayl ko‘chirilmadi', f.name, e); }
  }
  rec.fileCount = (rec.fileCount||0) + n;
  persist('hamkor');
  return rec.id;
}

  });

    e.preventDefault();
    const st = document.getElementById('upStatus');
    const err = t=>{ st.className='status err'; st.textContent=t; };
    const ism = document.getElementById('upIsm').value.trim();
    const telefon = document.getElementById('upTel').value.trim();
    const login = document.getElementById('upLogin').value.trim();
    const p1 = document.getElementById('upPass').value, p2 = document.getElementById('upPass2').value;
    const cur = document.getElementById('upCur').value;
    if(ism.length<3) return err('Ism va familiyani to‘liq kiriting.');
    if(telefon.replace(/\D/g,'').length<12) return err('Telefon raqamini to‘liq kiriting.');
    if(!/^[a-zA-Z0-9_.]{3,32}$/.test(login)) return err('Login 3–32 ta lotin harfi, raqam, «_» yoki «.» dan iborat bo‘lsin.');
    if(p1 && p1.length<6) return err('Yangi parol kamida 6 ta belgidan iborat bo‘lsin.');
    if(p1 !== p2) return err('Yangi parollar bir-biriga mos emas.');
    st.className='status'; st.textContent='Saqlanmoqda…';
    try{
      const me = await ST.get(AR_USERS, u.id);
      if(!me) return err('Akkaunt topilmadi.');
      if(arHashPass(cur, me.salt) !== me.hash) return err('Joriy parol noto‘g‘ri.');
      if(login.toLowerCase() !== me.loginLower){
        if(login.toLowerCase()===String(getCreds().login).toLowerCase()) return err('Bu login band.');
        const ex = await arFindUser(login); if(ex && ex.id!==me.id) return err('Bu login band.');
      }
      me.ism = ism; me.telefon = telefon; me.login = login; me.loginLower = login.toLowerCase();
      if(p1){ me.salt = uid()+uid(); me.hash = arHashPass(p1, me.salt); me.passChangedAt = new Date().toISOString(); }
      await ST.set(AR_USERS, me.id, me);

  i18nApply(host);
}


/* ============================= XABARLAR (admin ⇄ foydalanuvchi) =============================
   Har bir xabar «birzum_messages» to'plamida alohida hujjat: kimga tegishli (userId),
   kim yozgan (from: admin | user), matn, vaqt va o'qilganlik belgilari. */
const MSG_COL = 'birzum_messages';
const ADMIN_CONTACT = {telegram:'@birzumadmin', phone:'+998 94 007 04 52', phoneRaw:'+998940070452'};
function blockedNoticeHtml(){
  return `Akkauntingiz faol emas. Iltimos, adminga murojaat qiling:<br>
    <a href="https://t.me/${ADMIN_CONTACT.telegram.slice(1)}" target="_blank" rel="noopener">Telegram: ${ADMIN_CONTACT.telegram}</a> ·
    <a href="tel:${ADMIN_CONTACT.phoneRaw}">${ADMIN_CONTACT.phone}</a>`;
}
async function msgSend(userId, from, text, extra){
  const now = new Date().toISOString();
  const id = 'm' + Date.now().toString(36) + uid().slice(0,6);
  const doc = Object.assign({userId, from, text: String(text).slice(0,4000), at: now,
    readByAdmin: from==='admin', readByUser: from==='user'}, extra||{});
  await ST.set(MSG_COL, id, doc);
  return Object.assign({id}, doc);
}
async function msgThread(userId){
  const l = await ST.where(MSG_COL, 'userId', userId);
  return l.sort((a,b)=> String(a.at).localeCompare(String(b.at)));
}
async function msgMarkRead(list, side){
  const field = side==='admin' ? 'readByAdmin' : 'readByUser';
  const other = side==='admin' ? 'user' : 'admin';
  for(const m of list){
    if(m.from===other && !m[field]){ m[field] = true; try{ await ST.set(MSG_COL, m.id, m); }catch(e){} }
  }
}
function msgTime(iso){
  const d = new Date(iso); if(isNaN(d)) return '';
  const today = new Date();
  const hm = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  if(d.toDateString()===today.toDateString()) return hm;
  return `${pad2(d.getDate())}.${pad2(d.getMonth()+1)}.${d.getFullYear()} ${hm}`;
}
function linkify(t){
  return esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
}
function chatMarkup(list, side, title, sub){
  const mine = side;
  return `<div class="chat">
    <div class="chat-head"><div class="ar-av sm">${side==='user'?'A':esc(String(title||'?').charAt(0).toUpperCase())}</div>
      <div><b data-noi18n>${esc(title)}</b>${sub?`<div class="hk-sub" data-noi18n>${sub}</div>`:''}</div></div>
    <div class="chat-body" id="chatBody">
      ${list.length ? list.map(m=>`
        <div class="msg ${m.from===mine?'me':'them'} ${m.system?'sys':''}" data-noi18n>
          <div class="bubble">${linkify(m.text)}</div>
          <div class="meta">${m.from==='admin' ? 'Admin' : esc(m.userIsm||'Foydalanuvchi')} · ${msgTime(m.at)}${m.from===mine ? (((side==='admin'?m.readByUser:m.readByAdmin)) ? ' · ✓✓' : ' · ✓') : ''}</div>
        </div>`).join('') : `<div class="chat-empty">Hozircha xabar yo‘q. Birinchi xabarni yozing.</div>`}
    </div>
    <form class="chat-input" id="chatForm" autocomplete="off">
      <textarea id="chatText" rows="1" placeholder="Xabar yozing…"></textarea>
      <button type="submit" class="primary" id="chatSend" title="Yuborish">➤</button>
    </form>
  </div>`;
}
function bindChat(onSend){
  const body = document.getElementById('chatBody'); if(body) body.scrollTop = body.scrollHeight;
  const ta = document.getElementById('chatText'); const f = document.getElementById('chatForm');
  if(!ta || !f) return;
  const grow = ()=>{ ta.style.height='auto'; ta.style.height = Math.min(140, ta.scrollHeight)+'px'; };
  ta.addEventListener('input', grow);
  ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && window.innerWidth > 760){ e.preventDefault(); f.requestSubmit(); } });
  f.onsubmit = async (e)=>{
    e.preventDefault();
    const txt = ta.value.trim(); if(!txt) return;
    const btn = document.getElementById('chatSend'); btn.disabled = true;
    try{ await onSend(txt); ta.value = ''; grow(); }
    catch(err){ alert('Xabar yuborilmadi: ' + (err && err.message ? err.message : err)); }
    finally{ btn.disabled = false; }
  };
}

function showToast(opts){
  let box = document.getElementById('toastBox');
  if(!box){ box = document.createElement('div'); box.id = 'toastBox'; document.body.appendChild(box); }
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="toast-ic">${opts.icon||'💬'}</div><div class="toast-tx"><b data-noi18n>${esc(opts.title||'')}</b>${opts.time?`<span class="toast-time" data-noi18n>${esc(opts.time)}</span>`:''}${opts.body?`<div class="toast-body" data-noi18n>${esc(opts.body)}</div>`:''}</div><button type="button" class="toast-x">✕</button>`;
  el.querySelector('.toast-x').onclick = (e)=>{ e.stopPropagation(); el.remove(); };
  el.onclick = ()=>{ el.remove(); if(opts.onClick) opts.onClick(); };
  box.appendChild(el);
  setTimeout(()=> el.classList.add('show'), 10);
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 300); }, opts.ttl || 9000);
  try{
    if(document.hidden && 'Notification' in window && Notification.permission==='granted'){
      const n = new Notification(opts.title || 'BirZum Nasiya', {body: (opts.time?opts.time+' — ':'') + (opts.body||''), icon: FAVICON_DATA});
      n.onclick = ()=>{ window.focus(); if(opts.onClick) opts.onClick(); n.close(); };
    }
  }catch(e){}
}
function askNotifyPermission(){
  try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
}

function setTitleBadge(n){ document.title = n ? `(${n}) ${baseTitle}` : baseTitle; }

/* ============================= ADMIN: FOYDALANUVCHILAR BO'LIMI ============================= */
let USERS_CACHE = [];
let usersLoaded = false;
let usersSelId = null;
let usersQuery = '';
let usersFilter = 'all';
let adminUnread = {};          // userId -> o'qilmagan xabarlar soni
let adminSeenMsg = null;       // bildirishnoma ko'rsatilgan xabarlar
let adminMsgTimer = null;
function adminUnreadTotal(){ return Object.values(adminUnread).reduce((a,b)=>a+b,0); }

async function adminPollMessages(){
  let unread = [];
  try{ unread = (await ST.where(MSG_COL, 'readByAdmin', false)).filter(m=>m.from==='user'); }catch(e){ return; }
  const map = {}; unread.forEach(m=>{ map[m.userId] = (map[m.userId]||0)+1; });
  adminUnread = map;
  const first = adminSeenMsg === null;
  if(first) adminSeenMsg = new Set();
  const fresh = unread.filter(m=>!adminSeenMsg.has(m.id)).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  fresh.forEach(m=> adminSeenMsg.add(m.id));
  if(first && fresh.length){
    showToast({icon:'💬', title:`${fresh.length} ta o‘qilmagan xabar`, body:'Foydalanuvchilar bo‘limida ko‘ring', onClick:()=>openUsersPage(fresh[fresh.length-1].userId)});
  }else{
    fresh.slice(-3).forEach(m=> showToast({icon:'💬', title:m.userIsm||'Foydalanuvchi', time:msgTime(m.at), body:m.text, onClick:()=>openUsersPage(m.userId)}));
  }
  setTitleBadge(adminUnreadTotal() + arPendingCount());
  renderTabs();
  if(activeTab==='users'){
    renderUsersList();
    if(usersSelId && map[usersSelId] && document.getElementById('chatBody')) renderUserDetail(true);
  }
}
function startAdminMsgPolling(){
  clearInterval(adminMsgTimer);
  adminPollMessages();
  adminMsgTimer = setInterval(()=>{ if(document.getElementById('mainApp').style.display!=='none') adminPollMessages(); }, 20000);
}
function openUsersPage(userId){
  usersSelId = userId || usersSelId;
  activeTab = 'users'; UI.lastTab = 'users'; saveUiPrefs();
  closeMobileSidebar(); renderApp(); window.scrollTo(0,0);
}
async function usersLoad(){
  try{ USERS_CACHE = (await ST.all(AR_USERS)).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))); usersLoaded = true; }
  catch(e){ const s = document.getElementById('usersStatus'); if(s){ s.className='status err'; s.textContent='Foydalanuvchilarni yuklab bo‘lmadi: '+(e.message||e); } }

}
function usersMarkup(){
  const chips = [['all','Hammasi'],['active','Faol'],['blocked','Nofaol'],['unread','Yangi xabar']];
  return `<div class="hk-grid">
    <div class="hk-card">
      <div class="hk-card-head">
        <h2>Foydalanuvchilar</h2><span class="nav-cnt" id="usersCnt" data-noi18n>${USERS_CACHE.length}</span>

          <button type="button" class="hk-tool" id="usersReload">↻ Yangilash</button>

}
function usersFiltered(){
  const q = usersQuery.trim().toLowerCase();
  let l = USERS_CACHE.slice();
  if(usersFilter==='active') l = l.filter(u=>!u.blocked);
  if(usersFilter==='blocked') l = l.filter(u=>u.blocked);
  if(usersFilter==='unread') l = l.filter(u=>adminUnread[u.id]);
  if(q) l = l.filter(u=>[u.ism,u.telefon,u.login].some(v=>String(v||'').toLowerCase().includes(q)));
  return l.sort((a,b)=> (adminUnread[b.id]||0) - (adminUnread[a.id]||0));
}
function renderUsersList(){
  const wrap = document.getElementById('usersListWrap'); if(!wrap) return;
  const c = document.getElementById('usersCnt'); if(c) c.textContent = USERS_CACHE.length;
  const counts = {all:USERS_CACHE.length, active:USERS_CACHE.filter(u=>!u.blocked).length, blocked:USERS_CACHE.filter(u=>u.blocked).length, unread:USERS_CACHE.filter(u=>adminUnread[u.id]).length};
  document.querySelectorAll('[data-uflt]').forEach(b=>{ b.querySelector('.ar-chip-n').textContent = counts[b.dataset.uflt]; });
  if(!usersLoaded){ wrap.innerHTML = '<div class="hk-empty">Yuklanmoqda…</div>'; return; }
  const l = usersFiltered();
  if(!l.length){ wrap.innerHTML = `<div class="hk-empty">${ICONS.user}Foydalanuvchi topilmadi.</div>`; i18nApply(wrap); return; }
  wrap.innerHTML = `<table class="hk-table"><thead><tr><th>Ism</th><th>Telefon</th><th>Arizalar</th><th>Holati</th><th></th></tr></thead><tbody>
    ${l.map(u=>{
      const n = adminUnread[u.id]||0;
      const ac = AR_CACHE.filter(a=>a.userId===u.id).length;
      return `<tr data-id="${u.id}" class="${u.id===usersSelId?'sel':''}">
        <td data-noi18n><div class="hk-name">${esc(u.ism||'—')}</div><div class="hk-sub">@${esc(u.login)}</div></td>
        <td data-noi18n style="white-space:nowrap;">${esc(u.telefon||'—')}</td>
        <td data-noi18n>${ac}</td>
        <td><span class="st-badge ${u.blocked?'st-rej':'st-ok'}">${u.blocked?'Nofaol':'Faol'}</span></td>
        <td data-noi18n>${n?`<span class="nav-cnt hot" title="O‘qilmagan xabarlar">💬 ${n}</span>`:''}</td></tr>`;
    }).join('')}</tbody></table>`;
  wrap.querySelectorAll('tbody tr').forEach(tr=> tr.onclick = ()=>{
    usersSelId = tr.dataset.id;
    wrap.querySelectorAll('tbody tr').forEach(x=>x.classList.toggle('sel', x===tr));
    renderUserDetail();
    if(window.innerWidth < 1180){ const d = document.getElementById('userDetail'); if(d) d.scrollIntoView({behavior:'smooth'}); }
  });
  i18nApply(wrap);
}

      </div>

// Foydalanuvchi Firebase konsolidan nusxalagan matnni turli ko'rinishlarda joylashtirishi mumkin:
// faqat { ... } JSON, yoki butun "const firebaseConfig = { ... };" bloki, izohlar bilan yoki izohsiz.
// Bu funksiya barcha holatlarni qabul qiladigan qilib matnni tozalaydi va obyektga aylantiradi.
function parseFirebaseConfigInput(raw){
  let s = String(raw);

  // 1) Ko'p qatorli va bir qatorli JS izohlarini olib tashlash (/* ... */ va // ...)
  s = s.replace(/\/\*[\s\S]*?\*\//g, '');
  s = s.replace(/(^|[^:])\/\/.*$/gm, '$1');

  // 2) Faqat birinchi "{" dan oxirgi "}" gacha bo'lgan qismni olish
  //    (const firebaseConfig = ... yoki oxiridagi ";" avtomatik chetlab o'tiladi)
  const start = s.indexOf('{');
  const end = s.lastIndexOf('}');
  if(start === -1 || end === -1 || end < start){
    throw new Error('firebaseConfig obyekti topilmadi');
  }
  s = s.slice(start, end + 1);

  // 3) Obyekt oxiridagi ortiqcha vergullarni olib tashlash: {a:1, b:2,} -> {a:1, b:2}
  s = s.replace(/,\s*([}\]])/g, '$1');

  // 4) Avval qat'iy JSON sifatida sinab ko'ramiz
  try{
    return JSON.parse(s);
  }catch(e){
    // 5) Agar kalitlar tirnoqsiz yoki bitta tirnoq bilan yozilgan bo'lsa
    //    (masalan apiKey: "...") — buni ham xavfsiz tarzda obyektga aylantiramiz.
    const obj = new Function('"use strict"; return (' + s + ');')();
    if(!obj || typeof obj !== 'object') throw new Error('Noto\u2018g\u2018ri format');
    return obj;
  }
}

// "Hujjat yaratish" (saqlash) va "PDF yuklab olish" (yuklab olish) endi ATAYLAB
// bir-biridan mustaqil ikkita amal: yaratish darhol PDF yuklamaydi, faqat ko'rinishni
// chizadi va bazaga saqlaydi; yuklab olish esa alohida tugma bosilgandagina ishga tushadi.
let lastGenerated = {};

async function generateAndSave(key,kind){
  const statusEl = document.getElementById('status_'+key);
  const submitBtn = document.querySelector('#form_'+key+' button[type=submit]');
  try{
    const d = readForm(key);
    const missing = validate(key,d);
    if(missing.length){
      statusEl.className='status err';
      statusEl.textContent = 'Quyidagi maydonlar to‘ldirilishi shart: '+missing.join(', ');
      return;
    }

    if(submitBtn) submitBtn.disabled = true;
    statusEl.className='status'; statusEl.textContent='Hujjat tayyorlanmoqda…';

    d.no = nextSequenceNumber(key);
    await showPreview(key, d, kind);

    const rec = {id:uid(), kind: kind||'main', data:d, createdAt:new Date().toISOString()};
    DB[key].push(rec);
    persist(key);
    renderTabs();
    renderHistory(key);
    lastGenerated[key] = rec.id;

    statusEl.className='status ok';
    statusEl.textContent = 'Hujjat (№'+d.no+') yaratildi va bazaga saqlandi. PDF fayl olish uchun «PDF yuklab olish» tugmasini bosing.';
  }catch(e){
    statusEl.className='status err';
    statusEl.textContent = 'Xatolik yuz berdi: '+(e && e.message ? e.message : e);
    console.error(e);
  }finally{
    if(submitBtn) submitBtn.disabled = false;
  }
}

// Yuklab olish tugmasi bosilganda mos yozuv topiladi: avval joriy seansda
// yaratilgan hujjat, bo'lmasa bazadagi oxirgi saqlangan hujjat, ular ham
// bo'lmasa — joriy forma ma'lumotlari asosida (validatsiyadan o'tkazib)
// yangi hujjat yaratiladi va o'sha yozuv qaytariladi. Shu tufayli forma
// to'ldirilib darhol «PDF/Word yuklab olish» bosilsa ham ishlaydi.
async function ensureRecordForDownload(key){
  const recId = lastGenerated[key];
  let rec = recId ? DB[key].find(r=>r.id===recId) : null;
  if(rec) return rec;
  if(DB[key] && DB[key].length) return DB[key][DB[key].length-1];
  await generateAndSave(key, key==='bonus'?bonusSubTab:undefined);
  const newRecId = lastGenerated[key];
  return newRecId ? DB[key].find(r=>r.id===newRecId) : null;
}

function insertPageBreakSpacers(paper, pageHeightMm){
  const pxPerMm = paper.offsetWidth / 210;
  const pageHeightPx = pxPerMm * (pageHeightMm || 297);
  const paperTop = paper.getBoundingClientRect().top;
  const avoidEls = paper.querySelectorAll('h3, h4, p, li, table, tr, .sig, .addendum');
  avoidEls.forEach(el=>{
    const rect = el.getBoundingClientRect();
    const top = rect.top - paperTop;
    const bottom = rect.bottom - paperTop;
    const elHeight = bottom - top;
    if(elHeight >= pageHeightPx) return; // o'zi bir sahifadan katta — bo'lishning iloji yo'q
    const pageEnd = (Math.floor(top / pageHeightPx) + 1) * pageHeightPx;
    if(bottom > pageEnd){
      const spacer = document.createElement('div');
      spacer.style.height = (pageEnd - top) + 'px';
      el.parentNode.insertBefore(spacer, el);
    }
  });
}

async function exportPdf(html, filename, sectionKey){
  // Kesilib qolmasligi uchun PDF sahifaning ko'rinadigan (scroll qilinadigan)
  // oynasidan emas, ekrandan tashqarida joylashgan alohida "toza" nusxadan olinadi.
  const holder = document.createElement('div');
  holder.className = 'pdf-offscreen';
  // Shartnoma PDF ko'rinishida chiqqanda shrift majburiy ravishda Times New
  // Roman, razmeri 12 bo'lishi kerak — buni ekrandagi (kichikroq) ko'rinishdan
  // mustaqil ravishda, faqat eksport nusxasiga qo'llaymiz.
  const styleTag = document.createElement('style');
  styleTag.textContent = `
    .pdf-export-font, .pdf-export-font *{ font-family:'Times New Roman', Times, serif !important; font-size:12pt !important; line-height:1.42 !important; }
    .pdf-export-font h3{ font-size:13pt !important; font-weight:700 !important; }
    .pdf-export-font h4{ font-size:12pt !important; font-weight:700 !important; }
    .pdf-export-font b, .pdf-export-font strong{ font-weight:700 !important; }
  `;
  holder.appendChild(styleTag);
  const paper = document.createElement('div');
  paper.className = 'paper pdf-export-font';
  paper.style.width = '210mm';
  paper.innerHTML = html;
  holder.appendChild(paper);
  document.body.appendChild(holder);
  try{
    await new Promise(r=>setTimeout(r,60));

    const pageWidth = 210, pageHeight = 297;
    // Har bir PDF sahifasining tepa va past qismida bo'sh joy (margin) qoldirish uchun.
    // Eski usulda faqat hujjatning eng boshi va oxirida bo'sh joy bo'lib, ikkinchi va
    // undan keyingi sahifalarning tepa/past chetiga matn tegib turardi — shuning uchun
    // rasm sahifalarga yaxlit emas, balki har biri alohida "bo'lak" (slice) sifatida,
    // tepasida va pastida margin bilan qo'shiladi.
    const topMarginMm = 12, bottomMarginMm = 12;
    const usableHeightMm = pageHeight - topMarginMm - bottomMarginMm;

    // Sarlavha, xatboshi, jadval va qatorlar sahifa chegarasida ikkiga bo'linib
    // "kesilib" yoki yarim ko'rinib qolmasligi uchun — ular joylashadigan joyda
    // kerakli bo'sh joy (spacer) qo'shib, elementni keyingi sahifaga o'tkazamiz.
    // Bu yerda aynan yuqoridagi usableHeightMm (chekka joylar ayirilgan haqiqiy
    // sahifa balandligi) bo'yicha hisoblanadi, aks holda spacer joylari PDF dagi
    // haqiqiy sahifa chegaralariga to'g'ri kelmay qolardi.
    insertPageBreakSpacers(paper, usableHeightMm);

    const canvas = await html2canvas(paper, {
      scale:2, backgroundColor:'#ffffff', useCORS:true,
      windowWidth: paper.scrollWidth, windowHeight: paper.scrollHeight
    });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const imgWidth = pageWidth;
    const pxPerMm = canvas.width / imgWidth;
    const usableHeightPx = Math.max(1, Math.round(usableHeightMm * pxPerMm));
    let renderedPx = 0;
    let firstPage = true;
    while(renderedPx < canvas.height){
      const sliceHeightPx = Math.min(usableHeightPx, canvas.height - renderedPx);
      const sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = canvas.width;
      sliceCanvas.height = sliceHeightPx;
      const sctx = sliceCanvas.getContext('2d');
      sctx.fillStyle = '#ffffff';
      sctx.fillRect(0,0,sliceCanvas.width, sliceCanvas.height);
      sctx.drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
      const sliceImgData = sliceCanvas.toDataURL('image/png');
      const sliceHeightMm = sliceHeightPx / pxPerMm;
      if(!firstPage) pdf.addPage();
      pdf.addImage(sliceImgData,'PNG',0,topMarginMm,imgWidth,sliceHeightMm);
      renderedPx += sliceHeightPx;
      firstPage = false;
    }
    const savedToFolder = await saveBlobToFolder(pdf.output('blob'), filename, sectionKey);
    if(!savedToFolder) pdf.save(filename);
  }finally{
    document.body.removeChild(holder);
  }
}

/* ============================= WORD (.doc) KO'RINISHIDA YUKLAB OLISH ============================= */
// Shartnoma matni Microsoft Word bilan mos HTML-hujjat sifatida yaratiladi (Word
// bunday faylni ochganda oddiy hujjat kabi to'g'ridan-to'g'ri ochadi). Butun hujjat
// matni Times New Roman shriftida, 12 razmerda chiqishi majburiy talab qilingan.
function buildWordDocument(bodyHtml, title){
  return `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head>
<meta charset="utf-8">
<title>${esc(title||'Shartnoma')}</title>
<!--[if gte mso 9]>
<xml>
  <w:WordDocument>
    <w:View>Print</w:View>
    <w:Zoom>100</w:Zoom>
    <w:DoNotOptimizeForBrowser/>
  </w:WordDocument>
</xml>
<![endif]-->
<style>
  @page Section1{ size:210mm 297mm; margin:20mm 18mm 20mm 18mm; mso-page-orientation:portrait; }
  div.Section1{ page:Section1; }
  *{ font-family:'Times New Roman', Times, serif !important; font-size:12pt !important; color:#000; }
  body{ font-family:'Times New Roman', Times, serif; font-size:12pt; line-height:1.4; }
  h3{ font-size:13pt !important; font-weight:bold; text-align:center; margin:0 0 4pt; }
  h4{ font-size:12pt !important; font-weight:bold; margin:14pt 0 6pt; }
  p{ margin:5pt 0; text-align:justify; }
  .center{ text-align:center; }
  .doc-date{ text-align:right; margin-bottom:10pt; }
  table{ width:100%; border-collapse:collapse; margin:8pt 0; }
  table td, table th{ border:1pt solid #000; padding:4pt 6pt; }
  .sig{ width:100%; margin-top:22pt; }
  .ph{ font-style:italic; }
  .addendum{ margin-top:16pt; border-top:1pt dashed #999; padding-top:10pt; }
</style>
</head>
<body>
<div class="Section1">${bodyHtml}</div>
</body>
</html>`;
}

async function exportWord(html, filename, sectionKey){
  const wordHtml = buildWordDocument(html, filename);
  const blob = new Blob(['\ufeff', wordHtml], {type:'application/msword'});
  const savedToFolder = await saveBlobToFolder(blob, filename, sectionKey);
  if(!savedToFolder){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }
}

/* ============================= KOMPYUTERDAGI PAPKAGA (masalan, D: DISKKA) SAQLASH ============================= */
// File System Access API orqali foydalanuvchi bir marta papka (masalan, D: diskdagi
// papka) tanlaydi, shu papka manzili brauzerda (IndexedDB) eslab qolinadi va shundan
// keyin barcha yaratilgan shartnoma PDF fayllari avtomatik ravishda o'sha papkaga
// yozib boriladi. Bu funksiya faqat Chrome/Edge kabi Chromium brauzerlarida ishlaydi;
// qo'llab-quvvatlanmasa, tizim odatdagidek brauzer orqali yuklab olishga o'tadi.
const FS_DB_NAME = 'birzum_fs_handles';
const FS_STORE = 'handles';
const FS_KEY = 'save_dir';
let savedDirHandle = null;

function openHandleDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB yo‘q')); return; }
    const req = indexedDB.open(FS_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(FS_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSetHandle(handle){
  try{
    const db = await openHandleDB();
    await new Promise((res,rej)=>{
      const tx = db.transaction(FS_STORE,'readwrite');
      tx.objectStore(FS_STORE).put(handle, FS_KEY);
      tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){ console.error('Papka manzilini saqlab bo‘lmadi', e); }
}
async function idbGetHandle(){
  try{
    const db = await openHandleDB();
    return await new Promise((res,rej)=>{
      const tx = db.transaction(FS_STORE,'readonly');
      const req = tx.objectStore(FS_STORE).get(FS_KEY);
      req.onsuccess = ()=>res(req.result || null);
      req.onerror = ()=>rej(req.error);
    });
  }catch(e){ return null; }
}
async function idbClearHandle(){
  try{
    const db = await openHandleDB();
    await new Promise((res,rej)=>{
      const tx = db.transaction(FS_STORE,'readwrite');
      tx.objectStore(FS_STORE).delete(FS_KEY);
      tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){}
}
async function verifyFolderPermission(handle, requestIfNeeded){
  if(!handle) return false;
  const opts = {mode:'readwrite'};
  try{
    if((await handle.queryPermission(opts)) === 'granted') return true;
    if(requestIfNeeded && (await handle.requestPermission(opts)) === 'granted') return true;
  }catch(e){}
  return false;
}
async function initSaveFolder(){
  try{ savedDirHandle = await idbGetHandle(); }catch(e){ savedDirHandle = null; }
}
async function chooseSaveFolder(){
  if(!window.showDirectoryPicker){
    alert('Diqqat: brauzeringiz kompyuterdagi papkani to‘g‘ridan-to‘g‘ri tanlashni qo‘llab-quvvatlamaydi (bu funksiya faqat Google Chrome yoki Microsoft Edge brauzerlarida ishlaydi). PDF fayllar odatdagidek «Yuklab olingan fayllar» (Downloads) papkasiga saqlanadi — kerak bo‘lsa, brauzer sozlamalaridan yuklab olish papkasini D: diskka o‘zgartirishingiz mumkin.');
    return;
  }
  try{
    const handle = await window.showDirectoryPicker({id:'birzum-save-folder', mode:'readwrite'});
    const ok = await verifyFolderPermission(handle, true);
    if(!ok){ alert('Tanlangan papkaga yozish uchun ruxsat berilmadi.'); return; }
    savedDirHandle = handle;
    await idbSetHandle(handle);
    updateFolderStatusUI();
  }catch(e){
    if(e && e.name === 'AbortError') return;
    console.error(e);
    alert('Papka tanlashda xatolik yuz berdi: '+(e && e.message ? e.message : e));
  }
}
// Ba'zi brauzerlarda (masalan kompyuter/brauzer qayta ishga tushirilgandan keyin)
// avval tanlangan papkaga yozish ruxsati "ünutilishi" mumkin — bunday holatda
// avtomatik zaxiralash sukut bo'yicha (foydalanuvchi bosishisiz) qayta ruxsat
// so'ray olmaydi va HECH QANDAY OGOHLANTIRISHSIZ saqlamay qo'yishi mumkin edi.
// Shu sababli ilova ochilganda ruxsat holati tekshiriladi va zarur bo'lsa
// foydalanuvchiga ruxsatni bitta tugma bosish orqali qayta tasdiqlash imkoni
// ko'rsatiladi — shu orqali har bir bo‘limning o‘z papkasiga saqlanishi
// barqaror ishlaydi.
async function updateFolderStatusUI(){
  const el = document.getElementById('folderStatus');
  if(!el) return;
  if(!savedDirHandle){
    el.textContent = 'Hozircha papka tanlanmagan — PDF fayllar brauzerning standart «Yuklab olingan fayllar» papkasiga saqlanadi.';
    return;
  }
  let granted = false;
  try{ granted = (await savedDirHandle.queryPermission({mode:'readwrite'})) === 'granted'; }catch(e){ granted = false; }
  if(granted){
    el.innerHTML = '<span style="color:var(--ok);font-weight:700;">✓ Tanlangan papka: «'+esc(savedDirHandle.name)+'»</span> — har bir bo‘lim (Hamkorlar, Bosh kelishuv, Qo‘shimcha kelishuv, Bonus) uchun shu papka ichida avtomatik alohida ichki papka yaratiladi va shu bo‘limga tegishli barcha fayllar (PDF, Word, zaxira) faqat o‘sha ichki papkaga saqlanadi.';
  }else{
    el.innerHTML = '<span style="color:var(--danger);font-weight:700;">⚠ «'+esc(savedDirHandle.name)+'» papkasiga yozish ruxsati qayta tasdiqlanishi kerak</span> (odatda brauzer qayta ochilgandan keyin yuz beradi) — aks holda bo‘limlar o‘z papkasiga avtomatik saqlanmaydi. <button type="button" class="secondary" id="reconfirmFolderBtn" style="margin-left:6px;">Ruxsatni qayta tasdiqlash</button>';
    const btn = document.getElementById('reconfirmFolderBtn');
    if(btn) btn.onclick = async ()=>{
      const ok = await verifyFolderPermission(savedDirHandle, true);
      if(!ok) alert('Ruxsat berilmadi — papkani qaytadan tanlashga to‘g‘ri kelishi mumkin.');
      updateFolderStatusUI();
    };
  }
}
// PDF/Word/Excel/zaxira fayllar endi tanlangan papka ICHIDA, bo'lim nomi bilan
// avtomatik yaratiladigan ALOHIDA ICHKI PAPKAGA yoziladi (masalan, "D:\BirZum\
// Bosh kelishuv\..."), umumiy papkaga aralashtirilmaydi.
const SECTION_FOLDER_NAME = {
  hamkor: 'Hamkorlar',
  bosh: 'Bosh kelishuv',
  qoshimcha: 'Qoshimcha kelishuv',
  bonus: 'Bonus'
};
async function getSectionDirHandle(sectionKey){
  if(!savedDirHandle || !sectionKey) return savedDirHandle || null;
  try{
    const name = SECTION_FOLDER_NAME[sectionKey] || sectionKey;
    return await savedDirHandle.getDirectoryHandle(name, {create:true});
  }catch(e){
    console.error('Bo‘lim papkasini yaratishda xatolik', e);
    return savedDirHandle;
  }
}
// PDF/Word/Excel/JSON blobni tanlangan papkaning tegishli bo'lim-ichki-papkasiga
// yozishga urinadi. sectionKey berilmasa, to'g'ridan-to'g'ri asosiy papkaga yozadi.
// Muvaffaqiyatli bo'lsa true qaytaradi.
async function saveBlobToFolder(blob, filename, sectionKey){
  if(!savedDirHandle) return false;
  try{
    const ok = await verifyFolderPermission(savedDirHandle, true);
    if(!ok) return false;
    const dirHandle = await getSectionDirHandle(sectionKey);
    if(!dirHandle) return false;
    const fileHandle = await dirHandle.getFileHandle(filename, {create:true});
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();
    return true;
  }catch(e){
    console.error('Papkaga saqlashda xatolik', e);
    return false;
  }
}

function renderHistory(key){
  const host = document.getElementById('hist_'+key);
  if(!host) return;
  const searchEl = document.getElementById('histSearch_'+key);
  const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
  let list = DB[key].slice().reverse();
  if(q){
    list = list.filter(r=>{
      const stirVal = String((r.data && r.data.stir) || '').toLowerCase();
      const nameVal = String((r.data && r.data.tashkilot_nomi) || '').toLowerCase();
      return stirVal.includes(q) || nameVal.includes(q);
    });
  }
  if(!list.length){
    host.innerHTML = q
      ? '<div class="empty-hist">«'+esc(searchEl.value)+'» bo‘yicha hech qanday hujjat topilmadi.</div>'
      : '<div class="empty-hist">Hozircha saqlangan hujjatlar yo‘q.</div>';
    return;
  }
  host.innerHTML = `
    <table class="history">
      <tr><th>Tashkilot</th><th>STIR</th><th>Sana</th>${key==='bonus'?'<th>Turi</th>':''}<th></th></tr>
      ${list.map(r=>`
        <tr>
          <td>${esc(labelFor(key,r.data,r.kind))}</td>
          <td>${esc((r.data && r.data.stir) ? r.data.stir : '—')}</td>
          <td>${esc(new Date(r.createdAt).toLocaleString('uz-UZ'))}</td>
          ${key==='bonus'?`<td><span class="badge ${r.kind==='cancel'?'cancel':'bonus'}">${r.kind==='cancel'?'Bekor qilish':'Bonus'}</span></td>`:''}
          <td>
            <button class="link-btn" data-act="dl" data-id="${r.id}">PDF yuklab olish</button>
            <button class="link-btn" data-act="dlword" data-id="${r.id}">Word yuklab olish</button>
            <button class="link-btn" data-act="edit" data-id="${r.id}">Formaga qaytarish</button>
            <button class="link-btn del" data-act="del" data-id="${r.id}">O‘chirish</button>
          </td>
        </tr>`).join('')}
    </table>`;

  host.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = async ()=>{
      const rec = DB[key].find(r=>r.id===btn.dataset.id);
      if(!rec) return;
      if(btn.dataset.act==='dl'){
        const originalLabel = btn.textContent;
        try{
          btn.disabled = true; btn.textContent = 'Tayyorlanmoqda…';
          await showPreview(key, rec.data, rec.kind);
          await new Promise(r=>setTimeout(r,50));
          if(key==='bosh'){
            await exportBoshPdf(rec.data, fileNameFor(key,rec.data,rec.kind), key);
          }else{
            await exportPdf(docBuilder(key,rec.data,rec.kind), fileNameFor(key,rec.data,rec.kind), key);
          }
        }catch(e){
          alert('PDF yaratishda xatolik: '+(e && e.message ? e.message : e));
          console.error(e);
        }finally{
          btn.disabled = false; btn.textContent = originalLabel;
        }
      }else if(btn.dataset.act==='dlword'){
        const originalLabel = btn.textContent;
        try{
          btn.disabled = true; btn.textContent = 'Tayyorlanmoqda…';
          if(key==='bosh'){
            await exportBoshDocx(rec.data, fileNameFor(key,rec.data,rec.kind,'docx'), key);
          }else{
            const docHtml = docBuilder(key,rec.data,rec.kind);
            await exportWord(docHtml, fileNameFor(key,rec.data,rec.kind,'doc'), key);
          }
        }catch(e){
          alert('Word fayl yaratishda xatolik: '+(e && e.message ? e.message : e));
          console.error(e);
        }finally{
          btn.disabled = false; btn.textContent = originalLabel;
        }
      }else if(btn.dataset.act==='edit'){
        writeForm(key, rec.data);
        if(key==='bonus'){ bonusSubTab = rec.kind==='cancel'?'cancel':'bonus'; renderApp(); writeForm(key, rec.data); }
        showPreview(key, rec.data, rec.kind).catch(e=>console.error(e));
      }else if(btn.dataset.act==='del'){
        if(confirm('Ushbu hujjatni bazadan o‘chirishni tasdiqlaysizmi?')){
          DB[key] = DB[key].filter(r=>r.id!==rec.id);
          persist(key);
          renderTabs();
          renderHistory(key);
        }
      }
    };
  });
}

function bindSectionEvents(key){
  if(key === 'arizalar'){ bindArizalarEvents(); return; }
  if(key === 'users'){ bindUsersEvents(); return; }
  if(key === 'profil'){
    bindProfilEvents();
    return;
  }
  if(key === 'hamkor'){
    bindHamkorEvents();
    return;
  }
  const form = document.getElementById('form_'+key);
  if(form){
    form.onsubmit = (e)=>{
      e.preventDefault();
      generateAndSave(key, key==='bonus'?bonusSubTab:undefined);
    };
  }
  const clearBtn = document.getElementById('clear_'+key);
  if(clearBtn){
    clearBtn.onclick = ()=>{
      form.reset();
      const pvEl = document.getElementById('preview_'+key);
      resetPreviewHost(pvEl);
      pvEl.innerHTML = '<div class="empty-preview">Formani to‘ldirib «Shartnoma yaratish» tugmasini bosing.</div>';
      document.getElementById('status_'+key).textContent = '';
    };
  }
  const dlBtn = document.getElementById('dl_'+key);
  if(dlBtn){ dlBtn.onclick = ()=> downloadGeneratedPdf(key); }
  const dlWordBtn = document.getElementById('dlword_'+key);
  if(dlWordBtn){ dlWordBtn.onclick = ()=> downloadGeneratedWord(key); }
  // Excel/CSV fayldan import qilish tugmasi — barcha bo'limlarda (bosh, qoshimcha,
  // bonus) ishlashi uchun tugma bosilganda fayl tanlash oynasi ochilishi kerak.
  bindImportButton(key);
  if(key==='bonus'){
    document.querySelectorAll('.subtab').forEach(st=>{
      st.onclick = ()=>{
        const d = readForm('bonus');
        bonusSubTab = st.dataset.sub;
        renderApp();
        writeForm('bonus', d);
      };
    });
  }
  // STIR bo'yicha "Tortib olish" tugmasi — Bosh kelishuvda kiritilgan STIR
  // asosida shu bo'lim formasini avtomatik to'ldiradi.
  if(key==='bosh' || key==='qoshimcha' || key==='bonus'){
    const stirBtn = document.getElementById('stirfill_'+key);
    if(stirBtn){
      stirBtn.onclick = ()=> autofillFromBosh(key);
    }
  }
  // Saqlangan hujjatlar ro'yxatini STIR yoki tashkilot nomi bo'yicha qidirish —
  // teriladigan har bir harfda ro'yxat jonli (live) filtrlanadi.
  const histSearchEl = document.getElementById('histSearch_'+key);
  if(histSearchEl){
    histSearchEl.oninput = ()=> renderHistory(key);
  }
  renderHistory(key);
}

loadUiPrefs();
applyUiPrefs();
if(isAuthed()){ showApp(); } else if(getUserSession()){ showUserApp(); } else { showLogin(); }
